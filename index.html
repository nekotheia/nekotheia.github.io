    const idb = {
      db: null,
      init: async () => {
        if (idb.db) return idb.db;
        return new Promise((resolve, reject) => {
          const req = indexedDB.open('mawuang_db', 11);
          req.onupgradeneeded = (e) => { 
              if(!e.target.result.objectStoreNames.contains('store')) {
                 e.target.result.createObjectStore('store'); 
              }
          };
          req.onsuccess = (e) => { idb.db = e.target.result; resolve(idb.db); };
          req.onerror = () => reject('IDB error');
        });
      },
      get: async (key) => {
        const db = await idb.init();
        return new Promise((resolve) => {
          const tx = db.transaction('store', 'readonly');
          const req = tx.objectStore('store').get(key);
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => resolve(null);
        });
      },
      set: async (key, val) => {
        const db = await idb.init();
        return new Promise((resolve) => {
          const tx = db.transaction('store', 'readwrite');
          tx.objectStore('store').put(val, key);
          tx.oncomplete = () => resolve();
        });
      },
      remove: async (key) => {
        const db = await idb.init();
        return new Promise((resolve) => {
          const tx = db.transaction('store', 'readwrite');
          tx.objectStore('store').delete(key);
          tx.oncomplete = () => resolve();
        });
      }
    };

    const compressImage = (file, callback) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = event => {
        const img = new Image();
        img.src = event.target.result;
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const MAX_WIDTH = 600; 
          let scaleSize = 1;
          if (img.width > MAX_WIDTH) { scaleSize = MAX_WIDTH / img.width; }
          canvas.width = img.width * scaleSize;
          canvas.height = img.height * scaleSize;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          callback(canvas.toDataURL('image/jpeg', 0.7));
        }
      }
    };

      const parseSmartInput = (text, currentCategories) => {
          let amount = 0;
          let currency = 'IDR';
          let categoryId = '';
          let suggestedCatName = '';
          let type = 'expense';

          let processText = text.toLowerCase().replace('go-jek', 'gojek');
          
          // Konversi kata menjadi angka dasar
          const numMap = {'satu': 1, 'dua': 2, 'tiga': 3, 'empat': 4, 'lima': 5, 'enam': 6, 'tujuh': 7, 'delapan': 8, 'lapan': 8, 'sembilan': 9};
          for (const [word, digit] of Object.entries(numMap)) {
              processText = processText.replace(new RegExp(`\\b${word} ratus\\b`, 'g'), `${digit}00`);
              processText = processText.replace(new RegExp(`\\b${word} ribu\\b`, 'g'), `${digit} ribu`);
              processText = processText.replace(new RegExp(`\\b${word} juta\\b`, 'g'), `${digit} juta`);
              processText = processText.replace(new RegExp(`\\b${word}\\b`, 'g'), digit);
          }

          // Aturan Setengah
          processText = processText.replace(/(\d+(?:[.,]\d+)?)\s*juta\s*setengah/g, "$1.5 juta");
          processText = processText.replace(/(\d+(?:[.,]\d+)?)\s*ribu\s*setengah/g, "$1.5 ribu");
          processText = processText.replace(/(\d+(?:[.,]\d+)?)\s*setengah/g, "$1.5");
          processText = processText.replace(/\bsetengah\b/g, "0.5");
          
          // Bahasa Gaul / Slang
          processText = processText.replace(/\bseceng\b/g, "1 ribu");
          processText = processText.replace(/\bcenggo\b/g, "1.5 ribu");
          processText = processText.replace(/\bgoceng\b/g, "5 ribu");
          processText = processText.replace(/\bceban\b/g, "10 ribu");
          processText = processText.replace(/\bgoban\b/g, "50 ribu");
          processText = processText.replace(/\bcetiaw\b/g, "1 juta");
          processText = processText.replace(/\bgotiaw\b/g, "5 juta");
          
          // Slang ratusan
          processText = processText.replace(/\bgocap\b/g, "50");
          processText = processText.replace(/\bcepek\b/g, "100");
          processText = processText.replace(/\bpekgo\b/g, "150");
          processText = processText.replace(/\bgopek\b/g, "500");

          processText = processText.replace(/\bseribu\b/g, "1 ribu");
          processText = processText.replace(/\bsejuta\b/g, "1 juta");
          processText = processText.replace(/\bsebelas\b/g, "11");
          processText = processText.replace(/\bsepuluh\b/g, "10");
          
          let note = processText;

          // Deteksi Mata Uang
          if (processText.includes('yen') || processText.includes('¥') || processText.includes('円')) currency = 'JPY';
          if (processText.includes('rp') || processText.includes('rupiah')) currency = 'IDR';

          // EKSTRAKSI ANGKA (Mendukung titik dan koma panjang spt 1.500.000)
          const amountRegex = /(\d+([.,]\d+)*)\s*(rb|ribu|ribuan|k|jt|juta|jutaan|man|万|sen|千|ceng)?/i;
          const match = processText.match(amountRegex);

          if (match) {
              let rawStr = match[1];
              let baseVal = 0;
              
              if (/^(\d{1,3})([.,]\d{3})+$/.test(rawStr)) {
                  baseVal = parseFloat(rawStr.replace(/[.,]/g, '')); // Angka normal panjang
              } else {
                  rawStr = rawStr.replace(/,/g, '.');
                  const parts = rawStr.split('.');
                  if (parts.length > 1) {
                      const decimalPart = parts.pop();
                      baseVal = parseFloat(parts.join('') + '.' + decimalPart);
                  } else {
                      baseVal = parseFloat(rawStr);
                  }
              }

              let multiplier = match[3] ? match[3].toLowerCase() : '';
              
              if (['rb', 'ribu', 'ribuan', 'k', 'ceng'].includes(multiplier)) baseVal *= 1000;
              if (['jt', 'juta', 'jutaan'].includes(multiplier)) baseVal *= 1000000;
              if (['man', '万'].includes(multiplier)) baseVal *= 10000;
              if (['sen', '千'].includes(multiplier)) baseVal *= 1000;
              
              // Jika IDR dan nilai di bawah 1000 tanpa keterangan "ribu" (Auto Scale)
              if (!multiplier && currency === 'IDR') {
                  if (baseVal > 0 && baseVal <= 999) {
                      baseVal *= 1000; 
                  }
              }

              amount = baseVal;
              // Membersihkan teks untuk dijadikan catatan
              note = processText.replace(match[0], '').trim();
              note = note.replace(/\b(yen|rp|rupiah|円|rb|ribu|k|juta|jt|ceng)\b/gi, '').trim();
              note = note.replace(/\s+/g, ' ').trim(); 
          }
          
          note = note.charAt(0).toUpperCase() + note.slice(1);
          const lowerText = processText;
          
          // Keyword Map Pintar (Mencakup Pendapatan Lain untuk THR/Angpao/Dapat)
          const keywordMap = {
              'Makanan': ['makan', 'minum', 'nasi', 'kopi', 'food', 'snack', 'sarapan', 'siang', 'malam', 'sushi', 'ramen', 'bento', 'tabemono', 'nomimono', 'hirugohan', 'bangohan', 'asagohan', 'okashi'],
              'Transportasi': ['bensin', 'parkir', 'gojek', 'grab', 'maxim', 'ojek', 'indrive', 'kereta', 'bus', 'suica', 'pasmo', 'tol', 'tiket', 'taxi', 'taksi', 'mrt', 'shinkansen', 'densha', 'basu', 'koutsuu', 'kotsu'],
              'Belanja': ['belanja', 'supermarket', 'pasar', 'minimarket', 'baju', 'sepatu', 'donki', 'daiso', 'kombini', 'kaimono', 'shoppingu', 'pakaian'],
              'Hobi': ['gundam', 'mainan', 'game', 'nonton', 'bioskop', 'konser', 'hobby', 'anime', 'manga', 'komik', 'figure', 'gacha', 'playstation', 'nintendo'],
              'Kesehatan': ['obat', 'dokter', 'rs', 'rumah sakit', 'klinik', 'apotek', 'kusuri', 'byouin', 'vitamin'],
              'Tagihan': ['listrik', 'air', 'internet', 'wifi', 'gas', 'pajak', 'sewa', 'kos', 'yachin', 'denki', 'suidou', 'gasu'],
              'Gaji': ['gaji', 'bonus', 'bayaran', 'fee', 'arubaito', 'kyuuryou', 'shunyu'],
              'Pendapatan Lain': ['dapat', 'dapet', 'dikasih', 'terima', 'pemasukan', 'pendapatan', 'untung', 'laba', 'profit', 'menang', 'jual', 'cair', 'diberi', 'nemu', 'cashback', 'thr', 'angpao', 'angpau', 'amplop']
          };

          for (let cat of currentCategories) {
              if (lowerText.includes(cat.name.toLowerCase()) || (cat.nameJp && lowerText.includes(cat.nameJp.toLowerCase()))) {
                  categoryId = cat.id; type = cat.type; break;
              }
          }

          if (!categoryId) {
              for (const [catName, words] of Object.entries(keywordMap)) {
                  if (words.some(w => lowerText.includes(w))) {
                      const matchedCat = currentCategories.find(c => c.name.toLowerCase() === catName.toLowerCase() || c.name.toLowerCase().includes(catName.toLowerCase()));
                      if (matchedCat) {
                          categoryId = matchedCat.id; type = matchedCat.type;
                      } else {
                          suggestedCatName = catName;
                          type = ['Gaji', 'Pendapatan Lain'].includes(catName) ? 'income' : 'expense';
                      }
                      break;
                  }
              }
          }
          
          // Mencegah duplikasi Lain-lain
          if (!categoryId && !suggestedCatName) {
              const existingLainLain = currentCategories.find(c => c.name.toLowerCase().replace(/\s/g, '') === 'lainlain' || c.name.toLowerCase() === 'lainnya');
              if (existingLainLain) {
                  categoryId = existingLainLain.id;
                  type = existingLainLain.type;
              } else {
                  suggestedCatName = 'Lain-lain';
                  type = 'expense';
              }
          }

          return { amount, currency, categoryId, suggestedCatName, type, note };
      };

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          setIsScanning(true);
          setScanError(false);
          compressImage(file, async (compressedDataUrl) => {
            try {
              const result = await Tesseract.recognize(file, 'ind+eng+jpn');
              const text = result.data.text.toUpperCase();
              
              const isJapaneseReceipt = /(¥|円|合計|お買上額|お預り|お釣|消費税|SUICA|PASMO|PAYPAY)/.test(text);
              const detectedCurrency = isJapaneseReceipt ? 'JPY' : 'IDR';
              let detectedWallet = wallets[0]?.id || 'cash';
              const ewalletRegex = /(QRIS|PAYPAY|SUICA|PASMO|電子マネー|GOPAY|SHOPEEPAY|SPAY|OVO|DANA|LINKAJA|E-WALLET)/;
              const bankRegex = /(CREDIT|KREDIT|DEBIT|KARTU|CARD|カード|クレジット|MANDIRI|BCA|BNI|BRI|VISA|MASTER)/;
              
              if (ewalletRegex.test(text)) detectedWallet = wallets.find(w => w.id === 'ewallet' || w.name.toUpperCase().includes('E-WALLET') || w.name.toUpperCase().includes('PAY'))?.id || detectedWallet;
              else if (bankRegex.test(text)) detectedWallet = wallets.find(w => w.id === 'bank' || w.name.toUpperCase().includes('BANK') || w.name.toUpperCase().includes('KARTU'))?.id || detectedWallet;

              const flatText = text.replace(/\s+/g, ' ').replace(/T O T A L/g, 'TOTAL').replace(/合 計/g, '合計');

              let foundAmount = '';
              const getAmountFromProximity = (keywordsArray) => {
                  let maxVal = 0;
                  for (let kw of keywordsArray) {
                      let startIndex = 0, index;
                      while ((index = flatText.indexOf(kw, startIndex)) > -1) {
                          const scanRadius = flatText.substring(index, index + kw.length + 60);
                          const matches = scanRadius.match(/(?:RP|¥)?\s*(\d{1,3}([.,]\d{3})+|\d{3,8})/g);
                          if (matches) {
                              for(let m of matches) {
                                  const cleanVal = parseInt(m.replace(/[^\d]/g, ''), 10);
                                  if (cleanVal > 0 && cleanVal < 50000000 && cleanVal.toString().length < 9) {
                                      if(cleanVal > maxVal) maxVal = cleanVal;
                                  }
                              }
                          }
                          startIndex = index + kw.length;
                      }
                      if (maxVal > 0) return maxVal.toString(); 
                  }
                  return '';
              };

              const tier1 = ['TOTAL BELANJA', 'GRAND TOTAL', 'TOTAL TAGIHAN', 'HARGA JUAL', 'お買上額'];
              const tier2 = ['TOTAL', 'T0TAL', 'AMOUNT', '合計', '計', 'CREDIT', 'KREDIT', 'DEBIT', 'QRIS', 'PAYPAY', 'SUICA', 'PASMO', 'カード', 'クレジット', '電子マネー', 'GOPAY', 'SHOPEEPAY'];
              const tier3 = ['BAYAR', 'DIBAYAR', 'CASH', 'TUNAI', '預り', 'お預り'];

              foundAmount = getAmountFromProximity(tier1);
              if (!foundAmount) foundAmount = getAmountFromProximity(tier2);
              if (!foundAmount) foundAmount = getAmountFromProximity(tier3);
              
              if (!foundAmount) {
                  const fallbackRegex = /(?:RP|¥|YEN|円)\s*(\d+([.,]\d{3})*)/g;
                  let match, maxFallback = 0;
                  while ((match = fallbackRegex.exec(flatText)) !== null) {
                      const val = parseInt(match[1].replace(/[^\d]/g, ''), 10);
                      if (val > maxFallback && val < 50000000) maxFallback = val;
                  }
                  if (maxFallback > 0) foundAmount = maxFallback.toString();
              }

              setIsScanning(false);
              setIsScannerOpen(false);
              
              if (foundAmount) {
                 handleOpenTxModal('expense', foundAmount, detectedCurrency, lang === 'id' ? 'Dari Pindai Struk' : 'レシートスキャンから', compressedDataUrl, detectedWallet);
              } else {
                 setTempScanPhoto(compressedDataUrl);
                 setScanError(true);
                 setIsScannerOpen(true);
              }
            } catch (err) {
              setIsScanning(false);
              setTempScanPhoto(compressedDataUrl);
              setScanError(true);
            }
          });
        }
      };

        const headers = ['Transaction ID', 'Date', 'Time', 'Type', 'Category', 'Wallet', 'Note', 'Currency', 'Amount', `Converted Amount (${displayCurrency})`];
        const rows = transactions.map(tx => {

          const convertedAmount = getConvertedAmount(tx.amount, tx.currency || 'IDR', displayCurrency);

          return [ tx.id, txDate.toLocaleDateString(), txDate.toLocaleTimeString(), tx.type === 'income' ? 'Income' : 'Expense', safeCat, safeWallet, safeNote, tx.currency || 'IDR', tx.amount, convertedAmount.toFixed(2) ].join(';');

                      setOnboardingStep(3);

              console.error("Firebase Login Error:", err);
              setSyncStatus('idle'); 
              let errorMsg = err.message || 'Gagal terhubung ke Cloud. Pastikan koneksi internet aktif.';
              
              if (err.code === 'auth/unauthorized-domain') {

              <input type="text" value={newWalletName} onChange={e => setNewWalletName(e.target.value)} placeholder="Nama Dompet" className="flex-1 bg-gray-50 p-3 rounded-2xl outline-none text-sm font-semibold focus:ring-2 focus:ring-[#8B9D83]" />

                      <input type="text" value={editingWallet.name} onChange={e => setEditingWallet({...editingWallet, name: e.target.value, nameJp: e.target.value})} className="flex-1 bg-white p-2 rounded-xl text-sm font-semibold outline-none" />

                        <WalletIcon size={16} className="text-gray-400" />

                      <div className="flex gap-2">
                        <button onClick={() => setEditingWallet(w)} className="text-gray-400 hover:text-blue-500 p-1.5 bg-white rounded-lg shadow-sm"><Edit2 size={14}/></button>
                        <button onClick={() => handleDeleteWallet(w.id)} className="text-gray-400 hover:text-red-500 p-1.5 bg-white rounded-lg shadow-sm"><Trash2 size={14}/></button>
                      </div>
                    </>
                  )}
                </div>
              ))}
            </div>
          </div>
        </div>
      );

      const renderReport = () => {
        const now = new Date();
        let filteredTx = [];
        
        if (reportPeriod === 'year') {
           filteredTx = transactions.filter(t => new Date(t.date).getFullYear() === now.getFullYear());
        } else if (reportPeriod === 'month') {
           filteredTx = transactions.filter(t => new Date(t.date).getMonth() === now.getMonth() && new Date(t.date).getFullYear() === now.getFullYear());
        } else if (reportPeriod === 'week') {
           const weekAgo = new Date(); weekAgo.setDate(now.getDate() - 7);
           filteredTx = transactions.filter(t => new Date(t.date) >= weekAgo);
        } else if (reportPeriod === 'custom' && customStartDate && customEndDate) {
           const start = new Date(customStartDate); start.setHours(0,0,0,0);
           const end = new Date(customEndDate); end.setHours(23,59,59,999);
           filteredTx = transactions.filter(t => { const d = new Date(t.date); return d >= start && d <= end; });
        } else {
           filteredTx = transactions;
        }

        const repIn = filteredTx.filter(t => t.type === 'income').reduce((acc, curr) => acc + getConvertedAmount(curr.amount, curr.currency || 'IDR', displayCurrency), 0);
        const repOut = filteredTx.filter(t => t.type === 'expense').reduce((acc, curr) => acc + getConvertedAmount(curr.amount, curr.currency || 'IDR', displayCurrency), 0);
        
        const expenseByCategory = filteredTx.filter(t => t.type === 'expense').reduce((acc, curr) => {
          const cName = getCatName(categories.find(c => c.id === curr.categoryId)) || 'Lainnya';
          acc[cName] = (acc[cName] || 0) + getConvertedAmount(curr.amount, curr.currency || 'IDR', displayCurrency);
          return acc;
        }, {});
        
        const sortedExpenses = Object.entries(expenseByCategory).sort((a,b) => b[1] - a[1]);

        return (
          <div className="p-6 md:p-10 pb-24 md:pb-10 animate-fade-in max-w-4xl mx-auto">
            <div className="flex justify-between items-center mb-6">
               <h2 className="text-2xl font-bold text-[#4A4A4A]">{t.report}</h2>
               <button onClick={() => setIsExportModalOpen(true)} className="bg-[#8B9D83] text-white p-2.5 rounded-xl shadow-md active:scale-95"><Download size={20}/></button>
            </div>
            
            <div className="flex gap-2 overflow-x-auto hide-scrollbar mb-6 pb-1">
              {[ {id: 'year', label: t.yearly}, {id: 'month', label: t.monthly}, {id: 'week', label: t.weekly}, {id: 'custom', label: t.custom} ].map(p => (
                <button key={p.id} onClick={() => setReportPeriod(p.id)} className={`px-5 py-2.5 rounded-full text-xs font-bold whitespace-nowrap transition-colors shadow-sm ${reportPeriod === p.id ? 'bg-[#8B9D83] text-white' : 'bg-white text-gray-400 border border-gray-100 hover:bg-gray-50'}`}>
                  {p.label}
                </button>
              ))}
            </div>

            {reportPeriod === 'custom' && (
              <div className="flex gap-3 mb-6 animate-fade-in bg-white p-4 rounded-3xl shadow-sm border border-gray-50">
                <div className="flex-1">
                  <label className="text-[10px] text-gray-400 font-bold ml-2 mb-1 block">{t.startDate}</label>
                  <input type="date" value={customStartDate} onChange={e => setCustomStartDate(e.target.value)} className="w-full bg-gray-50 p-3 rounded-2xl outline-none text-sm font-semibold" />
                </div>
                <div className="flex-1">
                  <label className="text-[10px] text-gray-400 font-bold ml-2 mb-1 block">{t.endDate}</label>
                  <input type="date" value={customEndDate} onChange={e => setCustomEndDate(e.target.value)} className="w-full bg-gray-50 p-3 rounded-2xl outline-none text-sm font-semibold" />
                </div>
              </div>
            )}

            <div className="grid grid-cols-2 gap-4 mb-6">
              <div className="bg-white p-5 rounded-3xl shadow-[0_4px_20px_-4px_rgba(0,0,0,0.05)] border border-gray-50 text-center relative overflow-hidden">
                <div className="absolute top-0 right-0 p-3 opacity-10 text-[#8B9D83]"><Plus size={40}/></div>
                <p className="text-gray-400 text-xs font-bold mb-2 relative z-10">{t.income}</p>
                <p className="font-bold text-[#8B9D83] text-lg truncate relative z-10">{formatCurrency(repIn, displayCurrency)}</p>
              </div>
              <div className="bg-white p-5 rounded-3xl shadow-[0_4px_20px_-4px_rgba(0,0,0,0.05)] border border-gray-50 text-center relative overflow-hidden">
                <div className="absolute top-0 right-0 p-3 opacity-10 text-[#D4A373]"><Minus size={40}/></div>
                <p className="text-gray-400 text-xs font-bold mb-2 relative z-10">{t.expense}</p>
                <p className="font-bold text-[#D4A373] text-lg truncate relative z-10">{formatCurrency(repOut, displayCurrency)}</p>
              </div>
            </div>

            <div className="bg-white rounded-3xl p-6 shadow-sm border border-gray-50">
              <h3 className="text-sm font-bold text-[#4A4A4A] mb-6 flex items-center gap-2"><BarChart2 size={16}/> {t.chart}</h3>
              {sortedExpenses.length === 0 ? (
                 <p className="text-center text-gray-400 text-sm font-medium py-6">Tidak ada data pengeluaran.</p>
              ) : (
                <div className="space-y-5">
                  {sortedExpenses.map(([catName, amount], idx) => {
                    const percentage = Math.round((amount / repOut) * 100);
                    const colors = ['bg-[#8B9D83]', 'bg-[#D4A373]', 'bg-[#6D7D62]', 'bg-[#E5C1A3]', 'bg-[#A8B8A0]'];
                    const color = colors[idx % colors.length];
                    return (
                      <div key={idx} className="group">
                        <div className="flex justify-between text-xs font-semibold text-[#4A4A4A] mb-2">
                          <span className="flex items-center gap-2"><div className={`w-2 h-2 rounded-full ${color}`}></div> {catName}</span>
                          <span>{formatCurrency(amount, displayCurrency)} ({percentage}%)</span>
                        </div>
                        <div className="w-full bg-gray-100 rounded-full h-3 overflow-hidden">
                          <div className={`${color} h-3 rounded-full transition-all duration-1000 group-hover:opacity-80`} style={{ width: `${percentage}%` }}></div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          </div>
        );

                  <div className="flex items-center justify-between p-4 bg-gray-50 rounded-2xl">
                    <div className="flex items-center gap-3">
                      <div className="bg-[#8B9D83]/20 p-2 rounded-xl text-[#8B9D83]"><Lock size={18}/></div>
                      <span className="font-semibold text-[#4A4A4A]">{t.pinSecurity}</span>
                    </div>
                    {pin ? (
                      <button onClick={() => setPinSetup({ isOpen: true, step: 'remove', input: '', error: '' })} className="text-xs font-bold text-red-400 bg-red-50 px-3 py-1.5 rounded-lg active:scale-95 transition-all">{t.removePin}</button>
                    ) : (
                      <button onClick={() => setPinSetup({ isOpen: true, step: 'create', input: '', error: '' })} className="text-xs font-bold text-[#8B9D83] bg-[#8B9D83]/10 px-3 py-1.5 rounded-lg active:scale-95 transition-all">{t.setupPin}</button>
                    )}
                  </div>
                  
                  <div className="flex items-center justify-between p-4 bg-gray-50 rounded-2xl">
                    <div className="flex items-center gap-3">
                      <div className="bg-[#D4A373]/20 p-2 rounded-xl text-[#D4A373]"><Fingerprint size={18}/></div>
                      <div>
                        <span className="font-semibold text-[#4A4A4A] block">Biometrik / Face ID</span>
                        {!biometricId && <span className="text-[10px] text-gray-500">{lang === 'id' ? 'Nyalakan biometrik' : '生体認証をオンにする'}</span>}
                        {biometricId && <span className="text-[10px] text-green-500">{lang === 'id' ? 'Biometrik Aktif' : '生体認証オン'}</span>}
                      </div>
                    </div>
                    <label className="relative inline-flex items-center cursor-pointer">
                      <input type="checkbox" className="sr-only peer" checked={!!biometricId} onChange={(e) => e.target.checked ? handleEnableBiometric() : handleDisableBiometric()} />
                      <div className="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-[#8B9D83]"></div>
                    </label>
                  </div>
                </div>
             </div>

             <div className="p-5 border-b border-gray-50">
                <div className="flex items-center gap-3 text-[#4A4A4A] font-semibold mb-4"><Cloud size={20} className="text-[#8B9D83]"/> {t.cloudBackup}</div>
                <p className="text-xs text-gray-500 mb-4">{t.backupDesc}</p>
                <div className="grid grid-cols-2 gap-3">
                   <button onClick={handleBackupJSON} className="flex items-center justify-center gap-2 bg-gray-50 text-[#4A4A4A] p-3 rounded-2xl font-bold text-xs hover:bg-gray-100 active:scale-95 transition-all"><DownloadCloud size={16}/> Backup Lokal</button>
                   <label className="flex items-center justify-center gap-2 bg-gray-50 text-[#4A4A4A] p-3 rounded-2xl font-bold text-xs hover:bg-gray-100 active:scale-95 transition-all cursor-pointer">
                      <UploadCloud size={16}/> Restore Lokal
                      <input type="file" accept=".json" className="hidden" onChange={handleRestoreJSON} />
                   </label>
                </div>
             </div>
             
             <button onClick={handleLogout} className="w-full p-5 flex items-center justify-center gap-2 text-red-500 font-bold hover:bg-red-50 active:bg-red-100 transition-colors"><LogOut size={18}/> {t.logout}</button>
          </div>

          <div className="text-center pt-4 pb-8 opacity-60">
             <div className="flex items-center justify-center gap-2 text-[#8B9D83] mb-2"><Info size={16} /> <span className="font-bold text-sm">mawuang App</span></div>
             <p className="text-[10px] text-gray-500 max-w-[200px] mx-auto leading-relaxed">{t.aboutAppDesc}</p>
             <p className="text-[10px] text-gray-400 mt-3">v1.1.0 © 2026</p>
          </div>
        </div>
      );

      return (
        <div className="bg-[#FDFBF7] min-h-screen text-[#4A4A4A] font-sans selection:bg-[#8B9D83] selection:text-white pb-20 md:pb-0 relative">
          {activeTab === 'home' && renderHome()}
          {activeTab === 'categories' && renderCategories()}
          {activeTab === 'report' && renderReport()}
          {activeTab === 'settings' && renderSettings()}
          
          {/* Smart Input Modal */}
          {isSmartInputOpen && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-end justify-center z-50 p-0" onClick={() => setIsSmartInputOpen(false)}>
              <div className="bg-white w-full rounded-t-[32px] p-6 shadow-2xl relative" onClick={e => e.stopPropagation()}>
                <div className="w-12 h-1.5 bg-gray-300 rounded-full mx-auto mb-6"></div>
                <h3 className="text-xl font-bold text-[#4A4A4A] mb-2 flex items-center justify-center gap-2"><MessageCircle size={24} className="text-[#8B9D83]"/> {t.smartInputTitle}</h3>
                <p className="text-xs text-center text-gray-500 mb-6">{t.smartInputPlaceholder}</p>
                
                <div className="flex bg-gray-50 p-2 rounded-3xl border border-gray-200 focus-within:border-[#8B9D83] focus-within:ring-2 focus-within:ring-[#8B9D83]/20 transition-all items-end relative min-h-[100px]">
                  <textarea 
                    value={smartText} 
                    onChange={(e) => setSmartText(e.target.value)}
                    placeholder="Cth: Makan siang 50rb" 
                    className="flex-1 bg-transparent border-none outline-none resize-none p-3 text-[#4A4A4A] font-medium placeholder-gray-400"
                    rows="3"
                    autoFocus
                  ></textarea>
                  
                  <div className="absolute bottom-2 right-2 flex gap-2">
                     <button onClick={toggleListen} className={`p-3 rounded-full shadow-sm transition-all ${isListening ? 'bg-red-500 text-white animate-pulse' : 'bg-white text-gray-400 hover:text-[#8B9D83]'}`}>
                        <Mic size={20} />
                     </button>
                     <button onClick={handleSmartSubmit} disabled={!smartText.trim()} className={`p-3 rounded-full shadow-sm transition-all ${smartText.trim() ? 'bg-[#8B9D83] text-white active:scale-95' : 'bg-gray-200 text-gray-400'}`}>
                        <Send size={20} />
                     </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Scanner Modal */}
          {isScannerOpen && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-end md:items-center justify-center z-50 p-0 md:p-6" onClick={() => setIsScannerOpen(false)}>
              <div className="bg-[#FDFBF7] w-full md:max-w-md rounded-t-[32px] md:rounded-[32px] p-8 text-center shadow-2xl relative" onClick={e => e.stopPropagation()}>
                <div className="w-12 h-1.5 bg-gray-300 rounded-full mx-auto mb-6 md:hidden"></div>
                {isScanning ? (
                  <div className="py-10 animate-fade-in">
                     <div className="relative w-24 h-24 mx-auto mb-6">
                        <div className="absolute inset-0 border-4 border-[#8B9D83] border-t-transparent rounded-full animate-spin"></div>
                        <Camera size={32} className="absolute inset-0 m-auto text-[#8B9D83] animate-pulse" />
                     </div>
                     <h3 className="text-xl font-bold text-[#4A4A4A] mb-2">Menganalisis Struk...</h3>
                     <p className="text-sm text-gray-500">Mengekstrak angka menggunakan AI.</p>
                  </div>
                ) : scanError ? (
                  <div className="py-6 animate-fade-in">
                     <div className="w-20 h-20 bg-red-100 text-red-500 rounded-full flex items-center justify-center mx-auto mb-6 shadow-inner"><AlertCircle size={40} /></div>
                     <h3 className="text-xl font-bold text-[#4A4A4A] mb-3">Angka Tidak Terbaca</h3>
                     <p className="text-sm text-gray-500 mb-8 px-4 leading-relaxed">{t.scanFailed}</p>
                     <div className="flex gap-3">
                        <button onClick={() => { setIsScannerOpen(false); handleOpenTxModal('expense', '', 'IDR', lang === 'id' ? 'Dari Pindai Struk' : 'レシートスキャンから', tempScanPhoto); setTempScanPhoto(null); }} className="flex-1 bg-[#8B9D83] text-white py-3.5 rounded-2xl font-bold shadow-md active:scale-95 transition-transform">{t.tryAgain}</button>
                        <button onClick={() => { setIsScannerOpen(false); setTempScanPhoto(null); }} className="flex-1 bg-gray-200 text-gray-600 py-3.5 rounded-2xl font-bold active:scale-95 transition-transform">{t.cancel}</button>
                     </div>
                  </div>

                     <div className="w-24 h-24 bg-[#E8EAE6] text-[#8B9D83] rounded-full flex items-center justify-center mx-auto mb-6 shadow-inner relative">

                        <div className="absolute inset-0 border-[3px] border-dashed border-[#8B9D83] rounded-full animate-[spin_10s_linear_infinite] opacity-50"></div>

                     <button onClick={() => setIsScannerOpen(false)} className="w-full bg-transparent text-gray-400 py-3 rounded-2xl font-bold hover:text-gray-600 transition-colors">{t.cancel}</button>

                    <div className="grid grid-cols-2 md:grid-cols-3 gap-2">
                      {categories.filter(c => c.type === txFormType).map(c => (
                        <button key={c.id} onClick={() => setTxFormData({...txFormData, category: c.id})} className={`p-3 rounded-2xl text-xs font-bold transition-all border-2 ${txFormData.category === c.id ? (txFormType === 'income' ? 'border-[#8B9D83] bg-[#8B9D83]/10 text-[#8B9D83]' : 'border-[#D4A373] bg-[#D4A373]/10 text-[#D4A373]') : 'border-transparent bg-white text-gray-500 hover:bg-gray-50'}`}>
                          {getCatName(c)}
                        </button>
                      ))}
                    </div>
                  </div>
                  
                  <div>
                    <label className="text-[10px] text-gray-400 font-bold ml-2 mb-1 block uppercase tracking-wider">Dompet</label>
                    <select value={txFormData.walletId} onChange={e => setTxFormData({...txFormData, walletId: e.target.value})} className="w-full bg-white border-2 border-gray-100 rounded-2xl px-4 py-3 outline-none text-[#4A4A4A] font-semibold focus:border-[#8B9D83]">
                      {wallets.map(w => <option key={w.id} value={w.id}>{lang === 'id' ? w.name : w.nameJp}</option>)}
                    </select>
                  </div>

                  <div>
                    <label className="text-[10px] text-gray-400 font-bold ml-2 mb-1 block uppercase tracking-wider">{t.dateTime}</label>
                    <input type="datetime-local" value={txFormData.date} onChange={e => setTxFormData({...txFormData, date: e.target.value})} className="w-full bg-white border-2 border-gray-100 rounded-2xl px-4 py-3 outline-none text-[#4A4A4A] font-semibold focus:border-[#8B9D83]" />
                  </div>

                  <div>
                    <label className="text-[10px] text-gray-400 font-bold ml-2 mb-1 block uppercase tracking-wider">{t.note} (Opsional)</label>
                    <input type="text" value={txFormData.note} onChange={e => setTxFormData({...txFormData, note: e.target.value})} placeholder="Cth: Beli makan siang" className="w-full bg-white border-2 border-gray-100 rounded-2xl px-4 py-3 outline-none text-[#4A4A4A] font-semibold focus:border-[#8B9D83]" />
                  </div>

                  <div>
                     <label className="text-[10px] text-gray-400 font-bold ml-2 mb-1 block uppercase tracking-wider">Foto Struk (Opsional)</label>
                     {txFormData.photo ? (
                        <div className="relative inline-block mt-2">
                           <img src={txFormData.photo} alt="Receipt" className="h-24 rounded-xl border border-gray-200" />
                           <button onClick={() => setTxFormData({...txFormData, photo: ''})} className="absolute -top-2 -right-2 bg-red-500 text-white rounded-full p-1"><X size={14}/></button>
                        </div>
                     ) : (
                        <label className="flex items-center justify-center gap-2 w-full bg-gray-50 border-2 border-dashed border-gray-200 text-gray-400 py-4 rounded-2xl font-bold cursor-pointer hover:bg-gray-100 transition-colors">
                           <ImageIcon size={20} /> {t.addPhoto}
                           <input type="file" accept="image/*" capture="environment" className="hidden" onChange={(e) => {
                               const file = e.target.files[0];
                               if (file) compressImage(file, (dataUrl) => setTxFormData({...txFormData, photo: dataUrl}));
                           }} />
                        </label>
                     )}
                  </div>
                </div>
                
                <div className="p-6 border-t border-gray-100 flex-shrink-0 bg-white md:rounded-b-[32px]">
                   <button onClick={handleSaveTx} className={`w-full text-white py-4 rounded-2xl font-bold shadow-lg active:scale-95 transition-transform ${txFormType === 'income' ? 'bg-[#8B9D83] hover:bg-[#778B6F]' : 'bg-[#D4A373] hover:bg-[#C29363]'}`}>
                     {t.save}
                   </button>
                </div>
              </div>
            </div>
          )}

          {/* Transaction Details Modal */}
          {selectedTx && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-end md:items-center justify-center z-50 animate-fade-in p-0 md:p-6" onClick={() => setSelectedTx(null)}>
              <div className="bg-[#FDFBF7] w-full md:max-w-md rounded-t-[32px] md:rounded-[32px] p-6 shadow-2xl transform transition-transform animate-slide-up relative max-h-[90vh] overflow-y-auto hide-scrollbar" onClick={e => e.stopPropagation()}>
                <div className="w-12 h-1.5 bg-gray-300 rounded-full mx-auto mb-6 md:hidden"></div>
                
                <div className="flex justify-between items-start mb-6">
                   <div>
                      <h2 className="text-2xl font-bold text-[#4A4A4A] mb-1">{t.transactionDetails}</h2>
                      <p className="text-xs text-gray-500">{new Date(selectedTx.date).toLocaleString(lang === 'id' ? 'id-ID' : 'ja-JP', { dateStyle: 'full', timeStyle: 'short' })}</p>
                   </div>
                   <div className={`p-3 rounded-2xl ${selectedTx.type === 'income' ? 'bg-green-100 text-green-600' : 'bg-orange-100 text-orange-600'}`}>
                      {selectedTx.type === 'income' ? <Plus size={24}/> : <Minus size={24}/>}
                   </div>
                </div>

                <div className="bg-white rounded-3xl p-6 shadow-sm border border-gray-50 mb-6">
                   <p className="text-center text-sm font-bold text-gray-400 mb-2">{t.amount}</p>
                   <h3 className={`text-4xl font-bold text-center mb-6 break-words ${selectedTx.type === 'income' ? 'text-[#8B9D83]' : 'text-[#D4A373]'}`}>
                      {formatCurrency(selectedTx.amount, selectedTx.currency || 'IDR')}
                   </h3>
                   
                   <div className="space-y-4">
                      <div className="flex justify-between items-center border-b border-gray-50 pb-3">
                         <span className="text-gray-400 text-sm font-semibold">{t.categoryName}</span>
                         <span className="text-[#4A4A4A] font-bold">{getCatName(categories.find(c => c.id === selectedTx.categoryId)) || 'Lain-lain'}</span>
                      </div>
                      <div className="flex justify-between items-center border-b border-gray-50 pb-3">
                         <span className="text-gray-400 text-sm font-semibold">Dompet</span>
                         <span className="text-[#4A4A4A] font-bold">{getWalletName(selectedTx.walletId)}</span>
                      </div>
                      <div className="flex justify-between items-center pb-1">
                         <span className="text-gray-400 text-sm font-semibold">{t.note}</span>
                         <span className="text-[#4A4A4A] font-bold text-right max-w-[60%] break-words">{selectedTx.note || '-'}</span>
                      </div>
                   </div>
                </div>

                {selectedTx.photo && (
                   <div className="mb-6 rounded-3xl overflow-hidden border-4 border-white shadow-md bg-gray-100">
                      <img src={selectedTx.photo} alt="Receipt" className="w-full h-auto max-h-48 object-cover cursor-pointer hover:scale-105 transition-transform" onClick={() => setPreviewImage(selectedTx.photo)} />
                   </div>
                )}

                <div className="flex gap-3 mt-6">
                   <button onClick={() => { handleDeleteTx(selectedTx.id); setSelectedTx(null); }} className="flex-1 bg-red-50 text-red-500 py-3.5 rounded-2xl font-bold active:scale-95 transition-transform flex items-center justify-center gap-2"><Trash2 size={18}/> {t.delete}</button>
                   <button onClick={() => handleEditTx(selectedTx)} className="flex-1 bg-blue-50 text-blue-500 py-3.5 rounded-2xl font-bold active:scale-95 transition-transform flex items-center justify-center gap-2"><Edit2 size={18}/> Edit</button>
                   <button onClick={() => setSelectedTx(null)} className="flex-1 bg-gray-100 text-gray-500 py-3.5 rounded-2xl font-bold active:scale-95 transition-transform">{t.cancel}</button>
                </div>
              </div>
            </div>
          )}

          {/* Export Modal */}
          {isExportModalOpen && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-6 animate-fade-in">
              <div className="bg-white rounded-[32px] p-8 max-w-sm w-full shadow-2xl relative text-center">
                 <button onClick={() => setIsExportModalOpen(false)} className="absolute right-6 top-6 text-gray-400 hover:text-gray-600 bg-gray-100 rounded-full p-1"><X size={20}/></button>
                 <div className="w-20 h-20 bg-[#E8EAE6] text-[#8B9D83] rounded-full flex items-center justify-center mx-auto mb-6"><Download size={32} /></div>
                 <h3 className="text-xl font-bold text-[#4A4A4A] mb-2">{t.exportConfirm}</h3>
                 <p className="text-xs text-gray-500 mb-6 px-4">Unduh semua data transaksi Anda dalam format Excel (CSV).</p>
                 <input type="text" value={exportFileName} onChange={e => setExportFileName(e.target.value)} placeholder={`mawuang_report_${new Date().toISOString().slice(0, 10)}`} className="w-full bg-gray-50 border-none rounded-2xl p-4 text-sm font-semibold text-[#4A4A4A] mb-6 focus:ring-2 focus:ring-[#8B9D83] outline-none text-center" />
                 <button onClick={handleExportCSV} className="w-full bg-[#8B9D83] text-white py-4 rounded-2xl font-bold shadow-lg active:scale-95 transition-transform">{t.exportConfirm}</button>
              </div>
            </div>
          )}

          {/* Setup PIN Modal */}
          {pinSetup.isOpen && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-end md:items-center justify-center z-50 p-0 md:p-6 animate-fade-in" onClick={() => setPinSetup({isOpen: false, step: 'create', input: '', error: ''})}>
              <div className="bg-[#FDFBF7] w-full md:max-w-md rounded-t-[32px] md:rounded-[32px] p-8 text-center shadow-2xl" onClick={e => e.stopPropagation()}>
                <div className="mb-4 text-[#8B9D83] bg-[#E8EAE6] p-4 rounded-full inline-block mx-auto"><Lock size={32} /></div>
                <h3 className="text-xl font-bold text-[#4A4A4A] mb-2">{pinSetup.step === 'remove' ? 'Hapus Keamanan PIN?' : (pinStepPhase === 'create' ? 'Buat PIN Baru' : 'Konfirmasi PIN')}</h3>
                <p className="text-xs text-gray-500 mb-6">
                    {pinSetup.step === 'remove' ? 'Jika Anda menghapus PIN, siapapun dapat mengakses aplikasi ini saat perangkat tidak terkunci.' : (pinStepPhase === 'create' ? 'Masukkan 6 digit angka untuk mengamankan data Anda.' : 'Masukkan ulang PIN yang sama untuk konfirmasi.')}
                </p>
                
                {pinSetup.step === 'remove' ? (
                  <div className="flex gap-3 mt-8">
                      <button onClick={async () => {
                          setPin(''); await idb.set('mawuang_pin', ''); 
                          if(biometricId) { setBiometricId(null); await idb.remove('mawuang_biometric_id'); }
                          pushToCloud({ pin: '' }); 
                          setPinSetup({isOpen: false, step: 'create', input: '', error: ''});
                      }} className="flex-1 bg-red-500 text-white py-3.5 rounded-2xl font-bold shadow-md active:scale-95 transition-transform">Ya, Hapus</button>
                      <button onClick={() => setPinSetup({isOpen: false, step: 'create', input: '', error: ''})} className="flex-1 bg-gray-200 text-[#4A4A4A] py-3.5 rounded-2xl font-bold active:scale-95 transition-transform">Batal</button>
                  </div>
                ) : (
                  <>
                      <div className="flex justify-center gap-3 mb-4">
                        {[...Array(6)].map((_, i) => (<div key={i} className={`w-3.5 h-3.5 rounded-full transition-all duration-300 ${setupPinInput.length > i ? 'bg-[#8B9D83] scale-110' : 'bg-gray-200'}`}></div>))}
                      </div>
                      {pinSetupError && <p className="text-red-400 text-xs font-semibold mb-6 animate-pulse">{pinSetupError}</p>}
                      <div className="grid grid-cols-3 gap-4 md:gap-6 max-w-[280px] w-full mx-auto">
                        {[1,2,3,4,5,6,7,8,9].map(num => (
                          <button key={num} onClick={() => handleSetupPinPress(num.toString())} className="w-14 h-14 md:w-16 md:h-16 rounded-full text-xl font-bold bg-white shadow-sm border border-gray-100 text-[#4A4A4A] hover:bg-gray-50 active:scale-95 transition-all flex items-center justify-center mx-auto">{num}</button>
                        ))}
                        <div></div>
                        <button onClick={() => handleSetupPinPress('0')} className="w-14 h-14 md:w-16 md:h-16 rounded-full text-xl font-bold bg-white shadow-sm border border-gray-100 text-[#4A4A4A] hover:bg-gray-50 active:scale-95 transition-all flex items-center justify-center mx-auto">0</button>
                        <button onClick={() => setSetupPinInput(setupPinInput.slice(0,-1))} className="w-14 h-14 md:w-16 md:h-16 rounded-full text-lg font-bold bg-gray-50 text-gray-400 hover:bg-gray-100 active:scale-95 transition-all flex items-center justify-center mx-auto"><X size={20}/></button>
                      </div>
                  </>
                )}
              </div>
            </div>
          )}

          {/* Edit Profile Modal */}
          {isProfileModalOpen && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-end md:items-center justify-center z-50 p-0 md:p-6 animate-fade-in" onClick={() => setIsProfileModalOpen(false)}>
              <div className="bg-[#FDFBF7] w-full md:max-w-md rounded-t-[32px] md:rounded-[32px] p-8 text-center shadow-2xl relative" onClick={e => e.stopPropagation()}>
                 <button onClick={() => setIsProfileModalOpen(false)} className="absolute right-6 top-6 text-gray-400 hover:text-gray-600 bg-gray-100 rounded-full p-1"><X size={20}/></button>
                 <h3 className="text-xl font-bold text-[#4A4A4A] mb-6">{t.editProfile}</h3>
                 
                 <div className="mb-6 relative w-24 h-24 mx-auto">
                    {photoURL ? <img src={photoURL} className="w-full h-full rounded-full object-cover border-4 border-white shadow-lg" /> : <div className="w-full h-full bg-[#E8EAE6] text-[#8B9D83] rounded-full border-4 border-white shadow-lg flex items-center justify-center"><User size={30} /></div>}
                    <label className="absolute bottom-0 right-0 bg-[#8B9D83] text-white p-2 rounded-full cursor-pointer shadow-md hover:scale-105 active:scale-95 transition-all">
                       <Camera size={14} />
                       <input type="file" accept="image/*" className="hidden" onChange={(e) => { const file = e.target.files[0]; if(file) compressImage(file, (url) => { setPhotoURL(url); pushToCloud({ photoURL: url }); }); }} />
                    </label>
                 </div>
                 
                 <div className="text-left mb-6">
                    <label className="text-[10px] text-gray-400 font-bold ml-2 mb-1 block uppercase tracking-wider">Nama Panggilan</label>
                    <input type="text" value={username} onChange={e => setUsername(e.target.value)} className="w-full bg-white border-2 border-gray-100 rounded-2xl px-4 py-3.5 outline-none text-[#4A4A4A] font-bold focus:border-[#8B9D83] transition-colors" />
                 </div>
                 
                 <button onClick={() => { setIsProfileModalOpen(false); pushToCloud({ username }); }} className="w-full bg-[#8B9D83] text-white py-4 rounded-2xl font-bold shadow-lg active:scale-95 transition-transform">{t.saveProfile}</button>
              </div>
            </div>
          )}

          {/* Global Message Dialog */}
          {messageDialog.isOpen && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-[60] p-6 animate-fade-in">
              <div className="bg-white rounded-[32px] p-8 max-w-sm w-full shadow-2xl text-center">
                 <div className={`w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-6 shadow-inner ${messageDialog.title === 'Error' || messageDialog.title === 'Gagal' || messageDialog.title === 'Koneksi Terputus' ? 'bg-red-100 text-red-500' : 'bg-green-100 text-green-500'}`}>
                    {messageDialog.title === 'Error' || messageDialog.title === 'Gagal' || messageDialog.title === 'Koneksi Terputus' ? <AlertCircle size={32} /> : <Check size={32} />}
                 </div>
                 <h3 className="text-xl font-bold text-[#4A4A4A] mb-3">{messageDialog.title}</h3>
                 <p className="text-sm text-gray-500 mb-8 leading-relaxed">{messageDialog.message}</p>
                 <button onClick={() => setMessageDialog({isOpen: false, title: '', message: ''})} className="w-full bg-gray-100 text-[#4A4A4A] py-3.5 rounded-2xl font-bold active:scale-95 transition-transform">Tutup</button>
              </div>
            </div>
          )}

          {/* Image Preview Modal */}
          {previewImage && (
            <div className="fixed inset-0 bg-black/90 backdrop-blur-md flex items-center justify-center z-[70] p-4 animate-fade-in" onClick={() => setPreviewImage(null)}>
              <button className="absolute top-6 right-6 text-white/50 hover:text-white bg-black/50 rounded-full p-2 backdrop-blur-sm transition-all"><X size={24}/></button>
              <img src={previewImage} className="max-w-full max-h-[90vh] object-contain rounded-xl shadow-2xl" onClick={e => e.stopPropagation()} />
            </div>
          )}

          {/* Toast Notification */}
          {toastMsg && (
            <div className="fixed top-6 left-1/2 -translate-x-1/2 z-[60] bg-gray-900/90 backdrop-blur-sm text-white px-6 py-3 rounded-full shadow-lg flex items-center gap-2 animate-fade-in">
              <Check size={16} className="text-green-400" />
              <span className="text-sm font-semibold">{toastMsg}</span>
            </div>
          )}

          <div className="fixed bottom-4 left-1/2 -translate-x-1/2 w-[90%] md:w-auto md:min-w-[400px] bg-white rounded-3xl shadow-[0_8px_30px_rgba(0,0,0,0.12)] p-2 z-40 border border-gray-100 flex justify-between items-center px-4">
            <NavButton tab="home" icon={Home} label={t.home} />
            <NavButton tab="report" icon={BarChart2} label={t.report} />
            
            <button onClick={() => setIsSmartInputOpen(true)} className="bg-[#8B9D83] text-white p-4 rounded-full shadow-lg transform -translate-y-5 hover:scale-105 active:scale-95 transition-all border-4 border-[#FDFBF7]">
               <MessageCircle size={24} fill="currentColor" className="text-white"/>
            </button>
            
            <NavButton tab="categories" icon={Tags} label={t.categories} />
            <NavButton tab="settings" icon={Settings} label={t.settings} />
          </div>
        </div>
      );
    }
    
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ErrorBoundary><App /></ErrorBoundary>);
  </script>
</body>
</html>
