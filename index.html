    class ErrorBoundary extends Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      componentDidCatch(error, errorInfo) {
        console.error("ErrorBoundary caught error:", error, errorInfo);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen bg-[#FDFBF7] flex items-center justify-center p-6 font-sans">
              <div className="bg-white p-8 rounded-3xl shadow-xl max-w-md w-full text-center border-2 border-red-50">

                <p className="text-xs text-gray-500 mb-6">{this.state.error?.message || 'Gagal memuat komponen aplikasi.'}</p>
                <button onClick={() => window.location.reload()} className="w-full bg-[#8B9D83] text-white py-3.5 rounded-2xl font-bold shadow-md active:scale-95 transition-transform">Muat Ulang Aplikasi</button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    const idb = {
      db: null,
      init: async () => {
        if (idb.db) return idb.db;
        return new Promise((resolve, reject) => {
          const req = indexedDB.open('mawuang_db', 10);
          req.onupgradeneeded = (e) => { 
              if(!e.target.result.objectStoreNames.contains('store')) {
                 e.target.result.createObjectStore('store'); 
              }
          };
          req.onsuccess = (e) => { idb.db = e.target.result; resolve(idb.db); };
          req.onerror = () => reject('IDB error');
        });
      },
      get: async (key) => {
        const db = await idb.init();
        return new Promise((resolve) => {
          const tx = db.transaction('store', 'readonly');
          const req = tx.objectStore('store').get(key);
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => resolve(null);
        });
      },
      set: async (key, val) => {
        const db = await idb.init();
        return new Promise((resolve) => {
          const tx = db.transaction('store', 'readwrite');
          tx.objectStore('store').put(val, key);
          tx.oncomplete = () => resolve();
        });
      },
      remove: async (key) => {
        const db = await idb.init();
        return new Promise((resolve) => {
          const tx = db.transaction('store', 'readwrite');
          tx.objectStore('store').delete(key);
          tx.oncomplete = () => resolve();
        });
      }
    };

      reader.readAsDataURL(file);
      reader.onload = event => {
        const img = new Image();
        img.src = event.target.result;
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const MAX_WIDTH = 600; 
          let scaleSize = 1;
          if (img.width > MAX_WIDTH) { scaleSize = MAX_WIDTH / img.width; }
          canvas.width = img.width * scaleSize;
          canvas.height = img.height * scaleSize;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          callback(canvas.toDataURL('image/jpeg', 0.7));
        }
      }
    };

      // --- FUNGSI NLP PENCATATAN CERDAS (Ditingkatkan) ---
      const parseSmartInput = (text, currentCategories) => {
          let amount = 0;
          let currency = 'IDR';
          let categoryId = '';
          let suggestedCatName = '';
          let type = 'expense';

          // Ubah ejaan dan terjemahkan kata angka ke digit
          let processText = text.toLowerCase().replace('go-jek', 'gojek');
          processText = processText.replace(/\bseribu\b/g, "1 ribu");
          processText = processText.replace(/\bsejuta\b/g, "1 juta");
          processText = processText.replace(/\bsebelas\b/g, "11");
          processText = processText.replace(/\bsepuluh\b/g, "10");
          
          const numMap = {'satu': 1, 'dua': 2, 'tiga': 3, 'empat': 4, 'lima': 5, 'enam': 6, 'tujuh': 7, 'delapan': 8, 'sembilan': 9};
          for (const [word, digit] of Object.entries(numMap)) {
              processText = processText.replace(new RegExp(`\\b${word} ribu\\b`, 'g'), `${digit} ribu`);
              processText = processText.replace(new RegExp(`\\b${word} ratus\\b`, 'g'), `${digit}00`);
              processText = processText.replace(new RegExp(`\\b${word}\\b`, 'g'), digit);
          }
          
          let note = processText;

          if (processText.includes('yen') || processText.includes('¥') || processText.includes('円')) currency = 'JPY';
          if (processText.includes('rp') || processText.includes('rupiah')) currency = 'IDR';

          // Mendukung akhiran 'k' (seperti 25k atau 25 k)
          const amountRegex = /(\d+([.,]\d+)?)\s*(rb|ribu|k|jt|juta|man|万|sen|千)?/i;
          const match = processText.match(amountRegex);

          if (match) {
              let rawNum = match[1].replace(/\./g, '').replace(/,/g, ''); 
              if (match[1].includes('.') && match[1].split('.')[1].length !== 3) {
                  rawNum = match[1].replace(/,/g, '.');
              }
              let baseVal = parseFloat(rawNum);
              let multiplier = match[3] ? match[3].toLowerCase() : '';
              
              if (['rb', 'ribu', 'k'].includes(multiplier)) baseVal *= 1000;
              if (['jt', 'juta'].includes(multiplier)) baseVal *= 1000000;
              if (['man', '万'].includes(multiplier)) baseVal *= 10000;
              if (['sen', '千'].includes(multiplier)) baseVal *= 1000;
              
              amount = baseVal;
              // Ekstraksi catatan (Hapus angka dan kata mata uang)
              note = processText.replace(match[0], '').trim();
              note = note.replace(/\b(yen|rp|rupiah|円|rb|ribu|k)\b/gi, '').trim();
              note = note.replace(/\s+/g, ' ').trim(); 
          }
          
          note = note.charAt(0).toUpperCase() + note.slice(1);
          const lowerText = processText;
          
          // Keyword Map Pintar
          const keywordMap = {
              'Makanan': ['makan', 'minum', 'nasi', 'kopi', 'food', 'snack', 'sarapan', 'siang', 'malam', 'sushi', 'ramen', 'bento', 'tabemono', 'nomimono', 'hirugohan', 'bangohan', 'asagohan', 'okashi'],
              'Transportasi': ['bensin', 'parkir', 'gojek', 'grab', 'maxim', 'ojek', 'indrive', 'kereta', 'bus', 'suica', 'pasmo', 'tol', 'tiket', 'taxi', 'taksi', 'mrt', 'shinkansen', 'densha', 'basu', 'koutsuu', 'kotsu'],
              'Belanja': ['belanja', 'supermarket', 'pasar', 'minimarket', 'baju', 'sepatu', 'donki', 'daiso', 'kombini', 'kaimono', 'shoppingu', 'pakaian'],
              'Hobi': ['gundam', 'mainan', 'game', 'nonton', 'bioskop', 'konser', 'hobby', 'anime', 'manga', 'komik', 'figure', 'gacha', 'playstation', 'nintendo'],
              'Kesehatan': ['obat', 'dokter', 'rs', 'rumah sakit', 'klinik', 'apotek', 'kusuri', 'byouin', 'vitamin'],
              'Tagihan': ['listrik', 'air', 'internet', 'wifi', 'gas', 'pajak', 'sewa', 'kos', 'yachin', 'denki', 'suidou', 'gasu'],
              'Gaji': ['gaji', 'bonus', 'bayaran', 'fee', 'arubaito', 'kyuuryou', 'shunyu']
          };

          // 1. Coba cari di kategori yang sudah ada
          for (let cat of currentCategories) {
              if (lowerText.includes(cat.name.toLowerCase()) || (cat.nameJp && lowerText.includes(cat.nameJp.toLowerCase()))) {
                  categoryId = cat.id; type = cat.type; break;
              }
          }

          // 2. Jika tidak ada, periksa peta kata kunci
          if (!categoryId) {
              for (const [catName, words] of Object.entries(keywordMap)) {
                  if (words.some(w => lowerText.includes(w))) {
                      const matchedCat = currentCategories.find(c => c.name.toLowerCase() === catName.toLowerCase() || c.name.toLowerCase().includes(catName.toLowerCase()));
                      if (matchedCat) {
                          categoryId = matchedCat.id; type = matchedCat.type;
                      } else {
                          suggestedCatName = catName;
                          type = catName === 'Gaji' ? 'income' : 'expense';
                      }
                      break;
                  }
              }
          }
          
          // 3. Fallback absolut (Kategori Lain-lain)
          if (!categoryId && !suggestedCatName) {
              suggestedCatName = 'Lain-lain';
              type = 'expense';
          }

          return { amount, currency, categoryId, suggestedCatName, type, note };
      };

      };
      const handleDeleteWallet = (id) => {
        if(wallets.length <= 1) return setMessageDialog({isOpen: true, title: 'Error', message: lang === 'id' ? 'Minimal harus ada 1 dompet!' : '少なくとも1つのウォレットが必要です！'});
        const newWalletList = wallets.filter(w => w.id !== id);
        setWallets(newWalletList);
        pushToCloud({ wallets: newWalletList }); 
      };

      const handlePhotoUpload = (e) => {
        const file = e.target.files[0];
        if (file) compressImage(file, (dataUrl) => setTxFormData({ ...txFormData, photo: dataUrl }));
      };

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          setIsScanning(true);
          setScanError(false);
          compressImage(file, async (compressedDataUrl) => {
            try {
              const result = await Tesseract.recognize(file, 'ind+eng+jpn');
              const text = result.data.text.toUpperCase();
              
              const isJapaneseReceipt = /(¥|円|合計|お買上額|お預り|お釣|消費税|SUICA|PASMO|PAYPAY)/.test(text);
              const detectedCurrency = isJapaneseReceipt ? 'JPY' : 'IDR';
              let detectedWallet = wallets[0]?.id || 'cash';
              const ewalletRegex = /(QRIS|PAYPAY|SUICA|PASMO|電子マネー|GOPAY|SHOPEEPAY|SPAY|OVO|DANA|LINKAJA|E-WALLET)/;
              const bankRegex = /(CREDIT|KREDIT|DEBIT|KARTU|CARD|カード|クレジット|MANDIRI|BCA|BNI|BRI|VISA|MASTER)/;
              
              if (ewalletRegex.test(text)) detectedWallet = wallets.find(w => w.id === 'ewallet' || w.name.toUpperCase().includes('E-WALLET') || w.name.toUpperCase().includes('PAY'))?.id || detectedWallet;
              else if (bankRegex.test(text)) detectedWallet = wallets.find(w => w.id === 'bank' || w.name.toUpperCase().includes('BANK') || w.name.toUpperCase().includes('KARTU'))?.id || detectedWallet;

              const flatText = text.replace(/\s+/g, ' ').replace(/T O T A L/g, 'TOTAL').replace(/合 計/g, '合計');

              let foundAmount = '';
              const getAmountFromProximity = (keywordsArray) => {
                  let maxVal = 0;
                  for (let kw of keywordsArray) {
                      let startIndex = 0, index;
                      while ((index = flatText.indexOf(kw, startIndex)) > -1) {
                          const scanRadius = flatText.substring(index, index + kw.length + 60);
                          const matches = scanRadius.match(/(?:RP|¥)?\s*(\d{1,3}([.,]\d{3})+|\d{3,8})/g);
                          if (matches) {
                              for(let m of matches) {
                                  const cleanVal = parseInt(m.replace(/[^\d]/g, ''), 10);
                                  if (cleanVal > 0 && cleanVal < 50000000 && cleanVal.toString().length < 9) {
                                      if(cleanVal > maxVal) maxVal = cleanVal;
                                  }
                              }
                          }
                          startIndex = index + kw.length;
                      }
                      if (maxVal > 0) return maxVal.toString(); 
                  }
                  return '';
              };

              const tier1 = ['TOTAL BELANJA', 'GRAND TOTAL', 'TOTAL TAGIHAN', 'HARGA JUAL', 'お買上額'];
              const tier2 = ['TOTAL', 'T0TAL', 'AMOUNT', '合計', '計', 'CREDIT', 'KREDIT', 'DEBIT', 'QRIS', 'PAYPAY', 'SUICA', 'PASMO', 'カード', 'クレジット', '電子マネー', 'GOPAY', 'SHOPEEPAY'];
              const tier3 = ['BAYAR', 'DIBAYAR', 'CASH', 'TUNAI', '預り', 'お預り'];

              foundAmount = getAmountFromProximity(tier1);
              if (!foundAmount) foundAmount = getAmountFromProximity(tier2);
              if (!foundAmount) foundAmount = getAmountFromProximity(tier3);
              
              if (!foundAmount) {
                  const fallbackRegex = /(?:RP|¥|YEN|円)\s*(\d+([.,]\d{3})*)/g;
                  let match, maxFallback = 0;
                  while ((match = fallbackRegex.exec(flatText)) !== null) {
                      const val = parseInt(match[1].replace(/[^\d]/g, ''), 10);
                      if (val > maxFallback && val < 50000000) maxFallback = val;
                  }
                  if (maxFallback > 0) foundAmount = maxFallback.toString();
              }

              setIsScanning(false);
              setIsScannerOpen(false);
              
              if (foundAmount) {
                 handleOpenTxModal('expense', foundAmount, detectedCurrency, lang === 'id' ? 'Dari Pindai Struk' : 'レシートスキャンから', compressedDataUrl, detectedWallet);
              } else {
                 setTempScanPhoto(compressedDataUrl);
                 setScanError(true);
                 setIsScannerOpen(true);
              }
            } catch (err) {
              setIsScanning(false);
              setTempScanPhoto(compressedDataUrl);
              setScanError(true);
            }
          });
        }
      };

      const handleExportCSV = () => {
        let finalFileName = exportFileName.trim() || `mawuang_report_${new Date().toISOString().slice(0, 10)}`;
        if (!finalFileName.endsWith('.csv')) finalFileName += '.csv';
        const headers = ['Transaction ID', 'Date', 'Time', 'Type', 'Category', 'Wallet', 'Note', 'Currency', 'Amount', `Converted Amount (${displayCurrency})`];
        const rows = transactions.map(tx => {
          const cat = categories.find(c => c.id === tx.categoryId);
          const txDate = new Date(tx.date);
          const convertedAmount = getConvertedAmount(tx.amount, tx.currency || 'IDR', displayCurrency);
          const safeNote = `"${(tx.note || '').replace(/"/g, '""')}"`;
          const safeCat = `"${(getCatName(cat) || 'Unknown').replace(/"/g, '""')}"`;
          const rawWallet = getWalletName(tx.walletId) || 'Cash';
          const safeWallet = `"${String(rawWallet).replace(/"/g, '""')}"`;
          return [ tx.id, txDate.toLocaleDateString(), txDate.toLocaleTimeString(), tx.type === 'income' ? 'Income' : 'Expense', safeCat, safeWallet, safeNote, tx.currency || 'IDR', tx.amount, convertedAmount.toFixed(2) ].join(';');
        });
        const csvContent = "\uFEFF" + [headers.join(';'), ...rows].join('\n');
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a'); link.href = url; link.setAttribute('download', finalFileName);
        document.body.appendChild(link); link.click(); document.body.removeChild(link); URL.revokeObjectURL(url);
        setIsExportModalOpen(false); setExportFileName('');
      };

      const handleBackupJSON = () => {
        const data = { transactions, categories, wallets, pin, lang, username, photoURL };
        const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a'); link.href = url; link.setAttribute('download', `mawuang_backup_${new Date().toISOString().slice(0, 10)}.json`);
        document.body.appendChild(link); link.click(); document.body.removeChild(link); URL.revokeObjectURL(url);
      };

      const handleRestoreJSON = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const data = JSON.parse(event.target.result);
            if (data.transactions) setTransactions(data.transactions);
            if (data.categories) setCategories(data.categories);
            if (data.wallets) setWallets(data.wallets);
            if (data.pin !== undefined) setPin(data.pin);
            if (data.lang) setLang(data.lang);
            if (data.username) setUsername(data.username);
            if (data.photoURL) setPhotoURL(data.photoURL);
            
            pushToCloud({
                transactions: data.transactions || transactions,
                categories: data.categories || categories,
                wallets: data.wallets || wallets,
                pin: data.pin !== undefined ? data.pin : pin,
                lang: data.lang || lang,
                username: data.username || username,
                photoURL: data.photoURL || photoURL
            });
            
            setMessageDialog({ isOpen: true, title: lang === 'id' ? 'Berhasil' : '成功', message: lang === 'id' ? 'Data berhasil dipulihkan!' : 'データが復元されました！' });
          } catch (err) { setMessageDialog({ isOpen: true, title: 'Error', message: 'File backup tidak valid!' }); }
        };
        reader.readAsText(file);
      };

      const handlePinPress = (num) => {
        const newPin = pinInput + num;
        setPinInput(newPin);
        if (newPin.length === 6) {
          if (newPin === pin) { setAppState('unlocked'); setPinInput(''); setLockError(false); } 
          else { setLockError(true); setTimeout(() => { setPinInput(''); setLockError(false); }, 800); }
        }
      };

      // =======================================================================
      // NATIVE FIREBASE SIGN IN WITH POPUP (SSOT)
      // =======================================================================
      const handleGoogleLogin = async () => {
          if (!window.firebaseApp || !window.firebaseDb || !window.firebaseAuth || !window.firebaseSignInWithPopup) {
              setMessageDialog({ isOpen: true, title: 'Koneksi Terputus', message: 'Sistem cloud sedang offline atau diblokir oleh browser. Harap muat ulang.' });
              return;
          }

          setSyncStatus('syncing');
          try {
              const provider = new window.GoogleAuthProvider();
              const result = await window.firebaseSignInWithPopup(window.firebaseAuth, provider);
              
              const uid = result.user.uid;
              const email = result.user.email || '';
              const googleName = result.user.displayName || email.split('@')[0] || 'Pengguna';
              const googlePhoto = result.user.photoURL || '';

              setFirebaseUid(uid);
              setConnectedEmail(email);

              await idb.set('mawuang_firebase_uid', uid);
              await idb.set('mawuang_email', email);

              const appId = typeof __app_id !== 'undefined' ? __app_id : 'mawuang';
              const docRef = window.firebaseDoc(window.firebaseDb, 'artifacts', appId, 'users', uid);
              
              const docSnap = await Promise.race([
                  window.firebaseGetDoc(docRef),
                  new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 4000))
              ]);

              if (docSnap && docSnap.exists()) {
                  const data = docSnap.data();
                  const cloudTx = data.transactions || [];
                  const cloudCat = data.categories || DEFAULT_CATEGORIES;
                  const cloudWallets = data.wallets || DEFAULT_WALLETS;
                  const cloudPin = data.pin !== undefined ? data.pin : '';
                  const cloudName = data.username || googleName;
                  const cloudLang = data.lang || 'id';
                  const cloudPhoto = data.photoURL || googlePhoto;

                  setTransactions(cloudTx); 
                  setCategories(cloudCat);
                  setWallets(cloudWallets);
                  setUsername(cloudName);
                  setLang(cloudLang);
                  setPin(cloudPin); 
                  setPhotoURL(cloudPhoto);
                  
                  await idb.set('mawuang_tx', cloudTx);
                  await idb.set('mawuang_cat', cloudCat);
                  await idb.set('mawuang_wallets', cloudWallets);
                  await idb.set('mawuang_username', cloudName);
                  await idb.set('mawuang_lang', cloudLang);
                  await idb.set('mawuang_pin', cloudPin); 
                  await idb.set('mawuang_photo', cloudPhoto);

                  setSyncStatus('success');
                  setTimeout(() => {
                      setAppState(cloudPin ? 'locked' : 'unlocked');
                  }, 500);

              } else {
                  setUsername(googleName);
                  setPhotoURL(googlePhoto);
                  setTransactions([]);
                  setCategories(DEFAULT_CATEGORIES);
                  setWallets(DEFAULT_WALLETS);
                  setPin('');
                  
                  await idb.set('mawuang_username', googleName);
                  await idb.set('mawuang_photo', googlePhoto);
                  await idb.set('mawuang_tx', []);
                  await idb.set('mawuang_cat', DEFAULT_CATEGORIES);
                  await idb.set('mawuang_wallets', DEFAULT_WALLETS);
                  await idb.set('mawuang_pin', '');
                  
                  setSyncStatus('success');
                  setTimeout(() => {
                      setOnboardingStep(3); 
                  }, 500);
              }
          } catch (err) {
              console.error("Firebase Login Error:", err);
              setSyncStatus('idle'); 
              let errorMsg = err.message || 'Gagal terhubung ke Cloud. Pastikan koneksi internet aktif.';
              
              if (err.code === 'auth/unauthorized-domain') {
                  errorMsg = 'Domain ini belum diizinkan. Buka Firebase Console > Authentication > Settings > Authorized domains, dan tambahkan domain Anda.';
              } else if (err.message === 'timeout' || err.code === 'permission-denied') {
                  errorMsg = 'Akses Database Cloud gagal/lambat. Pastikan Security Rules Firestore Anda diatur ke allow read, write: if request.auth != null;';
              }

              setMessageDialog({ isOpen: true, title: 'Gagal Masuk', message: errorMsg });
          }
      };

      const handleLogout = async () => {
          try {
              if (window.firebaseAuth && window.firebaseSignOut) {
                  await window.firebaseSignOut(window.firebaseAuth);
              }
          } catch (e) { console.warn("Sign out error", e); }

          await idb.remove('mawuang_firebase_uid');
          await idb.remove('mawuang_email');
          await idb.remove('mawuang_username');
          await idb.remove('mawuang_photo');
          await idb.remove('mawuang_pin');
          await idb.remove('mawuang_biometric_id');
          await idb.remove('mawuang_tx');
          await idb.remove('mawuang_cat');
          await idb.remove('mawuang_wallets');

          setFirebaseUid(null);
          setConnectedEmail('');
          setUsername('');
          setPhotoURL('');
          setTransactions([]);
          setCategories(DEFAULT_CATEGORIES);
          setWallets(DEFAULT_WALLETS);
          setPin('');
          setBiometricId(null);
          setPinInput('');
          setSetupPinInput('');
          setTempPinStore('');
          setPinStepPhase('create');
          setPinSetupError('');
          
          setAppState('onboarding');
          setOnboardingStep(1);
          setSyncStatus('idle');
      };

      const handleSetupPinPress = (num) => {
          const newPin = setupPinInput + num;
          setSetupPinInput(newPin);
          if (newPin.length === 6) {
              if (pinStepPhase === 'create') {
                  setTimeout(() => {
                      setTempPinStore(newPin);
                      setSetupPinInput('');
                      setPinStepPhase('confirm');
                      setPinSetupError('');
                  }, 300);
              } else {
                  setTimeout(async () => {
                      if (newPin === tempPinStore) {
                          setPin(newPin);
                          await idb.set('mawuang_pin', newPin);
                          setAppState('unlocked');
                          
                          const initialPayload = {
                             transactions: [],
                             categories: DEFAULT_CATEGORIES,
                             wallets: DEFAULT_WALLETS,
                             username: username,
                             photoURL: photoURL,
                             lang: lang,
                             email: connectedEmail,
                             pin: newPin,
                          };
                          pushToCloud(initialPayload);
                      } else {
                          setPinSetupError(lang === 'id' ? 'PIN tidak cocok! Silakan ulangi.' : 'PINs do not match! Please try again.');
                          setSetupPinInput('');
                          setPinStepPhase('create');
                          setTempPinStore('');
                      }
                  }, 300);
              }
          }
      };

      if (appState === 'loading') {
          return <div className="min-h-screen bg-[#FDFBF7] flex items-center justify-center"><div className="w-10 h-10 border-4 border-[#8B9D83] border-t-transparent rounded-full animate-spin"></div></div>;
      }

      if (appState === 'onboarding') {
          return (
              <div className="min-h-screen bg-[#FDFBF7] md:bg-gray-100 text-[#4A4A4A] font-sans selection:bg-[#8B9D83] selection:text-white flex justify-center md:items-center p-0 md:p-6">
                  <div className="w-full max-w-md md:max-w-4xl lg:max-w-5xl bg-[#FDFBF7] min-h-screen md:min-h-[650px] md:rounded-[40px] md:shadow-2xl relative overflow-hidden flex flex-col md:flex-row">
                      
                      <div className="hidden md:flex w-1/2 bg-[#8B9D83] flex-col items-center justify-center p-12 text-center text-white relative overflow-hidden">
                           <CashYenGraphic />
                           <h2 className="text-4xl font-bold mt-12 tracking-tight">mawuang.</h2>
                           <p className="text-white/80 mt-4 font-medium">Catatan Keuangan Cerdas Perantau</p>
                      </div>

                      <div className="w-full md:w-1/2 flex flex-col h-full min-h-screen md:min-h-0 items-center justify-center p-8 text-center relative z-10 mx-auto">
                          
                          {onboardingStep === 1 && (
                              <div className="flex flex-col h-full items-center justify-between md:justify-center p-2 w-full animate-fade-in">
                                  <div className="mt-20 md:hidden">
                                      <h1 className="text-4xl font-bold text-[#6D7D62] tracking-tight mb-2">mawuang.</h1>
                                      <p className="text-gray-400 text-sm font-medium">Catatan Keuangan Perantau</p>
                                  </div>
                                  
                                  <div className="my-10 md:hidden"><CashYenGraphic /></div>
                                  
                                  <div className="mb-10 md:mb-0 w-full mt-auto md:mt-0">
                                      <h2 className="text-3xl font-bold text-[#4A4A4A] mb-3">Selamat Datang!</h2>
                                      <p className="text-gray-500 text-sm mb-10 leading-relaxed px-4">Kelola pemasukan dan pengeluaran harian Anda dengan mudah, rapi, dan cerdas.</p>
                                      <button onClick={() => setOnboardingStep(2)} className="w-full bg-[#8B9D83] text-white py-4 rounded-2xl font-bold shadow-lg hover:bg-[#778B6F] active:scale-95 transition-all text-lg tracking-wide">Mulai Perjalanan</button>
                                  </div>
                              </div>
                          )}
                          
                          {onboardingStep === 2 && (
                              <div className="flex flex-col h-full items-center justify-center w-full animate-slide-up">
                                  <div className="mb-6 text-[#D4A373]"><Cloud size={70} strokeWidth="1.5" /></div>
                                  <h2 className="text-2xl font-bold text-[#4A4A4A] mb-2">Masuk dengan Akun Google</h2>
                                  <p className="text-gray-500 text-sm mb-6 leading-relaxed px-2">Sinkronkan data keuangan Anda secara aman dan otomatis berdasarkan akun Google Anda.</p>
                                  
                                  {syncStatus === 'idle' && (
                                      <div className="w-full flex flex-col items-center space-y-4 animate-fade-in">
                                          <button onClick={handleGoogleLogin} className="w-full max-w-[280px] bg-white text-[#4A4A4A] font-bold py-3.5 px-4 rounded-full shadow-md flex items-center justify-center gap-3 border border-gray-100 hover:bg-gray-50 active:scale-95 transition-all">
                                              <GoogleLogo /> Lanjutkan dengan Google
                                          </button>
                                      </div>
                                  )}
                                  {syncStatus === 'syncing' && (
                                      <div className="flex flex-col items-center py-6 animate-fade-in">
                                          <div className="w-12 h-12 border-4 border-[#8B9D83] border-t-transparent rounded-full animate-spin mb-4"></div>
                                          <p className="text-[#8B9D83] font-semibold">Menarik data dari Cloud...</p>
                                      </div>
                                  )}
                                  {syncStatus === 'success' && (
                                      <div className="flex flex-col items-center py-6 animate-fade-in">
                                          <div className="bg-green-100 text-green-500 p-4 rounded-full mb-4 shadow-sm"><Check size={40} strokeWidth="3" /></div>
                                          <p className="text-green-600 font-bold text-lg">Berhasil Masuk!</p>
                                      </div>
                                  )}
                              </div>
                          )}

                          {onboardingStep === 3 && (
                              <div className="flex flex-col h-full items-center justify-center w-full animate-slide-up">
                                  <div className="mb-8 relative mt-[-20px]">
                                      {photoURL ? (
                                         <img src={photoURL} className="w-28 h-28 rounded-full object-cover border-4 border-white shadow-lg mx-auto" />
                                      ) : (
                                         <div className="w-28 h-28 bg-[#E8EAE6] text-[#8B9D83] rounded-full border-4 border-white shadow-lg flex items-center justify-center mx-auto"><User size={40} /></div>
                                      )}
                                      <label className="absolute bottom-1 right-1 bg-[#8B9D83] text-white p-2.5 rounded-full cursor-pointer shadow-md hover:scale-105 active:scale-95 transition-all">
                                          <Camera size={18} />
                                          <input type="file" accept="image/*" className="hidden" onChange={(e) => {
                                              const file = e.target.files[0];
                                              if(file) compressImage(file, setPhotoURL);
                                          }} />
                                      </label>
                                  </div>
                                  <h2 className="text-2xl font-bold text-[#4A4A4A] mb-2 tracking-tight">{t.profileSetup}</h2>
                                  <p className="text-gray-500 text-xs mb-8 px-4">Sesuaikan nama panggilan dan foto profil Anda. (Opsional)</p>
                                  
                                  <div className="w-full max-w-[280px] mx-auto">
                                      <input type="text" value={username} onChange={e => setUsername(e.target.value)} placeholder="Nama Panggilan" className="w-full box-border bg-white border-none rounded-2xl p-4 text-[#4A4A4A] focus:ring-2 focus:ring-[#8B9D83] outline-none shadow-[0_4px_20px_-4px_rgba(0,0,0,0.05)] text-center font-bold mb-8 transition-shadow" />
                                      <button onClick={() => setOnboardingStep(4)} className="w-full bg-[#8B9D83] text-white py-4 rounded-2xl font-bold shadow-lg hover:bg-[#778B6F] active:scale-95 transition-transform tracking-wide">Lanjutkan</button>
                                  </div>
                              </div>
                          )}

                          {onboardingStep === 4 && (
                              <div className="flex flex-col h-full items-center justify-center w-full animate-slide-up">
                                  <div className="mb-4 text-[#8B9D83] bg-[#E8EAE6] p-4 rounded-full"><Lock size={32} /></div>
                                  <h2 className="text-2xl font-bold text-[#4A4A4A] mb-2 tracking-tight">
                                      {pinStepPhase === 'create' ? 'Buat PIN Keamanan' : 'Konfirmasi PIN Anda'}
                                  </h2>
                                  <p className="text-gray-500 text-xs mb-8 px-4">
                                      {pinStepPhase === 'create' ? 'Masukkan 6 digit angka untuk mengamankan data Anda.' : 'Masukkan ulang PIN yang sama untuk konfirmasi.'}
                                  </p>
                                  
                                  <div className="flex gap-3 mb-4">
                                    {[...Array(6)].map((_, i) => (
                                      <div key={i} className={`w-3.5 h-3.5 rounded-full transition-all duration-300 ${setupPinInput.length > i ? 'bg-[#8B9D83] scale-110' : 'bg-gray-200'}`}></div>
                                    ))}
                                  </div>
                                  {pinSetupError && <p className="text-red-400 text-xs font-semibold mb-6 animate-pulse">{pinSetupError}</p>}
                                  
                                  <div className="grid grid-cols-3 gap-4 md:gap-6 max-w-[280px] w-full mx-auto">
                                    {[1,2,3,4,5,6,7,8,9].map(num => (
                                      <button key={num} onClick={() => handleSetupPinPress(num.toString())} className="w-14 h-14 md:w-16 md:h-16 rounded-full text-xl font-bold bg-gray-50 text-[#4A4A4A] hover:bg-gray-100 active:scale-95 transition-all flex items-center justify-center mx-auto">{num}</button>
                                    ))}
                                    <div></div>
                                    <button onClick={() => handleSetupPinPress('0')} className="w-14 h-14 md:w-16 md:h-16 rounded-full text-xl font-bold bg-gray-50 text-[#4A4A4A] hover:bg-gray-100 active:scale-95 transition-all flex items-center justify-center mx-auto">0</button>
                                    <button onClick={() => setSetupPinInput(setupPinInput.slice(0,-1))} className="w-14 h-14 md:w-16 md:h-16 rounded-full text-lg font-bold bg-gray-50 text-gray-400 hover:bg-gray-100 active:scale-95 transition-all flex items-center justify-center mx-auto"><X size={20}/></button>
                                  </div>
                                  <button onClick={async () => {
                                      setPin('');
                                      await idb.set('mawuang_pin', '');
                                      setAppState('unlocked');
                                      
                                      const initialPayload = {
                                         transactions: [],
                                         categories: DEFAULT_CATEGORIES,
                                         wallets: DEFAULT_WALLETS,
                                         username: username,
                                         photoURL: photoURL,
                                         lang: lang,
                                         email: connectedEmail,
                                         pin: '',
                                      };
                                      pushToCloud(initialPayload);
                                  }} className="mt-8 text-gray-400 text-xs font-semibold hover:text-gray-600 transition-colors">Lewati PIN</button>
                              </div>
                          )}
                      </div>
                  </div>
              </div>
          );
      }

      if (appState === 'locked' && pin) {
        return (

        const now = new Date();
        const currentYear = now.getFullYear();
        const currentMonth = now.getMonth();
        const isThisWeek = (date) => {
          const d = new Date(date);
          const start = new Date(now); start.setDate(now.getDate() - now.getDay()); start.setHours(0,0,0,0);
          const end = new Date(now); end.setDate(now.getDate() - now.getDay() + 6); end.setHours(23,59,59,999);
          return d >= start && d <= end;
        };
        const filteredTx = transactions.filter(tx => {
          const d = new Date(tx.date);
          if (reportPeriod === 'week') return isThisWeek(d);
          if (reportPeriod === 'month') return d.getMonth() === currentMonth && d.getFullYear() === currentYear;
          if (reportPeriod === 'year') return d.getFullYear() === currentYear;
          if (reportPeriod === 'custom') {
            const dt = d.getTime();
            const start = customStartDate ? new Date(customStartDate).setHours(0,0,0,0) : 0;
            const end = customEndDate ? new Date(customEndDate).setHours(23,59,59,999) : Infinity;
            return dt >= start && dt <= end;
          }
          return true;
        });
        const rIncome = filteredTx.filter(t => t.type === 'income').reduce((acc, curr) => acc + getConvertedAmount(curr.amount, curr.currency || 'IDR', displayCurrency), 0);
        const rExpense = filteredTx.filter(t => t.type === 'expense').reduce((acc, curr) => acc + getConvertedAmount(curr.amount, curr.currency || 'IDR', displayCurrency), 0);
        const expenseTx = filteredTx.filter(t => t.type === 'expense');
        const groupedChart = {};
        expenseTx.forEach(tx => { groupedChart[tx.categoryId] = (groupedChart[tx.categoryId] || 0) + getConvertedAmount(tx.amount, tx.currency || 'IDR', displayCurrency); });
        const chartTotal = Object.values(groupedChart).reduce((a,b)=>a+b, 0);
        const chartColors = ['#8B9D83', '#D4A373', '#6D7D62', '#C29363', '#A3B19B', '#4A4A4A'];
        let cumulativePercent = 0;
        const chartSlices = Object.entries(groupedChart).sort((a,b)=>b[1]-a[1]).map(([catId, amount], idx) => {
           const percent = amount / chartTotal;
           const slice = { catId, amount, percent, color: chartColors[idx % chartColors.length], start: cumulativePercent };
           cumulativePercent += percent;
           return slice;
        });
        const gradientString = chartTotal > 0 ? chartSlices.map(s => `${s.color} ${s.start * 100}% ${(s.start + s.percent) * 100}%`).join(', ') : '#f3f4f6 0% 100%';

        return (
          <div className="p-6 md:p-10 pb-24 md:pb-10 animate-fade-in relative z-10 md:grid md:grid-cols-12 md:gap-8 lg:gap-12 md:items-start">

                    {period === 'week' ? t.weekly : period === 'month' ? t.monthly : period === 'year' ? t.yearly : t.custom}

                      {chartSlices.slice(0, 5).map(s => (

                    </div>
                    <button onClick={handleSaveTx} className={`w-full py-4 rounded-2xl font-bold text-white mt-6 shadow-lg transition-transform active:scale-95 ${txFormType === 'income' ? 'bg-[#8B9D83] hover:bg-[#778B6F]' : 'bg-[#D4A373] hover:bg-[#C29363]'}`}>{t.save}</button>
                  </div>
                </div>
              </div>
            )}

            {isScannerOpen && (
              <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-md animate-fade-in p-4">
                <div className="bg-white w-full max-w-sm rounded-[32px] p-6 text-center relative overflow-hidden mx-auto shadow-2xl">
                  <button onClick={() => { if(!isScanning) { setIsScannerOpen(false); setScanError(false); setTempScanPhoto(null); } }} className="absolute top-4 right-4 p-2 bg-gray-50 rounded-full text-gray-400 hover:text-gray-700"><X size={20} /></button>
                  <div className="my-8">
                    {isScanning ? (
                      <div className="flex flex-col items-center">
                        <div className="w-16 h-16 border-4 border-[#8B9D83] border-t-transparent rounded-full animate-spin mb-4"></div>
                        <p className="font-semibold text-[#6D7D62]">{t.scanning}</p>
                      </div>
                    ) : scanError ? (
                      <div className="flex flex-col items-center animate-fade-in">
                        <div className="bg-red-50 p-6 rounded-full mb-6"><AlertCircle size={40} className="text-red-400" /></div>
                        <h3 className="font-bold text-lg mb-2 text-[#4A4A4A] text-center leading-snug">{t.scanFailed}</h3>
                        <div className="flex gap-3 mt-4 w-full">
                           <button onClick={() => { setIsScannerOpen(false); handleOpenTxModal('expense', '', 'IDR', lang === 'id' ? 'Ketik nominal manual' : '手動で入力', tempScanPhoto); setTempScanPhoto(null); }} className="flex-1 bg-gray-100 text-[#4A4A4A] px-4 py-4 rounded-2xl font-semibold shadow-sm transition-all active:scale-95">Manual</button>
                           <label className="flex-1 bg-[#4A4A4A] text-white px-4 py-4 rounded-2xl font-semibold cursor-pointer shadow-lg transition-all active:scale-95">
                             Ulangi <input type="file" accept="image/*" className="hidden" onChange={handleFileUpload} />
                           </label>
                        </div>
                      </div>
                    ) : (
                      <div className="flex flex-col items-center">
                        <div className="bg-[#E8EAE6] p-6 rounded-full mb-6"><Camera size={40} className="text-[#8B9D83]" /></div>
                        <h3 className="font-bold text-lg mb-2 text-[#4A4A4A]">{t.scanInstruction}</h3>
                        <label className="mt-4 bg-[#8B9D83] text-white px-8 py-4 rounded-2xl font-semibold cursor-pointer shadow-lg hover:bg-[#778B6F] transition-all active:scale-95">
                          {t.scan} <input type="file" accept="image/*" className="hidden" onChange={handleFileUpload} />
                        </label>
                      </div>
                    )}
                  </div>
                </div>
              </div>
            )}

            {isExportModalOpen && (
              <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-md animate-fade-in p-4">
                <div className="bg-white w-full max-w-sm rounded-[32px] p-6 relative overflow-hidden animate-slide-up shadow-2xl mx-auto">
                  <button onClick={() => setIsExportModalOpen(false)} className="absolute top-4 right-4 p-2 bg-gray-50 rounded-full text-gray-400 hover:text-gray-700"><X size={20} /></button>
                  <h3 className="font-bold text-lg mb-4 text-[#4A4A4A] text-center">{t.exportFileName}</h3>
                  <input type="text" value={exportFileName} onChange={(e) => setExportFileName(e.target.value)} placeholder="mawuang_report..." className="w-full box-border min-w-0 bg-gray-50 border-none rounded-2xl p-4 text-[#4A4A4A] focus:ring-2 focus:ring-[#8B9D83] outline-none transition-shadow mb-6 text-center font-medium"/>
                  <button onClick={handleExportCSV} className="w-full bg-[#8B9D83] text-white p-4 rounded-2xl font-bold transition-all hover:bg-[#778B6F] active:scale-95 shadow-lg flex justify-center items-center gap-2">
                    <Download size={18} /> {t.exportConfirm}
                  </button>
                </div>
              </div>
            )}

            {pinSetup.isOpen && (
              <div className="fixed inset-0 z-[60] flex items-center justify-center bg-black/60 backdrop-blur-sm animate-fade-in p-4">
                <div className="bg-white w-full max-w-sm rounded-[32px] p-6 relative shadow-2xl text-center mx-auto">
                  <div className="mx-auto w-12 h-12 bg-[#F6EBE1] text-[#D4A373] rounded-full flex items-center justify-center mb-4">
                     {pinSetup.step === 'create' ? <Lock size={24}/> : <Unlock size={24}/>}
                  </div>
                  <h3 className="text-lg font-bold text-[#4A4A4A] mb-2">{pinSetup.step === 'create' ? t.setupPin : t.removePin}</h3>
                  <p className="text-xs text-gray-400 mb-6">{pinSetup.step === 'create' ? (lang==='id'?'Masukkan 6 digit angka keamanan':'6桁のセキュリティ番号を入力してください') : (lang==='id'?'Apakah Anda yakin ingin menghapus keamanan PIN?':'PINセキュリティを削除してもよろしいですか？')}</p>
                  
                  {pinSetup.step === 'create' && (
                    <div className="mb-6">
                       <input type="password" maxLength="6" placeholder="••••••" value={pinSetup.input} onChange={(e) => { const val = e.target.value.replace(/\D/g, ''); setPinSetup({...pinSetup, input: val, error: ''}); }} className="w-full text-center tracking-[0.5em] text-2xl bg-gray-50 border-none rounded-2xl p-4 text-[#4A4A4A] focus:ring-2 focus:ring-[#8B9D83] outline-none" />
                       {pinSetup.error && <p className="text-red-400 text-xs font-semibold mt-2">{pinSetup.error}</p>}
                    </div>
                  )}

                  <div className="flex gap-3">
                    <button onClick={() => setPinSetup({isOpen: false, step: 'create', input: '', error: ''})} className="flex-1 bg-gray-100 text-[#4A4A4A] p-3 rounded-2xl font-bold">{pinSetup.step === 'create' ? t.cancel : (lang === 'id' ? 'Tidak' : 'いいえ')}</button>
                    <button onClick={async () => {
                       if (pinSetup.step === 'create') {
                         if (pinSetup.input.length === 6) { 
                             setPin(pinSetup.input); 
                             setPinSetup({isOpen: false, step: 'create', input: '', error: ''}); 
                             setMessageDialog({ isOpen: true, title: lang === 'id' ? 'Sukses' : '成功', message: lang==='id'?'PIN berhasil dipasang!':'PINが正常に設定されました！' }); 
                             pushToCloud({ pin: pinSetup.input });
                         }
                         else setPinSetup({...pinSetup, error: lang==='id'?'Harus 6 digit angka!':'6桁の数字である必要があります！'});
                       } else {
                         setPin(''); setBiometricId(null); setPinSetup({isOpen: false, step: 'create', input: '', error: ''}); setMessageDialog({ isOpen: true, title: lang === 'id' ? 'Berhasil' : '成功', message: lang==='id'?'PIN dan Keamanan berhasil dihapus!':'PINと生体認証が削除されました！' });
                         pushToCloud({ pin: '' }); 
                       }
                    }} className={`flex-1 text-white p-3 rounded-2xl font-bold ${pinSetup.step === 'create' ? 'bg-[#8B9D83] hover:bg-[#778B6F]' : 'bg-red-400 hover:bg-red-500'}`}>{pinSetup.step === 'create' ? t.save : (lang === 'id' ? 'Ya, Hapus' : 'はい、削除します')}</button>
                  </div>
                </div>
              </div>
            )}

            {messageDialog.isOpen && (
              <div className="fixed inset-0 z-[70] flex items-center justify-center bg-black/60 backdrop-blur-sm animate-fade-in p-4">
                <div className="bg-white w-full max-w-[280px] rounded-[32px] p-6 text-center shadow-2xl mx-auto">
                  <h3 className="font-bold text-lg text-[#4A4A4A] mb-2">{messageDialog.title}</h3>
                  <p className="text-sm text-gray-500 mb-6">{messageDialog.message}</p>
                  <button onClick={() => setMessageDialog({isOpen: false, title: '', message: ''})} className="w-full bg-[#8B9D83] text-white p-3 rounded-2xl font-bold hover:bg-[#778B6F]">OK</button>
                </div>
              </div>
            )}

            {selectedTx && (
              <div className="fixed inset-0 z-[80] flex items-end md:items-center justify-center bg-black/40 backdrop-blur-sm animate-fade-in p-0 md:p-4" onClick={() => setSelectedTx(null)}>
                <div className="bg-white w-full max-w-md rounded-t-[40px] md:rounded-[40px] p-6 pb-12 md:pb-8 animate-slide-up shadow-2xl relative max-h-[90vh] overflow-y-auto hide-scrollbar mx-auto" onClick={e => e.stopPropagation()}>
                  <button onClick={() => setSelectedTx(null)} className="absolute top-6 right-6 p-2 bg-gray-50 rounded-full text-gray-400 hover:text-gray-700"><X size={20} /></button>
                  <div className="flex items-center gap-3 mb-6">
                    <div className={`p-4 rounded-[20px] ${selectedTx.type === 'income' ? 'bg-[#E8EAE6] text-[#8B9D83]' : 'bg-[#F6EBE1] text-[#D4A373]'}`}>
                       {selectedTx.type === 'income' ? <Plus size={24} /> : <Minus size={24} />}
                    </div>
                    <div>
                      <h2 className="text-xl font-bold text-[#4A4A4A]">{t.transactionDetails}</h2>
                      <p className="text-xs text-gray-400 font-medium">{new Date(selectedTx.date).toLocaleDateString(lang === 'id' ? 'id-ID' : 'ja-JP', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })}</p>
                    </div>
                  </div>
                  
                  <div className="bg-gray-50 p-5 rounded-[24px] space-y-4 mb-6">
                     <div className="flex justify-between items-center border-b border-gray-100 pb-3">
                        <span className="text-xs text-gray-400 font-semibold uppercase">{t.amount}</span>
                        <span className={`text-lg font-bold ${selectedTx.type === 'income' ? 'text-[#8B9D83]' : 'text-[#4A4A4A]'}`}>{formatCurrency(selectedTx.amount, selectedTx.currency || 'IDR')}</span>
                     </div>
                     <div className="flex justify-between items-center border-b border-gray-100 pb-3">
                        <span className="text-xs text-gray-400 font-semibold uppercase">{t.categories}</span>
                        <span className="text-sm font-bold text-[#4A4A4A]">{getCatName(categories.find(c => c.id === selectedTx.categoryId)) || '-'}</span>
                     </div>
                     <div className="flex justify-between items-center border-b border-gray-100 pb-3">
                        <span className="text-xs text-gray-400 font-semibold uppercase">{t.wallets}</span>
                        <span className="text-sm font-bold text-[#4A4A4A]">{getWalletName(selectedTx.walletId)}</span>
                     </div>
                     <div className="flex justify-between items-center border-b border-gray-100 pb-3">
                        <span className="text-xs text-gray-400 font-semibold uppercase">{t.dateTime}</span>
                        <span className="text-sm font-bold text-[#4A4A4A]">{new Date(selectedTx.date).toLocaleTimeString(lang === 'id' ? 'id-ID' : 'ja-JP', { hour: '2-digit', minute: '2-digit' })}</span>
                     </div>
                     <div className="flex flex-col gap-1">
                        <span className="text-xs text-gray-400 font-semibold uppercase">{t.note}</span>
                        <span className="text-sm font-medium text-gray-600 italic">"{selectedTx.note || '-'}"</span>
                     </div>
                  </div>

                  {selectedTx.photo && (
                    <div>
                      <span className="text-xs text-gray-400 font-semibold uppercase mb-2 block">Foto / Struk</span>
                      <img src={selectedTx.photo} onClick={() => setPreviewImage(selectedTx.photo)} className="w-full h-40 md:h-48 object-cover rounded-[24px] shadow-sm cursor-pointer hover:opacity-90 transition-opacity" alt="Attachment" />
                    </div>
                  )}
                </div>
              </div>
            )}

            {previewImage && (
              <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/90 backdrop-blur-md p-4 animate-fade-in" onClick={() => setPreviewImage(null)}>
                <button className="absolute top-6 right-6 p-3 bg-white/10 rounded-full text-white hover:bg-white/25 transition-colors backdrop-blur-lg"><X size={24} /></button>
                <img src={previewImage} onClick={e => e.stopPropagation()} className="max-w-full max-h-[85vh] object-contain rounded-2xl shadow-2xl animate-slide-up" alt="Preview" />
              </div>
            )}
            
            {/* TOAST NOTIFIKASI */}
            {toastMsg && (
              <div className="fixed bottom-28 lg:bottom-12 left-1/2 transform -translate-x-1/2 z-[110] bg-[#8B9D83] text-white px-6 py-3 rounded-full shadow-xl flex items-center gap-2 animate-slide-up">
                 <Check size={18} />
                 <span className="font-bold text-sm tracking-wide">{toastMsg}</span>
              </div>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
