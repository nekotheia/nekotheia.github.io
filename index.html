    class ErrorBoundary extends Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) { return { hasError: true, error }; }
      componentDidCatch(error, errorInfo) { console.error("ErrorBoundary caught error:", error, errorInfo); }
      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen app-bg flex items-center justify-center p-6">
              <div className="bg-white p-8 rounded-3xl shadow-xl max-w-md w-full text-center">
                <div className="w-20 h-20 bg-red-50 text-red-400 rounded-full flex items-center justify-center mx-auto mb-6 text-3xl font-bold">!</div>
                <h2 className="text-2xl font-bold text-gray-800 mb-3">Terjadi Kendala Sistem</h2>
                <p className="text-sm text-gray-500 mb-8">{this.state.error?.message || 'Gagal memuat komponen aplikasi.'}</p>
                <button onClick={() => window.location.reload()} className="w-full bg-[#007AFF] text-white py-4 rounded-xl font-bold active:scale-95 transition-all">Muat Ulang Aplikasi</button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    const idb = {
      db: null,
      init: async () => {
        if (idb.db) return idb.db;
        return new Promise((resolve, reject) => {
          const req = indexedDB.open('mawuang_db', 24);
          req.onupgradeneeded = (e) => { 
              if(!e.target.result.objectStoreNames.contains('store')) {
                 e.target.result.createObjectStore('store'); 
              }
          };
          req.onsuccess = (e) => { idb.db = e.target.result; resolve(idb.db); };
          req.onerror = () => reject('IDB error');
        });
      },
      get: async (key) => {
        try {
          const db = await idb.init();
          return new Promise((resolve) => {
            const tx = db.transaction('store', 'readonly');
            const req = tx.objectStore('store').get(key);
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => resolve(null);
          });
        } catch(e) { return null; }
      },
      set: async (key, val) => {
        try {
          const db = await idb.init();
          return new Promise((resolve) => {
            const tx = db.transaction('store', 'readwrite');
            tx.objectStore('store').put(val, key);
            tx.oncomplete = () => resolve();
            tx.onerror = () => resolve();
          });
        } catch(e) {}
      },
      remove: async (key) => {
        try {
          const db = await idb.init();
          return new Promise((resolve) => {
            const tx = db.transaction('store', 'readwrite');
            tx.objectStore('store').delete(key);
            tx.oncomplete = () => resolve();
            tx.onerror = () => resolve();
          });
        } catch(e) {}
      }
    };

    const getCurrentDateTimeLocal = () => {
      const now = new Date();
      now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
      return now.toISOString().slice(0, 16);
    };

    const compressImage = (file, callback) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = event => {
        const img = new Image();
        img.src = event.target.result;
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const MAX_WIDTH = 600; 
          let scaleSize = 1;
          if (img.width > MAX_WIDTH) { scaleSize = MAX_WIDTH / img.width; }
          canvas.width = img.width * scaleSize;
          canvas.height = img.height * scaleSize;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          callback(canvas.toDataURL('image/jpeg', 0.7));
        }

              const wId = (w.id || '').toLowerCase();
              if (processText.includes(wName) || processText.includes(wNameJp) || processText.includes(wId) || 
                 (wName.includes('bca') && processText.includes('bca')) || 
                 (wName.includes('mandiri') && processText.includes('mandiri')) || 
                 (wName.includes('gopay') && processText.includes('gopay')) || 
                 (wName.includes('ovo') && processText.includes('ovo')) || 
                 (wName.includes('dana') && processText.includes('dana')) || 
                 (wName.includes('suica') && processText.includes('suica')) ||
                 (wName.includes('tunai') && processText.includes('tunai')) ||
                 (wName.includes('ic card') && processText.includes('ic card'))) {
                  walletId = w.id;
                  break;
              }
          }

          const amountRegex = /(\d+([.,]\d+)*)\s*(rb|ribu|ribuan|k|jt|juta|jutaan|man|万|sen|千|ceng)?/i;
          const match = processText.match(amountRegex);
          if (match) {
              let rawStr = match[1];
              let baseVal = 0;
              if (/^(\d{1,3})([.,]\d{3})+$/.test(rawStr)) baseVal = parseFloat(rawStr.replace(/[.,]/g, ''));
              else {
                  rawStr = rawStr.replace(/,/g, '.');
                  const parts = rawStr.split('.');
                  if (parts.length > 1) {
                      const decimalPart = parts.pop();
                      baseVal = parseFloat(parts.join('') + '.' + decimalPart);
                  } else { baseVal = parseFloat(rawStr); }
              }

              let multiplier = match[3] ? match[3].toLowerCase() : '';
              if (['rb', 'ribu', 'ribuan', 'k', 'ceng'].includes(multiplier)) baseVal *= 1000;
              if (['jt', 'juta', 'jutaan'].includes(multiplier)) baseVal *= 1000000;
              if (['man', '万'].includes(multiplier)) baseVal *= 10000;
              if (['sen', '千'].includes(multiplier)) baseVal *= 1000;
              
              if (!multiplier && currency === 'IDR') {
                  if (baseVal > 0 && baseVal <= 999) baseVal *= 1000; 
              }

              amount = baseVal;
              note = processText.replace(match[0], '').trim();
              note = note.replace(/\b(yen|usd|dolar|rp|rupiah|円|rb|ribu|k|juta|jt|ceng)\b/gi, '').trim();
              note = note.replace(/\s+/g, ' ').trim(); 
          }
          
          note = note.charAt(0).toUpperCase() + note.slice(1);
          const lowerText = processText;
          
          const keywordMap = {
              'Makanan': ['makan', 'minum', 'nasi', 'kopi', 'food', 'snack', 'sarapan', 'siang', 'malam', 'sushi', 'ramen', 'bento', 'tabemono', 'nomimono', 'hirugohan', 'bangohan', 'asagohan', 'okashi', 'bubur', 'bakso', 'mie', 'sate', 'ayam', 'soto', 'sop', 'pecel', 'gado', 'warung', 'cafe', 'kafe', 'resto', 'ketoprak', 'rawon', 'rendang', 'gudeg', 'siomay', 'batagor', 'udon', 'gyudon', 'onigiri', 'pan,', 'roti', 'burger', 'pizza', 'eskrim', 'teh', 'jus'],
              'Transportasi': ['bensin', 'parkir', 'gojek', 'grab', 'maxim', 'ojek', 'indrive', 'kereta', 'bus', 'suica', 'pasmo', 'tol', 'tiket', 'taxi', 'taksi', 'mrt', 'shinkansen', 'densha', 'basu', 'koutsuu', 'kotsu'],
              'Belanja': ['belanja', 'supermarket', 'pasar', 'minimarket', 'baju', 'sepatu', 'donki', 'daiso', 'kombini', 'kaimono', 'shoppingu', 'pakaian', 'amazon', 'flipkart', 'apple'],
              'Hobi': ['gundam', 'mainan', 'game', 'nonton', 'bioskop', 'konser', 'hobby', 'anime', 'manga', 'komik', 'figure', 'gacha', 'playstation', 'nintendo'],
              'Kesehatan': ['obat', 'dokter', 'rs', 'rumah sakit', 'klinik', 'apotek', 'kusuri', 'byouin', 'vitamin'],
              'Tagihan': ['listrik', 'air', 'internet', 'wifi', 'gas', 'pajak', 'sewa', 'kos', 'yachin', 'denki', 'suidou', 'gasu'],
              'Gaji': ['gaji', 'bonus', 'bayaran', 'fee', 'arubaito', 'kyuuryou', 'shunyu'],
              'Pendapatan Lain': ['dapat', 'dapet', 'dikasih', 'terima', 'pemasukan', 'pendapatan', 'untung', 'laba', 'profit', 'menang', 'jual', 'cair', 'diberi', 'nemu', 'cashback', 'thr', 'angpao', 'angpau', 'amplop']
          };

          for (let cat of currentCategories) {
              if (lowerText.includes(cat.name.toLowerCase()) || (cat.nameJp && lowerText.includes(cat.nameJp.toLowerCase()))) {
                  categoryId = cat.id; type = cat.type; break;
              }
          }

          if (!categoryId) {
              for (const [catName, words] of Object.entries(keywordMap)) {
                  if (words.some(w => lowerText.includes(w))) {
                      const matchedCat = currentCategories.find(c => c.name.toLowerCase() === catName.toLowerCase() || c.name.toLowerCase().includes(catName.toLowerCase()));
                      if (matchedCat) {
                          categoryId = matchedCat.id; type = matchedCat.type;
                      } else {
                          suggestedCatName = catName;
                          type = ['Gaji', 'Pendapatan Lain'].includes(catName) ? 'income' : 'expense';
                      }
                      break;
                  }
              }
          }
          
          if (!categoryId && !suggestedCatName) {
              const existingLain = currentCategories.filter(c => ['lain-lain', 'lainnya', 'lain - lain'].includes(c.name.toLowerCase()))[0];
              if (existingLain) { categoryId = existingLain.id; type = existingLain.type; } 
              else { suggestedCatName = 'Lain-lain'; type = 'expense'; }
          }
          return { amount, currency, categoryId, suggestedCatName, type, note, walletId };
      };

      const toggleListen = () => {

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          setIsScanning(true);
          setScanError(false);
          compressImage(file, async (compressedDataUrl) => {
            try {
              const result = await Tesseract.recognize(file, 'ind+eng+jpn');
              const text = result.data.text.toUpperCase();
              
              const isJapaneseReceipt = /(¥|円|合計|お買上額|お預り|お釣|消費税|SUICA|PASMO|PAYPAY)/.test(text);
              const detectedCurrency = isJapaneseReceipt ? 'JPY' : (displayCurrency || 'USD');
              
              let detectedWallet = wallets[0]?.id || 'cash';
              const upperText = text;
              
              const findWalletByNameMatch = (keywords) => {
                  for (let kw of keywords) {
                      const matched = wallets.find(w => w.name.toUpperCase().includes(kw) || w.id.toUpperCase().includes(kw));
                      if (matched) return matched.id;
                  }
                  return null;
              };

              if (upperText.includes('GOPAY') || upperText.includes('GOJEK')) {
                  detectedWallet = findWalletByNameMatch(['GOPAY', 'GO-JEK']) || detectedWallet;
              } else if (upperText.includes('OVO')) {
                  detectedWallet = findWalletByNameMatch(['OVO']) || detectedWallet;
              } else if (upperText.includes('DANA')) {
                  detectedWallet = findWalletByNameMatch(['DANA']) || detectedWallet;
              } else if (upperText.includes('SHOPEEPAY') || upperText.includes('SPAY')) {
                  detectedWallet = findWalletByNameMatch(['SHOPEE', 'SPAY', 'PAY']) || detectedWallet;
              } else if (upperText.includes('BCA')) {
                  detectedWallet = findWalletByNameMatch(['BCA', 'BANK', 'REKENING']) || detectedWallet;
              } else if (upperText.includes('MANDIRI') || upperText.includes('LIVIN')) {
                  detectedWallet = findWalletByNameMatch(['MANDIRI', 'LIVIN', 'BANK']) || detectedWallet;
              } else if (upperText.includes('BNI')) {
                  detectedWallet = findWalletByNameMatch(['BNI', 'BANK']) || detectedWallet;
              } else if (upperText.includes('BRI') || upperText.includes('BRIMO')) {
                  detectedWallet = findWalletByNameMatch(['BRI', 'BRIMO', 'BANK']) || detectedWallet;
              } else if (upperText.includes('SUICA')) {
                  detectedWallet = findWalletByNameMatch(['SUICA', 'IC CARD']) || detectedWallet;
              } else if (upperText.includes('PASMO')) {
                  detectedWallet = findWalletByNameMatch(['PASMO', 'IC CARD']) || detectedWallet;
              } else {
                  const ewalletRegex = /(QRIS|PAYPAY|SUICA|PASMO|電子マネー|GOPAY|SHOPEEPAY|SPAY|OVO|DANA|LINKAJA|E-WALLET)/;
                  const bankRegex = /(CREDIT|KREDIT|DEBIT|KARTU|CARD|カード|クレジット|MANDIRI|BCA|BNI|BRI|BSI|CIMB|PERMATA|LIVIN|BRIMO|VISA|MASTER)/;
                  if (ewalletRegex.test(upperText)) {
                      detectedWallet = wallets.find(w => w.id === 'ewallet' || w.name.toUpperCase().includes('E-WALLET') || w.name.toUpperCase().includes('PAY'))?.id || detectedWallet;
                  } else if (bankRegex.test(upperText)) {
                      detectedWallet = wallets.find(w => w.id === 'bank' || w.name.toUpperCase().includes('BANK') || w.name.toUpperCase().includes('KARTU') || w.name.toUpperCase().includes('REKENING'))?.id || detectedWallet;
                  }
              }

              const flatText = text.replace(/\s+/g, ' ').replace(/T O T A L/g, 'TOTAL').replace(/合 計/g, '合計');
              let foundAmount = '';
              const getAmountFromProximity = (keywordsArray) => {
                  let maxVal = 0;
                  for (let kw of keywordsArray) {
                      let startIndex = 0, index;
                      while ((index = flatText.indexOf(kw, startIndex)) > -1) {
                          const scanRadius = flatText.substring(index, index + kw.length + 60);
                          const matches = scanRadius.match(/(?:RP|¥|\$)?\s*(\d{1,3}([.,]\d{3})+|\d{3,8}(?:\.\d{2})?)/g);
                          if (matches) {
                              for(let m of matches) {
                                  const cleanVal = parseFloat(m.replace(/[^\d.]/g, ''), 10);
                                  if (cleanVal > 0 && cleanVal < 50000000 && cleanVal.toString().length < 9) {
                                      if(cleanVal > maxVal) maxVal = cleanVal;
                                  }
                              }
                          }
                          startIndex = index + kw.length;
                      }
                      if (maxVal > 0) return maxVal.toString(); 
                  }
                  return '';
              };

              const tier1 = ['TOTAL BELANJA', 'GRAND TOTAL', 'TOTAL TAGIHAN', 'HARGA JUAL', 'NOMINAL', 'JUMLAH', 'SEBESAR', 'TOTAL BAYAR', 'お買上額'];
              const tier2 = ['TOTAL', 'T0TAL', 'AMOUNT', '合計', '計', 'CREDIT', 'KREDIT', 'DEBIT', 'QRIS', 'PAYPAY', 'SUICA', 'PASMO', 'カード', 'クレジット', '電子マネー', 'GOPAY', 'SHOPEEPAY'];
              const tier3 = ['BAYAR', 'DIBAYAR', 'CASH', 'TUNAI', '預り', 'お預り'];

              foundAmount = getAmountFromProximity(tier1);
              if (!foundAmount) foundAmount = getAmountFromProximity(tier2);
              if (!foundAmount) foundAmount = getAmountFromProximity(tier3);
              
              if (!foundAmount) {
                  const fallbackRegex = /(?:RP\.?|IDR|USD|¥|YEN|円|\$)\s*(\d+([.,]\d{3})*(?:\.\d{2})?)/g;
                  let match, maxFallback = 0;
                  while ((match = fallbackRegex.exec(flatText)) !== null) {
                      const val = parseFloat(match[1].replace(/[^\d.]/g, ''), 10);
                      if (val > maxFallback && val < 50000000) maxFallback = val;
                  }
                  if (maxFallback > 0) foundAmount = maxFallback.toString();
              }
              
              const isBankTransfer = /(BERHASIL|SUKSES|TRANSFER|BCA|MANDIRI|BNI|BRI|BSI|CIMB|PERMATA|LIVIN|BRIMO|OVO|GOPAY|DANA|SHOPEEPAY)/.test(text);
              if (!foundAmount && isBankTransfer) {
                  const numRegex = /\b(\d{1,3}([.,]\d{3})+(?:\.\d{2})?)\b/g;
                  let match, maxFallback = 0;
                  while ((match = numRegex.exec(flatText)) !== null) {
                      const val = parseFloat(match[1].replace(/[^\d.]/g, ''), 10);
                      if (val > maxFallback && val < 500000000) maxFallback = val;
                  }
                  if (maxFallback > 0) foundAmount = maxFallback.toString();
              }

              setIsScanning(false); setIsScannerOpen(false);
              const defaultCatForScan = categories.find(c => ['lain-lain', 'lainnya', 'belanja'].includes(c.name.toLowerCase()))?.id || categories[0]?.id;

              if (foundAmount) {
                 handleOpenTxModal('expense', foundAmount, detectedCurrency, t.scanSource, compressedDataUrl, detectedWallet, null, defaultCatForScan);
              } else {
                 setTempScanPhoto(compressedDataUrl); setScanError(true); setIsScannerOpen(true);
              }
            } catch (err) {
              setIsScanning(false); setTempScanPhoto(compressedDataUrl); setScanError(true);
            }
          });
        }
      };

      const handleOpenTxModal = (type, prefillAmount = '', prefillCurrency = displayCurrency, prefillNote = '', photo = '', wallet = null, txId = null, categoryId = '') => {

        const headers = ['Transaction ID', 'Date', 'Time', 'Type', 'Category', 'Wallet', 'Note', 'Currency', 'Amount', `Converted Amount (${displayCurrency})`, 'Created By'];

                      </select>
                      <div className="w-px h-8 bg-gray-200 mx-3"></div>
                      <input type="number" value={txFormData.amount} onChange={(e) => {setTxFormData({...txFormData, amount: e.target.value}); setTxError('');}} placeholder="0.00" className={`flex-1 bg-transparent text-3xl font-bold outline-none px-2 ${txFormType === 'income' ? 'text-green-600' : 'text-main'}`}/>
                    </div>
                    
                    <div className="bg-gray-50 border border-gray-100 shadow-sm rounded-2xl p-3 focus-within:ring-2 ring-gray-200 transition-all">
                      <label className="block text-[10px] font-bold text-gray-400 px-3 pt-1 uppercase tracking-wide">{t.categories}</label>
                      <select value={txFormData.category} onChange={(e) => {setTxFormData({...txFormData, category: e.target.value}); setTxError('');}} className="w-full bg-transparent px-3 py-2 text-main font-bold outline-none appearance-none">
                        <option value="" disabled>{t.selectCategory}</option>
                        {categories.filter(c => c.type === txFormType).map(c => (<option key={c.id} value={c.id}>{getCatName(c)}</option>))}
                      </select>
                    </div>

                    <div className="flex gap-4">
                      <div className="flex-1 bg-gray-50 border border-gray-100 shadow-sm rounded-2xl p-3 focus-within:ring-2 ring-gray-200 transition-all">
                        <label className="block text-[10px] font-bold text-gray-400 px-3 pt-1 uppercase tracking-wide">{t.dateTime}</label>
                        <input type="datetime-local" value={txFormData.date} onChange={(e) => setTxFormData({...txFormData, date: e.target.value})} className="w-full bg-transparent px-3 py-2 text-xs font-bold text-main outline-none appearance-none"/>
                      </div>
                      <div className="flex-1 bg-gray-50 border border-gray-100 shadow-sm rounded-2xl p-3 focus-within:ring-2 ring-gray-200 transition-all">
                        <label className="block text-[10px] font-bold text-gray-400 px-3 pt-1 uppercase tracking-wide">{t.wallets}</label>
                        <select value={txFormData.walletId || 'cash'} onChange={(e) => setTxFormData({...txFormData, walletId: e.target.value})} className="w-full bg-transparent px-3 py-2 text-xs font-bold text-main outline-none appearance-none">
                          {wallets.map(w => <option key={w.id} value={w.id}>{lang === 'id' ? w.name : w.nameJp}</option>)}
                        </select>
                      </div>
                    </div>

                    <div className="bg-gray-50 border border-gray-100 shadow-sm rounded-2xl p-3 focus-within:ring-2 ring-gray-200 transition-all">
                      <label className="block text-[10px] font-bold text-gray-400 px-3 pt-1 uppercase tracking-wide">{t.note}</label>
                      <input type="text" value={txFormData.note} onChange={(e) => setTxFormData({...txFormData, note: e.target.value})} placeholder="What was this for?" className="w-full bg-transparent px-3 py-2 text-sm font-semibold text-main outline-none"/>
                    </div>
                    
                    <div className="pt-2">
                      {txFormData.photo ? (
                        <div className="relative inline-block mt-2">
                          <img src={txFormData.photo} onClick={() => setPreviewImage(txFormData.photo)} className="h-28 w-28 object-cover rounded-2xl shadow-sm border border-gray-100" alt="Preview"/>
                          <button onClick={() => setTxFormData({...txFormData, photo: ''})} className="absolute -top-3 -right-3 bg-red-500 text-white rounded-full p-1.5 shadow-md"><X size={14} /></button>
                        </div>
                      ) : (
                        <label className="flex items-center justify-center gap-3 w-full bg-white border-2 border-dashed border-gray-200 rounded-2xl p-5 text-gray-400 cursor-pointer hover:bg-gray-50 transition-colors">
                          <ImageIcon size={20} /> <span className="text-sm font-bold">{t.addPhoto}</span>
                          <input type="file" accept="image/*" className="hidden" onChange={handlePhotoUpload} />
                        </label>
                      )}
                    </div>
                    <button onClick={handleSaveTx} className="w-full py-4 rounded-full font-bold text-white mt-6 active:scale-[0.98] transition-transform bg-[#1C1C1E] shadow-md">{t.save}</button>
                  </div>
                </div>
              </div>
            )}

            {/* Scanner Modal - unchanged logic, updated visual */}
            {isScannerOpen && (
              <div className="fixed inset-0 z-[80] flex items-end justify-center bg-black/40 backdrop-blur-sm animate-fade-in p-0">
                <div className="ios-modal w-full max-w-2xl p-8 pb-12 text-center relative animate-slide-up shadow-[0_-10px_40px_rgba(0,0,0,0.1)]">
                  <div className="ios-handle mb-8"></div>
                  <button onClick={() => { if(!isScanning) { setIsScannerOpen(false); setScanError(false); setTempScanPhoto(null); } }} className="absolute top-6 right-6 p-2 bg-gray-100 rounded-full text-gray-500"><X size={18} /></button>
                  <div className="my-6">
                    {isScanning ? (
                      <div className="flex flex-col items-center">
                        <div className="w-16 h-16 border-4 border-gray-200 border-t-[#1C1C1E] rounded-full animate-spin mb-6"></div>
                        <p className="font-bold text-[#1C1C1E] text-lg">{t.scanning}</p>
                      </div>
                    ) : scanError ? (
                      <div className="flex flex-col items-center animate-fade-in">
                        <div className="bg-red-50 p-6 rounded-full mb-6 border border-red-100"><AlertCircle size={40} className="text-red-500" /></div>
                        <h3 className="font-bold text-lg mb-2 text-main">{t.scanFailed}</h3>
                        <div className="flex gap-4 mt-8 w-full">
                           <button onClick={() => { setIsScannerOpen(false); handleOpenTxModal('expense', '', displayCurrency, t.manual, tempScanPhoto); setTempScanPhoto(null); }} className="flex-1 bg-white border border-gray-200 shadow-sm text-main py-4 rounded-full font-bold active:scale-95 transition-transform">{t.manual}</button>
                           <label className="flex-1 bg-[#1C1C1E] text-white py-4 rounded-full font-bold cursor-pointer shadow-md active:scale-95 transition-transform">{t.retry} <input type="file" accept="image/*" className="hidden" onChange={handleFileUpload} /></label>
                        </div>
                      </div>
                    ) : (
                      <div className="flex flex-col items-center">
                        <div className="p-8 rounded-full mb-6 bg-gray-50 border border-gray-100 shadow-inner"><Camera size={48} className="text-[#1C1C1E]" /></div>
                        <h3 className="font-bold text-lg mb-4 text-main">{t.scanInstruction}</h3>
                        <label className="mt-6 bg-[#1C1C1E] shadow-md text-white px-10 py-4 rounded-full font-bold cursor-pointer active:scale-95 transition-transform">{t.scanBtn} <input type="file" accept="image/*" className="hidden" onChange={handleFileUpload} /></label>
                      </div>
                    )}
                  </div>
                </div>
              </div>
            )}

            {/* Export Modal */}
            {isExportModalOpen && (
              <div className="fixed inset-0 z-[80] flex items-end justify-center bg-black/40 backdrop-blur-sm animate-fade-in p-0">
                <div className="ios-modal w-full max-w-2xl p-8 pb-12 relative animate-slide-up shadow-[0_-10px_40px_rgba(0,0,0,0.1)]">
                  <div className="ios-handle mb-8"></div>
                  <button onClick={() => { setIsExportModalOpen(false); setExportStartDate(''); setExportEndDate(''); }} className="absolute top-6 right-6 p-2 bg-gray-100 rounded-full text-gray-500"><X size={18} /></button>
                  <h3 className="font-bold text-2xl mb-6 text-main text-center">{t.exportFileName}</h3>
                  <input type="text" value={exportFileName} onChange={(e) => setExportFileName(e.target.value)} placeholder="mawuang_report..." className="w-full bg-gray-50 border border-gray-100 rounded-full py-4 px-6 text-main outline-none mb-6 text-center font-bold shadow-sm"/>
                  
                  <h4 className="text-[10px] font-bold text-gray-400 mb-3 text-center uppercase tracking-wide">{t.exportDateRange}</h4>
                  <div className="flex gap-4 mb-8">
                    <div className="flex-1 bg-gray-50 border border-gray-100 shadow-sm rounded-2xl p-4 focus-within:ring-2 ring-gray-200 transition-all">
                      <label className="block text-[10px] font-bold text-gray-400 mb-2 uppercase tracking-wide">{t.startDate}</label>
                      <input type="date" value={exportStartDate} onChange={e => setExportStartDate(e.target.value)} className="w-full bg-transparent text-sm text-main outline-none font-bold"/>
                    </div>
                    <div className="flex-1 bg-gray-50 border border-gray-100 shadow-sm rounded-2xl p-4 focus-within:ring-2 ring-gray-200 transition-all">
                      <label className="block text-[10px] font-bold text-gray-400 mb-2 uppercase tracking-wide">{t.endDate}</label>
                      <input type="date" value={exportEndDate} onChange={e => setExportEndDate(e.target.value)} className="w-full bg-transparent text-sm text-main outline-none font-bold"/>
                    </div>
                  </div>

                  <button onClick={handleExportCSV} className="w-full bg-[#1C1C1E] text-white p-4 rounded-full font-bold flex justify-center items-center gap-2 transition-transform active:scale-[0.98] shadow-md"><Download size={18} /> {t.exportConfirm}</button>
                </div>
              </div>
            )}

            {/* Pin Setup Modal */}
            {pinSetup.isOpen && (
              <div className="fixed inset-0 z-[80] flex items-end justify-center bg-black/40 backdrop-blur-sm animate-fade-in p-0">
                <div className="ios-modal w-full max-w-2xl p-8 pb-12 relative shadow-[0_-10px_40px_rgba(0,0,0,0.1)] text-center animate-slide-up">
                  <div className="ios-handle mb-8"></div>
                  <div className="mx-auto w-16 h-16 bg-gray-50 border border-gray-100 shadow-inner text-[#1C1C1E] rounded-full flex items-center justify-center mb-6">{pinSetup.step === 'create' ? <Lock size={28}/> : <Unlock size={28}/>}</div>
                  <h3 className="text-2xl font-bold text-main mb-3">{pinSetup.step === 'create' ? t.setupPin : t.removePin}</h3>
                  <p className="text-sm font-medium text-gray-500 mb-8 px-4">{pinSetup.step === 'create' ? t.pinDescCreate : t.pinDescConfirm}</p>
                  
                  {pinSetup.step === 'create' && (
                    <div className="mb-8">
                       <input type="password" maxLength="6" placeholder="••••••" value={pinSetup.input} onChange={(e) => { const val = e.target.value.replace(/\D/g, ''); setPinSetup({...pinSetup, input: val, error: ''}); }} className="w-full text-center tracking-[1em] text-3xl bg-gray-50 border border-gray-100 shadow-sm rounded-2xl py-4 px-2 text-main font-bold outline-none focus:ring-2 ring-gray-200 transition-all" />
                       {pinSetup.error && <p className="text-red-500 text-xs font-bold mt-3">{pinSetup.error}</p>}
                    </div>
                  )}
                  <div className="flex gap-4">
                    <button onClick={() => setPinSetup({isOpen: false, step: 'create', input: '', error: ''})} className="flex-1 bg-white border border-gray-200 shadow-sm text-main py-4 rounded-full font-bold active:scale-95 transition-transform">{pinSetup.step === 'create' ? t.cancel : t.no}</button>
                    <button onClick={async () => {
                       if (pinSetup.step === 'create') {
                         if (pinSetup.input.length === 6) { 
                             setPin(pinSetup.input); setPinSetup({isOpen: false, step: 'create', input: '', error: ''}); setMessageDialog({ isOpen: true, title: t.success, message: t.setupPinSuccess }); pushToCloud({ pin: pinSetup.input });
                         }
                         else setPinSetup({...pinSetup, error: t.req6digit});
                       } else {
                         setPin(''); setBiometricId(null); setPinSetup({isOpen: false, step: 'create', input: '', error: ''}); setMessageDialog({ isOpen: true, title: t.success, message: t.removePinSuccess }); pushToCloud({ pin: '' }); 
                       }
                    }} className={`flex-1 text-white py-4 rounded-full font-bold shadow-md active:scale-95 transition-transform ${pinSetup.step === 'create' ? 'bg-[#1C1C1E]' : 'bg-red-500'}`}>{pinSetup.step === 'create' ? t.save : t.yesDelete}</button>
                  </div>
                </div>
              </div>
            )}

            {/* Delete Account Modal */}
            {deleteAccountModal.isOpen && (
              <div className="fixed inset-0 z-[80] flex items-end justify-center bg-black/40 backdrop-blur-sm animate-fade-in p-0">
                <div className="ios-modal w-full max-w-2xl p-8 pb-12 relative shadow-[0_-10px_40px_rgba(0,0,0,0.1)] text-center animate-slide-up">
                  <div className="ios-handle mb-8"></div>
                  <div className="mx-auto w-16 h-16 bg-red-50 border border-red-100 text-red-500 rounded-full flex items-center justify-center mb-6"><Trash2 size={28}/></div>
                  <h3 className="text-2xl font-bold text-red-500 mb-3">{t.deleteAccount}</h3>
                  <p className="text-sm font-medium text-gray-500 mb-6 leading-relaxed px-4" dangerouslySetInnerHTML={{ __html: t.deleteAccountPrompt.replace('{username}', username || 'user') }}></p>
                  
                  <div className="mb-8">
                     <input type="text" placeholder={username} value={deleteAccountModal.input} onChange={(e) => setDeleteAccountModal({...deleteAccountModal, input: e.target.value})} className="w-full text-center text-lg bg-gray-50 border border-gray-100 shadow-sm rounded-full py-4 px-6 text-main font-bold outline-none focus:ring-2 ring-red-100 transition-all" />
                  </div>
                  <div className="flex gap-4">
                    <button onClick={() => setDeleteAccountModal({ isOpen: false, input: '' })} className="flex-1 bg-white border border-gray-200 shadow-sm text-main py-4 rounded-full font-bold active:scale-95 transition-transform">{t.cancel}</button>
                    <button onClick={handleDeleteAccount} className="flex-1 bg-red-500 text-white py-4 rounded-full font-bold active:scale-95 transition-transform shadow-md">{t.delete}</button>
                  </div>
                </div>
              </div>
            )}

            {/* Transaction Detail View Modal */}
            {selectedTx && (
              <div className="fixed inset-0 z-[80] flex items-end justify-center bg-black/40 backdrop-blur-sm animate-fade-in p-0" onClick={() => setSelectedTx(null)}>
                <div className="ios-modal w-full max-w-2xl p-8 pb-12 animate-slide-up shadow-[0_-10px_40px_rgba(0,0,0,0.1)] relative max-h-[95vh] overflow-y-auto hide-scrollbar" onClick={e => e.stopPropagation()}>
                  <div className="ios-handle mb-8"></div>
                  <button onClick={() => setSelectedTx(null)} className="absolute top-6 right-6 p-2 bg-gray-100 rounded-full text-gray-500"><X size={18} /></button>
                  
                  <div className="flex flex-col items-center mb-8">
                    <div className="w-20 h-20 rounded-full flex items-center justify-center font-bold text-white text-3xl shadow-sm mb-4" style={{backgroundColor: getBrandColor(selectedTx.merchant || selectedTx.note || '')}}>
                        {(selectedTx.merchant || getCatName(categories.find(c => c.id === selectedTx.categoryId)) || 'U').charAt(0).toUpperCase()}
                    </div>
                    <h2 className="text-2xl font-bold text-main">{selectedTx.merchant || getCatName(categories.find(c => c.id === selectedTx.categoryId))}</h2>
                    <p className="text-sm text-gray-500 font-medium">{new Date(selectedTx.date).toLocaleDateString(lang === 'id' ? 'id-ID' : 'en-US', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })} at {new Date(selectedTx.date).toLocaleTimeString(lang === 'id' ? 'id-ID' : 'en-US', { hour: '2-digit', minute: '2-digit' })}</p>
                    <p className="text-[11px] font-bold text-blue-500 bg-blue-50 border border-blue-100 px-3 py-1.5 rounded-full mt-3 uppercase tracking-wide">{selectedTx.status || 'Paid Successfully'}</p>
                  </div>
                  
                  <div className="bg-white border border-gray-100 shadow-[0_4px_20px_rgba(0,0,0,0.03)] p-5 rounded-[24px] space-y-4 mb-8 text-sm">
                     <div className="flex justify-between items-center border-b border-gray-50 pb-3"><span className="text-gray-400 font-bold uppercase tracking-wide text-[10px]">{t.amount}</span><span className={`font-bold text-lg ${selectedTx.type === 'income' ? 'text-green-600' : 'text-main'}`}>{formatCurrency(selectedTx.amount, selectedTx.currency || 'IDR')}</span></div>
                     <div className="flex justify-between items-center border-b border-gray-50 pb-3"><span className="text-gray-400 font-bold uppercase tracking-wide text-[10px]">{t.categories}</span><span className="font-bold text-main">{getCatName(categories.find(c => c.id === selectedTx.categoryId)) || '-'}</span></div>
                     <div className="flex justify-between items-center border-b border-gray-50 pb-3"><span className="text-gray-400 font-bold uppercase tracking-wide text-[10px]">{t.wallets}</span><span className="font-bold text-main">{getWalletName(selectedTx.walletId)}</span></div>
                     <div className="flex flex-col gap-2 pt-1"><span className="text-gray-400 font-bold uppercase tracking-wide text-[10px]">{t.note}</span><span className="font-medium text-main bg-gray-50 p-3 rounded-xl border border-gray-100">"{selectedTx.note || '-'}"</span></div>
                  </div>
                  
                  {selectedTx.photo && (
                    <div className="mb-8"><span className="text-[10px] font-bold text-gray-400 uppercase tracking-wide mb-3 block ml-2">{t.photoReceipt}</span><img src={selectedTx.photo} onClick={() => setPreviewImage(selectedTx.photo)} className="w-full h-48 object-cover rounded-2xl shadow-sm border border-gray-100 cursor-pointer" alt="Attachment" /></div>
                  )}

                  <div className="flex gap-4">
                    <button onClick={() => { const txToEdit = selectedTx; setSelectedTx(null); handleOpenTxModal(txToEdit.type, txToEdit.amount, txToEdit.currency || 'IDR', txToEdit.note || '', txToEdit.photo || '', txToEdit.walletId, txToEdit.id, txToEdit.categoryId); }} className="flex-1 bg-white border border-gray-200 text-main py-4 rounded-full font-bold flex items-center justify-center gap-2 active:scale-95 transition-transform shadow-sm"><Edit2 size={18} /> {t.edit}</button>
                    <button onClick={() => { const id = selectedTx.id; setSelectedTx(null); handleDeleteTx(id); }} className="flex-1 bg-red-50 border border-red-100 text-red-600 py-4 rounded-full font-bold flex items-center justify-center gap-2 active:scale-95 transition-transform shadow-sm"><Trash2 size={18} /> {t.delete}</button>
                  </div>
                </div>
              </div>
            )}

            {previewImage && (
              <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/90 backdrop-blur-xl p-4 animate-fade-in" onClick={() => setPreviewImage(null)}>
                <button className="absolute top-8 right-8 p-3 bg-white/20 rounded-full text-white hover:bg-white/30 transition-colors"><X size={24} /></button>
                <img src={previewImage} onClick={e => e.stopPropagation()} className="max-w-full max-h-[85vh] object-contain rounded-2xl animate-slide-up shadow-2xl border border-white/10" alt="Preview" />
              </div>
            )}
            
            {/* Support Modal */}
            {isSupportModalOpen && (
              <div className="fixed inset-0 z-[120] flex items-end md:items-center justify-center bg-black/40 backdrop-blur-sm animate-fade-in p-0 md:p-4">
                 <div className="bg-white w-full max-w-md rounded-t-[32px] md:rounded-[32px] p-6 pb-safe animate-slide-up shadow-[0_-10px_40px_rgba(0,0,0,0.1)] relative h-[85vh] md:h-[600px] flex flex-col mx-auto">
                    <div className="ios-handle mb-4 md:hidden"></div>
                    <button onClick={() => setIsSupportModalOpen(false)} className="absolute top-6 right-6 p-2 bg-gray-100 rounded-full text-gray-500 hover:text-gray-700 z-10"><X size={18}/></button>
                    
                    <div className="flex items-center gap-4 mb-6 mt-2 border-b border-gray-50 pb-4">
                       <div className="p-3.5 bg-[#1C1C1E] text-white rounded-full shadow-sm"><Bot size={24}/></div>
                       <div>
                         <h3 className="font-bold text-xl text-main tracking-tight">{t.csTitle}</h3>
                         <p className="text-[11px] font-bold text-green-500 uppercase tracking-wide flex items-center gap-1.5"><span className="w-1.5 h-1.5 bg-green-500 rounded-full animate-pulse block"></span> {t.aiAgent}</p>
                       </div>
                    </div>
                    
                    <div className="flex-1 bg-gray-50 rounded-[24px] p-5 overflow-y-auto hide-scrollbar space-y-5 mb-5 flex flex-col border border-gray-100">
                       <div className="flex items-end gap-3 max-w-[85%]">
                          <div className="w-8 h-8 rounded-full bg-[#1C1C1E] text-white flex items-center justify-center flex-shrink-0 shadow-sm"><Bot size={14}/></div>
                          <div className="bg-white p-4 rounded-2xl rounded-bl-sm shadow-sm text-sm text-main border border-gray-100 font-medium leading-relaxed">{t.supportWelcome}</div>
                       </div>
                       
                       {supportChat.map((chat, idx) => (
                          <div key={idx} className={`flex items-end gap-3 max-w-[85%] ${chat.isUser ? 'self-end flex-row-reverse' : ''}`}>
                             {!chat.isUser && <div className="w-8 h-8 rounded-full bg-[#1C1C1E] text-white flex items-center justify-center flex-shrink-0 shadow-sm"><Bot size={14}/></div>}
                             <div className={`p-4 rounded-2xl shadow-sm text-sm font-medium leading-relaxed ${chat.isUser ? 'bg-[#1C1C1E] text-white rounded-br-sm' : 'bg-white text-main rounded-bl-sm border border-gray-100'}`}>
                                {chat.text}
                             </div>
                          </div>
                       ))}
                       
                       {isAiTyping && (
                          <div className="flex items-end gap-3 max-w-[85%]">
                            <div className="w-8 h-8 rounded-full bg-[#1C1C1E] text-white flex items-center justify-center flex-shrink-0 shadow-sm"><Bot size={14}/></div>
                            <div className="bg-white p-5 rounded-2xl rounded-bl-sm shadow-sm flex items-center gap-2 border border-gray-100">
                               <div className="w-2 h-2 bg-gray-300 rounded-full animate-bounce"></div>
                               <div className="w-2 h-2 bg-gray-300 rounded-full animate-bounce" style={{animationDelay: '0.1s'}}></div>
                               <div className="w-2 h-2 bg-gray-300 rounded-full animate-bounce" style={{animationDelay: '0.2s'}}></div>
                            </div>
                          </div>
                       )}
                       
                       {supportChat.some(c => c.isUser) && !isAiTyping && (
                         <div className="flex justify-center mt-8 mb-2 animate-fade-in">
                            <a href={`mailto:ricky30chandra@gmail.com?subject=${encodeURIComponent(t.emailSubject)}`} className="bg-white border border-gray-200 shadow-sm text-main px-5 py-3 rounded-full text-xs font-bold flex items-center gap-2 active:scale-95 transition-transform"><MessageCircle size={18} className="text-[#1C1C1E]"/> {t.sendEmail}</a>
                         </div>
                       )}
                    </div>

                    <div className="flex gap-2 relative z-10 bg-white pt-2 mb-2">
                       <input type="text" value={supportInput} onChange={e => setSupportInput(e.target.value)} onKeyDown={e => e.key === 'Enter' && handleSendSupport()} placeholder={t.typeMessage} className="flex-1 bg-gray-50 border border-gray-100 rounded-full px-5 py-4 text-sm text-main font-medium outline-none focus:ring-2 focus:ring-gray-200 transition-all shadow-inner"/>
                       <button onClick={handleSendSupport} disabled={!supportInput.trim() || isAiTyping} className="bg-[#1C1C1E] text-white p-4 rounded-full active:scale-95 transition-transform disabled:opacity-50 flex items-center justify-center shadow-md"><Send size={18}/></button>
                    </div>
                 </div>
              </div>
            )}
            
            {/* Global Message Dialog */}
            {messageDialog.isOpen && (
              <div className="fixed inset-0 z-[130] flex items-center justify-center bg-black/40 backdrop-blur-sm animate-fade-in p-4">
                <div className="bg-white w-full max-w-[300px] rounded-[32px] p-8 text-center shadow-[0_20px_60px_rgba(0,0,0,0.15)] animate-slide-up">
                  <h3 className="font-bold text-xl text-main mb-3">{messageDialog.title}</h3>
                  <p className="text-sm text-gray-500 mb-8 font-medium leading-relaxed">{messageDialog.message}</p>
                  <button onClick={() => setMessageDialog({isOpen: false, title: '', message: ''})} className="w-full text-white font-bold py-4 bg-[#1C1C1E] rounded-full active:scale-[0.98] transition-transform shadow-md">{t.ok}</button>
                </div>
              </div>
            )}

            {toastMsg && (
              <div className="fixed top-12 left-1/2 transform -translate-x-1/2 z-[150] bg-[#1C1C1E] text-white px-6 py-3.5 rounded-full shadow-[0_10px_30px_rgba(0,0,0,0.2)] flex items-center gap-3 animate-slide-up border border-gray-700"><Check size={18} className="text-green-400" /><span className="font-bold text-sm tracking-wide">{toastMsg}</span></div>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <ErrorBoundary>
           <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
