    const getCurrentDateTimeLocal = () => {
      const now = new Date();
      now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
      return now.toISOString().slice(0, 16);
    };

    const compressImage = (file, callback) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = event => {
        const img = new Image();
        img.src = event.target.result;
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const MAX_WIDTH = 600; 
          let scaleSize = 1;
          if (img.width > MAX_WIDTH) { scaleSize = MAX_WIDTH / img.width; }
          canvas.width = img.width * scaleSize;
          canvas.height = img.height * scaleSize;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          callback(canvas.toDataURL('image/jpeg', 0.7));
        }
      }
    };

    function App() {

      const [pinInput, setPinInput] = useState('');
      
      const [pinSetup, setPinSetup] = useState({ isOpen: false, step: 'create', input: '', error: '' });
      const [messageDialog, setMessageDialog] = useState({ isOpen: false, title: '', message: '' });

      const t = dict[lang];

      // --- EFFECTS (Storage & Rate) ---
      useEffect(() => {
        const savedTx = localStorage.getItem('mawuang_tx');
        const savedCat = localStorage.getItem('mawuang_cat');
        const savedLang = localStorage.getItem('mawuang_lang');
        const savedPin = localStorage.getItem('mawuang_pin');
        
        if (savedTx) setTransactions(JSON.parse(savedTx));
        if (savedCat) setCategories(JSON.parse(savedCat));
        if (savedLang) setLang(savedLang);
        if (savedPin) {
          setPin(savedPin);
          setIsLocked(true); // Lock the app if PIN exists
        }
      }, []);

      useEffect(() => { localStorage.setItem('mawuang_tx', JSON.stringify(transactions)); }, [transactions]);
      useEffect(() => { localStorage.setItem('mawuang_cat', JSON.stringify(categories)); }, [categories]);
      useEffect(() => { localStorage.setItem('mawuang_lang', lang); }, [lang]);
      useEffect(() => { localStorage.setItem('mawuang_pin', pin); }, [pin]);

      useEffect(() => {
        const fetchExchangeRate = async () => {
          setIsLoadingRate(true);
          try {
            const response = await fetch('https://api.exchangerate-api.com/v4/latest/JPY');
            const data = await response.json();
            if (data && data.rates && data.rates.IDR) setExchangeRate(data.rates.IDR);
          } catch (error) { console.error("Gagal mengambil data kurs:", error); } 
          finally { setIsLoadingRate(false); }
        };
        fetchExchangeRate();
      }, []);

      // --- HELPER FUNCTIONS ---
      const formatCurrency = (amount, currencyCode) => {
        if (currencyCode === 'JPY') return new Intl.NumberFormat('ja-JP', { style: 'currency', currency: 'JPY' }).format(amount);
        return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(amount);
      };

      const getConvertedAmount = (amount, fromCurrency, toCurrency) => {
        if (fromCurrency === toCurrency) return amount;
        if (fromCurrency === 'JPY' && toCurrency === 'IDR') return amount * exchangeRate;
        if (fromCurrency === 'IDR' && toCurrency === 'JPY') return amount / exchangeRate;
        return amount;
      };

      const getCatName = (cat) => {
        if (!cat) return '';
        if (lang === 'jp' && cat.nameJp) return cat.nameJp;
        return cat.name;
      };
      
      const getWalletName = (wId) => {
        const w = wallets.find(x => x.id === wId);
        if(!w) return wId;
        return lang === 'id' ? w.name : w.nameJp;
      }

      const displayCurrency = lang === 'jp' ? 'JPY' : 'IDR';
      const totalIncome = transactions.filter(t => t.type === 'income').reduce((acc, curr) => acc + getConvertedAmount(curr.amount, curr.currency || 'IDR', displayCurrency), 0);
      const totalExpense = transactions.filter(t => t.type === 'expense').reduce((acc, curr) => acc + getConvertedAmount(curr.amount, curr.currency || 'IDR', displayCurrency), 0);
      const balance = totalIncome - totalExpense;

      // --- ACTIONS ---
      const handleOpenTxModal = (type, prefillAmount = '') => {
        setTxFormType(type);
        setTxError('');
        setTxFormData({ 
          amount: prefillAmount, 
          currency: lang === 'jp' ? 'JPY' : 'IDR',
          category: '', 
          note: prefillAmount ? (lang === 'id' ? 'Dari Struk' : 'レシートから') : '',
          date: getCurrentDateTimeLocal(),
          photo: '',
          walletId: 'cash'
        });
        setIsTxModalOpen(true);
      };

      const handleSaveTx = () => {
        if (!txFormData.amount) return setTxError(t.amountRequired);
        if (!txFormData.category) return setTxError(t.categoryRequired);
        
        const newTx = {
          id: Date.now().toString(),
          type: txFormType,
          amount: parseFloat(txFormData.amount),
          currency: txFormData.currency,
          categoryId: txFormData.category,
          note: txFormData.note,
          date: new Date(txFormData.date).toISOString(),
          photo: txFormData.photo || null,
          walletId: txFormData.walletId || 'cash'
        };
        
        setTransactions([newTx, ...transactions].sort((a, b) => new Date(b.date) - new Date(a.date)));
        setIsTxModalOpen(false);
      };

      const handleDeleteTx = (id) => setTransactions(transactions.filter(tx => tx.id !== id));
      const handleDeleteCategory = (id) => setCategories(categories.filter(c => c.id !== id));

      const handleAddCategory = () => {
        if (!newCatName) return;
        setCategories([...categories, { id: Date.now().toString(), name: newCatName, nameJp: newCatName, type: newCatType }]);
        setNewCatName('');
      };

      const handlePhotoUpload = (e) => {
        const file = e.target.files[0];
        if (file) compressImage(file, (dataUrl) => setTxFormData({ ...txFormData, photo: dataUrl }));
      };

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          setIsScanning(true);
          setScanError(false);
          
          // Kompres gambar agar penyimpanan memori HP tidak cepat penuh
          compressImage(file, async (compressedDataUrl) => {
            try {
              // Proses OCR Asli menggunakan Tesseract.js
              const result = await Tesseract.recognize(file, 'ind+eng');
              const text = result.data.text.toUpperCase();
              
              let foundAmount = '';
              const lines = text.split('\n');
              
              for (let line of lines) {
                  // Mencari baris yang mengandung kata TOTAL atau Rp di struk Indomaret/Alfamart
                  if (line.includes('TOTAL') || line.includes('TL') || line.includes('RP')) {
                      // Mencari pola angka ribuan (misal: 15.000, 15,000, atau 15000)
                      const matches = line.match(/\d{1,3}([.,]\d{3})+/g) || line.match(/\b\d{4,8}\b/g);
                      if (matches) {
                          // Ambil angka terakhir di baris tersebut (biasanya adalah jumlah akhirnya)
                          const cleanVal = parseInt(matches[matches.length - 1].replace(/[.,]/g, ''));
                          if (cleanVal > 0) {
                              foundAmount = cleanVal.toString();
                              break; // Berhenti mencari jika sudah ketemu angkanya
                          }
                      }
                  }
              }
              
              setIsScanning(false);
              setIsScannerOpen(false);
              
              // Buka Form Input dan otomatis lampirkan foto struk
              // Walau nominal gagal terbaca AI, foto tetap terlampir agar user mudah mengetik manual!
              setTxFormType('expense');
              setTxError('');
              setTxFormData({ 
                amount: foundAmount, 
                currency: lang === 'jp' ? 'JPY' : 'IDR',
                category: '', 
                note: foundAmount ? (lang === 'id' ? 'Dari Pindai Struk' : 'レシートスキャンから') : (lang === 'id' ? 'Cek nominal di foto struk' : '写真で金額を確認'),

              setIsScanning(false);
              setScanError(true);
            }
          });
        }
      };

      const handleExportCSV = () => {
        let finalFileName = exportFileName.trim() || `mawuang_report_${new Date().toISOString().slice(0, 10)}`;
        if (!finalFileName.endsWith('.csv')) finalFileName += '.csv';

        const headers = ['Transaction ID', 'Date', 'Time', 'Type', 'Category', 'Wallet', 'Note', 'Currency', 'Amount', `Converted Amount (${displayCurrency})`];
        const rows = transactions.map(tx => {
          const cat = categories.find(c => c.id === tx.categoryId);
          const txDate = new Date(tx.date);
          const convertedAmount = getConvertedAmount(tx.amount, tx.currency || 'IDR', displayCurrency);
          const safeNote = `"${(tx.note || '').replace(/"/g, '""')}"`;
          const safeCat = `"${(getCatName(cat) || 'Unknown').replace(/"/g, '""')}"`;
          const safeWallet = `"${getWalletName(tx.walletId).replace(/"/g, '""')}"`;

          return [ tx.id, txDate.toLocaleDateString(), txDate.toLocaleTimeString(), tx.type === 'income' ? 'Income' : 'Expense', safeCat, safeWallet, safeNote, tx.currency || 'IDR', tx.amount, convertedAmount.toFixed(2) ].join(',');
        });
        
        const csvContent = "\uFEFF" + [headers.join(','), ...rows].join('\n');
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.setAttribute('download', finalFileName);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
        setIsExportModalOpen(false);
        setExportFileName('');
      };

      // FEATURE: Backup / Restore JSON
      const handleBackupJSON = () => {
        const data = { transactions, categories, pin, lang };
        const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.setAttribute('download', `mawuang_backup_${new Date().toISOString().slice(0, 10)}.json`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      const handleRestoreJSON = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const data = JSON.parse(event.target.result);
            if (data.transactions) setTransactions(data.transactions);
            if (data.categories) setCategories(data.categories);
            if (data.pin !== undefined) setPin(data.pin);
            if (data.lang) setLang(data.lang);
            setMessageDialog({ isOpen: true, title: lang === 'id' ? 'Berhasil' : '成功', message: lang === 'id' ? 'Data berhasil dipulihkan!' : 'データが復元されました！' });
          } catch (err) {
            setMessageDialog({ isOpen: true, title: 'Error', message: 'File backup tidak valid!' });
          }
        };
        reader.readAsText(file);
      };

      // FEATURE: PIN Numpad Handlers
      const handlePinPress = (num) => {
        const newPin = pinInput + num;
        setPinInput(newPin);
        if (newPin.length === 4) {
          if (newPin === pin) {
            setIsLocked(false);
            setPinInput('');
            setLockError(false);
          } else {
            setLockError(true);
            setTimeout(() => {
              setPinInput('');
              setLockError(false);

          </div>

          <div className="grid grid-cols-3 gap-3">

      const renderReport = () => {
        const now = new Date();
        const currentYear = now.getFullYear();
        const currentMonth = now.getMonth();
        
        const isThisWeek = (date) => {
          const d = new Date(date);
          const startOfWeek = new Date(now); startOfWeek.setDate(now.getDate() - now.getDay()); startOfWeek.setHours(0, 0, 0, 0);
          const endOfWeek = new Date(now); endOfWeek.setDate(now.getDate() - now.getDay() + 6); endOfWeek.setHours(23, 59, 59, 999);
          return d >= startOfWeek && d <= endOfWeek;
        };

        const filteredTx = transactions.filter(tx => {
          const d = new Date(tx.date);
          if (reportPeriod === 'week') return isThisWeek(d);
          if (reportPeriod === 'month') return d.getMonth() === currentMonth && d.getFullYear() === currentYear;
          if (reportPeriod === 'year') return d.getFullYear() === currentYear;
          if (reportPeriod === 'custom') {
            const dt = d.getTime();
            const start = customStartDate ? new Date(customStartDate).setHours(0,0,0,0) : 0;
            const end = customEndDate ? new Date(customEndDate).setHours(23,59,59,999) : Infinity;
            return dt >= start && dt <= end;
          }
          return true;
        });

        const rIncome = filteredTx.filter(t => t.type === 'income').reduce((acc, curr) => acc + getConvertedAmount(curr.amount, curr.currency || 'IDR', displayCurrency), 0);
        const rExpense = filteredTx.filter(t => t.type === 'expense').reduce((acc, curr) => acc + getConvertedAmount(curr.amount, curr.currency || 'IDR', displayCurrency), 0);

        // Chart Data Calculation
        const expenseTx = filteredTx.filter(t => t.type === 'expense');
        const groupedChart = {};
        expenseTx.forEach(tx => {
           groupedChart[tx.categoryId] = (groupedChart[tx.categoryId] || 0) + getConvertedAmount(tx.amount, tx.currency || 'IDR', displayCurrency);
        });
        const chartTotal = Object.values(groupedChart).reduce((a,b)=>a+b, 0);
        const chartColors = ['#8B9D83', '#D4A373', '#6D7D62', '#C29363', '#A3B19B', '#4A4A4A'];
        let cumulativePercent = 0;
        
        const chartSlices = Object.entries(groupedChart).sort((a,b)=>b[1]-a[1]).map(([catId, amount], idx) => {
           const percent = amount / chartTotal;
           const slice = { catId, amount, percent, color: chartColors[idx % chartColors.length], start: cumulativePercent };
           cumulativePercent += percent;
           return slice;
        });
        const gradientString = chartTotal > 0 ? chartSlices.map(s => `${s.color} ${s.start * 100}% ${(s.start + s.percent) * 100}%`).join(', ') : '#f3f4f6 0% 100%';

        return (

                </div>

      const renderCategories = () => (
        <div className="p-6 pb-24 animate-fade-in relative z-10">
          <h1 className="text-2xl font-bold text-[#6D7D62] tracking-tight mb-6">{t.categories}</h1>

          <div className="space-y-3">
            {categories.map((c) => (
              <div key={c.id} className="bg-white p-4 rounded-3xl shadow-[0_4px_20px_-4px_rgba(0,0,0,0.05)] flex items-center justify-between">
                <div className="flex items-center gap-3">
                  <div className={`w-3 h-10 rounded-full ${c.type === 'income' ? 'bg-[#8B9D83]' : 'bg-[#D4A373]'}`}></div>
                  <span className="font-medium text-[#4A4A4A]">{getCatName(c)}</span>
                </div>
                {!DEFAULT_CATEGORIES.find(dc => dc.id === c.id) && <button onClick={() => handleDeleteCategory(c.id)} className="text-gray-300 hover:text-red-400 p-2"><Trash2 size={18} /></button>}
              </div>
            ))}
          </div>
        </div>
      );

      const renderSettings = () => (
        <div className="p-6 pb-24 animate-fade-in relative z-10 space-y-4">
          <h1 className="text-2xl font-bold text-[#6D7D62] tracking-tight mb-6">{t.settings}</h1>
          
          <div className="bg-white p-5 rounded-3xl shadow-[0_4px_20px_-4px_rgba(0,0,0,0.05)] flex justify-between items-center">
            <div className="flex items-center gap-3">
              <div className="bg-[#E8EAE6] p-2 rounded-xl text-[#6D7D62]"><Globe size={20}/></div>
              <h3 className="font-semibold text-[#4A4A4A]">{t.language}</h3>
            </div>
            <div className="w-16 h-8 bg-[#E8EAE6] rounded-full p-1 cursor-pointer relative shadow-inner" onClick={() => setLang(lang === 'id' ? 'jp' : 'id')}>
              <div className={`w-6 h-6 bg-white rounded-full shadow transform transition-transform duration-300 ease-out flex items-center justify-center ${lang === 'jp' ? 'translate-x-8' : 'translate-x-0'}`}>
                <span className="text-[10px] font-bold text-[#8B9D83]">{lang === 'id' ? 'ID' : 'JP'}</span>
              </div>
            </div>
          </div>

          <div className="bg-white p-5 rounded-3xl shadow-[0_4px_20px_-4px_rgba(0,0,0,0.05)]">
            <div className="flex items-center gap-3 mb-2">
              <div className="bg-[#E8EAE6] p-2 rounded-xl text-[#6D7D62]"><Cloud size={20}/></div>
              <h3 className="font-semibold text-[#4A4A4A]">{t.cloudBackup}</h3>
            </div>
            <p className="text-[10px] text-gray-400 mb-4 ml-11">{t.backupDesc}</p>
            <div className="flex gap-2 ml-11">
              <button onClick={handleBackupJSON} className="flex-1 bg-[#8B9D83] text-white py-2.5 rounded-xl text-[10px] sm:text-xs font-bold flex items-center justify-center gap-1.5 shadow-sm active:scale-95 transition-transform"><UploadCloud size={14}/> {t.exportData}</button>
              <label className="flex-1 bg-gray-100 text-[#4A4A4A] py-2.5 rounded-xl text-[10px] sm:text-xs font-bold flex items-center justify-center gap-1.5 cursor-pointer shadow-sm active:scale-95 transition-transform"><DownloadCloud size={14}/> {t.importData} <input type="file" accept=".json" className="hidden" onChange={handleRestoreJSON}/></label>
            </div>
          </div>

          <div className="bg-white p-5 rounded-3xl shadow-[0_4px_20px_-4px_rgba(0,0,0,0.05)] flex justify-between items-center">
            <div className="flex items-center gap-3">
              <div className="bg-[#F6EBE1] p-2 rounded-xl text-[#D4A373]">{pin ? <Lock size={20}/> : <Unlock size={20}/>}</div>
              <h3 className="font-semibold text-[#4A4A4A]">{t.pinSecurity}</h3>
            </div>
            <div className={`w-12 h-6 rounded-full p-1 cursor-pointer relative shadow-inner transition-colors duration-300 ${pin ? 'bg-[#8B9D83]' : 'bg-gray-200'}`} onClick={togglePinSetting}>
              <div className={`w-4 h-4 bg-white rounded-full shadow transform transition-transform duration-300 ease-out ${pin ? 'translate-x-6' : 'translate-x-0'}`}></div>
            </div>
          </div>

          <div className="bg-white p-5 rounded-3xl shadow-[0_4px_20px_-4px_rgba(0,0,0,0.05)]">
            <div className="flex items-center gap-3 mb-4">
              <div className="bg-[#E8EAE6] p-2 rounded-xl text-[#6D7D62]"><Download size={20}/></div>
              <h3 className="font-semibold text-[#4A4A4A]">{t.exportExcel}</h3>
            </div>
            <button onClick={() => { setExportFileName(`mawuang_report_${new Date().toISOString().slice(0, 10)}`); setIsExportModalOpen(true); }} className="w-full bg-[#4A4A4A] text-white p-4 rounded-2xl font-semibold hover:bg-gray-800 transition-colors flex justify-center items-center gap-2">
              <Download size={18} /> {t.exportExcel}
            </button>
          </div>

          <div className="bg-white p-5 rounded-3xl shadow-[0_4px_20px_-4px_rgba(0,0,0,0.05)]">
            <div className="flex items-center gap-3 mb-2">
              <div className="bg-[#F6EBE1] p-2 rounded-xl text-[#D4A373]"><Info size={20}/></div>
              <h3 className="font-semibold text-[#4A4A4A]">{t.aboutApp}</h3>
            </div>
            <p className="text-xs text-gray-500 leading-relaxed pl-11">{t.aboutAppDesc}</p>
          </div>
        </div>
      );

      return (
        <div className="min-h-screen bg-[#FDFBF7] text-[#4A4A4A] font-sans selection:bg-[#8B9D83] selection:text-white flex justify-center">
          <div className="w-full max-w-md bg-[#FDFBF7] min-h-screen relative shadow-2xl overflow-x-hidden">
            
            <div className="absolute inset-0 pointer-events-none z-0 overflow-hidden flex items-center justify-center opacity-[0.03]">
               {lang === 'jp' ? <ToriiGateLogo className="text-[#6D7D62]" size={500} /> : <CandiLogo className="text-[#6D7D62]" size={500} />}
            </div>

            {activeTab === 'home' && renderHome()}
            {activeTab === 'report' && renderReport()}
            {activeTab === 'categories' && renderCategories()}
            {activeTab === 'settings' && renderSettings()}

            <div className="fixed bottom-0 w-full max-w-md bg-white/85 backdrop-blur-md border-t border-gray-100 p-4 pb-6 flex justify-around items-center z-40 rounded-t-3xl shadow-[0_-10px_40px_rgba(0,0,0,0.03)]">
              <button onClick={() => setActiveTab('home')} className={`flex flex-col items-center gap-1 transition-colors ${activeTab === 'home' ? 'text-[#8B9D83]' : 'text-gray-400 hover:text-gray-600'}`}><Home size={24} /> <span className="text-[10px] font-semibold">{t.home}</span></button>
              <button onClick={() => setActiveTab('report')} className={`flex flex-col items-center gap-1 transition-colors ${activeTab === 'report' ? 'text-[#8B9D83]' : 'text-gray-400 hover:text-gray-600'}`}><BarChart2 size={24} /> <span className="text-[10px] font-semibold">{t.report}</span></button>
              <button onClick={() => setActiveTab('categories')} className={`flex flex-col items-center gap-1 transition-colors ${activeTab === 'categories' ? 'text-[#8B9D83]' : 'text-gray-400 hover:text-gray-600'}`}><Tags size={24} /> <span className="text-[10px] font-semibold">{t.categories}</span></button>
              <button onClick={() => setActiveTab('settings')} className={`flex flex-col items-center gap-1 transition-colors ${activeTab === 'settings' ? 'text-[#8B9D83]' : 'text-gray-400 hover:text-gray-600'}`}><Settings size={24} /> <span className="text-[10px] font-semibold">{t.settings}</span></button>
            </div>

            {isTxModalOpen && (
              <div className="fixed inset-0 z-50 flex items-end justify-center bg-black/40 backdrop-blur-sm animate-fade-in p-0 max-w-md mx-auto">
                <div className="bg-white w-full rounded-t-[40px] p-6 pb-12 animate-slide-up shadow-2xl relative max-h-[90vh] overflow-y-auto hide-scrollbar">
                  <button onClick={() => setIsTxModalOpen(false)} className="absolute top-6 right-6 p-2 bg-gray-50 rounded-full text-gray-400 hover:text-gray-700"><X size={20} /></button>
                  <h2 className="text-xl font-bold mb-6 text-[#4A4A4A]">{t.newTransaction} - {txFormType === 'income' ? t.addIncome : t.addExpense}</h2>
                  
                  {txFormType === 'expense' && parseFloat(txFormData.amount) > 0 && getConvertedAmount(parseFloat(txFormData.amount), txFormData.currency, displayCurrency) > balance && (
                    <div className="bg-orange-50 text-orange-500 p-3 rounded-2xl text-sm font-semibold flex items-center gap-2 mb-4 animate-fade-in"><AlertCircle size={18} /> {t.insufficientBalance}</div>
                  )}
                  {txError && <div className="bg-red-50 text-red-500 p-3 rounded-2xl text-sm font-semibold flex items-center gap-2 mb-4 animate-fade-in"><AlertCircle size={18} /> {txError}</div>}

                  <div className="space-y-4">
                    <div className="w-full">
                      <label className="block text-xs font-semibold text-gray-400 mb-2">{t.amount}</label>
                      <div className="flex gap-3 w-full">
                        <select value={txFormData.currency} onChange={(e) => setTxFormData({...txFormData, currency: e.target.value})} className="bg-gray-50 border-none rounded-2xl px-3 font-bold text-[#8B9D83] focus:ring-2 focus:ring-[#8B9D83] outline-none cursor-pointer flex-shrink-0 appearance-none">
                          <option value="IDR">IDR</option><option value="JPY">JPY</option>
                        </select>
                        <input type="number" value={txFormData.amount} onChange={(e) => {setTxFormData({...txFormData, amount: e.target.value}); setTxError('');}} placeholder="0" className="flex-1 w-full min-w-0 bg-gray-50 border-none rounded-2xl p-4 text-2xl font-bold text-[#4A4A4A] focus:ring-2 focus:ring-[#8B9D83] outline-none transition-shadow"/>
                      </div>
                    </div>
                    <div className="w-full">
                      <label className="block text-xs font-semibold text-gray-400 mb-2">{t.categories}</label>
                      <select value={txFormData.category} onChange={(e) => {setTxFormData({...txFormData, category: e.target.value}); setTxError('');}} className="w-full min-w-0 bg-gray-50 border-none rounded-2xl p-4 text-[#4A4A4A] focus:ring-2 focus:ring-[#8B9D83] outline-none appearance-none">
                        <option value="" disabled>{t.selectCategory}</option>
                        {categories.filter(c => c.type === txFormType).map(c => (<option key={c.id} value={c.id}>{getCatName(c)}</option>))}
                      </select>
                    </div>
                    <div className="w-full min-w-0 overflow-hidden">
                      <label className="block text-xs font-semibold text-gray-400 mb-2">{t.dateTime}</label>
                      <input type="datetime-local" value={txFormData.date} onChange={(e) => setTxFormData({...txFormData, date: e.target.value})} className="w-full max-w-full block box-border min-w-0 bg-gray-50 border-none rounded-2xl px-3 py-4 text-xs sm:text-sm text-[#4A4A4A] focus:ring-2 focus:ring-[#8B9D83] outline-none transition-shadow appearance-none"/>
                    </div>
                    <div className="w-full min-w-0">
                      <label className="block text-xs font-semibold text-gray-400 mb-2">{t.wallets}</label>
                      <select value={txFormData.walletId || 'cash'} onChange={(e) => setTxFormData({...txFormData, walletId: e.target.value})} className="w-full min-w-0 bg-gray-50 border-none rounded-2xl p-4 text-[#4A4A4A] focus:ring-2 focus:ring-[#8B9D83] outline-none appearance-none">
                        {wallets.map(w => <option key={w.id} value={w.id}>{lang === 'id' ? w.name : w.nameJp}</option>)}
                      </select>
                    </div>
                    <div className="w-full">
                      <label className="block text-xs font-semibold text-gray-400 mb-2">{t.note}</label>
                      <input type="text" value={txFormData.note} onChange={(e) => setTxFormData({...txFormData, note: e.target.value})} placeholder="..." className="w-full box-border min-w-0 bg-gray-50 border-none rounded-2xl p-4 text-[#4A4A4A] focus:ring-2 focus:ring-[#8B9D83] outline-none transition-shadow"/>
                    </div>
                    <div className="w-full pt-2">
                      <label className="block text-xs font-semibold text-gray-400 mb-2">{t.addPhoto}</label>
                      {txFormData.photo ? (
                        <div className="relative inline-block mt-1">
                          <img src={txFormData.photo} alt="Lampiran" className="h-28 w-28 object-cover rounded-2xl border-2 border-gray-100 shadow-sm" />
                          <button onClick={() => setTxFormData({...txFormData, photo: ''})} className="absolute -top-3 -right-3 bg-red-400 text-white rounded-full p-1.5 hover:bg-red-500 shadow-md transition-transform active:scale-95"><X size={14} /></button>
                        </div>
                      ) : (
                        <label className="flex items-center justify-center gap-2 w-full bg-gray-50 border-2 border-dashed border-gray-200 rounded-2xl p-4 text-gray-400 cursor-pointer hover:bg-gray-100 transition-colors">
                          <ImageIcon size={20} /> <span className="text-sm font-semibold">{t.addPhoto}</span>
                          <input type="file" accept="image/*" className="hidden" onChange={handlePhotoUpload} />
                        </label>
                      )}
                    </div>
                    <button onClick={handleSaveTx} className={`w-full py-4 rounded-2xl font-bold text-white mt-6 shadow-lg transition-transform active:scale-95 ${txFormType === 'income' ? 'bg-[#8B9D83] hover:bg-[#778B6F]' : 'bg-[#D4A373] hover:bg-[#C29363]'}`}>{t.save}</button>
                  </div>
                </div>
              </div>
            )}

            {isScannerOpen && (
              <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-md animate-fade-in p-4 max-w-md mx-auto">
                <div className="bg-white w-full max-w-sm rounded-[32px] p-6 text-center relative overflow-hidden">
                  <button onClick={() => { if(!isScanning) { setIsScannerOpen(false); setScanError(false); } }} className="absolute top-4 right-4 p-2 bg-gray-50 rounded-full text-gray-400 hover:text-gray-700"><X size={20} /></button>
                  <div className="my-8">
                    {isScanning ? (
                      <div className="flex flex-col items-center">
                        <div className="w-16 h-16 border-4 border-[#8B9D83] border-t-transparent rounded-full animate-spin mb-4"></div>
                        <p className="font-semibold text-[#6D7D62]">{t.scanning}</p>
                      </div>
                    ) : scanError ? (
                      <div className="flex flex-col items-center animate-fade-in">
                        <div className="bg-red-50 p-6 rounded-full mb-6"><AlertCircle size={40} className="text-red-400" /></div>
                        <h3 className="font-bold text-lg mb-2 text-[#4A4A4A] text-center">{t.scanFailed}</h3>
                        <label className="mt-4 bg-[#4A4A4A] text-white px-8 py-4 rounded-2xl font-semibold cursor-pointer shadow-lg transition-all active:scale-95">
                          {t.tryAgain} <input type="file" accept="image/*" className="hidden" onChange={handleFileUpload} />
                        </label>
                      </div>
                    ) : (
                      <div className="flex flex-col items-center">
                        <div className="bg-[#E8EAE6] p-6 rounded-full mb-6"><Camera size={40} className="text-[#8B9D83]" /></div>
                        <h3 className="font-bold text-lg mb-2 text-[#4A4A4A]">{t.scanInstruction}</h3>
                        <label className="mt-4 bg-[#8B9D83] text-white px-8 py-4 rounded-2xl font-semibold cursor-pointer shadow-lg transition-all active:scale-95">
                          {t.scan} <input type="file" accept="image/*" className="hidden" onChange={handleFileUpload} />
                        </label>
                      </div>
                    )}
                  </div>
                </div>
              </div>
            )}

            {isExportModalOpen && (
              <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-md animate-fade-in p-4 max-w-md mx-auto">
                <div className="bg-white w-full max-w-sm rounded-[32px] p-6 relative overflow-hidden animate-slide-up shadow-2xl">
                  <button onClick={() => setIsExportModalOpen(false)} className="absolute top-4 right-4 p-2 bg-gray-50 rounded-full text-gray-400 hover:text-gray-700"><X size={20} /></button>
                  <h3 className="font-bold text-lg mb-4 text-[#4A4A4A] text-center">{t.exportFileName}</h3>
                  <input type="text" value={exportFileName} onChange={(e) => setExportFileName(e.target.value)} placeholder="mawuang_report..." className="w-full box-border min-w-0 bg-gray-50 border-none rounded-2xl p-4 text-[#4A4A4A] focus:ring-2 focus:ring-[#8B9D83] outline-none transition-shadow mb-6 text-center font-medium"/>
                  <button onClick={handleExportCSV} className="w-full bg-[#8B9D83] text-white p-4 rounded-2xl font-bold transition-all active:scale-95 shadow-lg flex justify-center items-center gap-2">
                    <Download size={18} /> {t.exportConfirm}
                  </button>
                </div>
              </div>
            )}

            {/* CUSTOM MODALS FOR PIN & ALERTS */}
            {pinSetup.isOpen && (
              <div className="fixed inset-0 z-[60] flex items-center justify-center bg-black/60 backdrop-blur-sm animate-fade-in p-4 max-w-md mx-auto">
                <div className="bg-white w-full max-w-sm rounded-[32px] p-6 relative shadow-2xl text-center">
                  <div className="mx-auto w-12 h-12 bg-[#F6EBE1] text-[#D4A373] rounded-full flex items-center justify-center mb-4">
                     {pinSetup.step === 'create' ? <Lock size={24}/> : <Unlock size={24}/>}
                  </div>
                  <h3 className="text-lg font-bold text-[#4A4A4A] mb-2">
                    {pinSetup.step === 'create' ? (lang==='id'?'Atur PIN Baru':'新しいPINを設定') : (lang==='id'?'Hapus PIN':'PINを削除')}
                  </h3>
                  <p className="text-xs text-gray-400 mb-6">
                    {pinSetup.step === 'create' ? (lang==='id'?'Masukkan 4 digit angka keamanan':'4桁のセキュリティ番号を入力してください') : (lang==='id'?'Apakah Anda yakin ingin menghapus keamanan PIN?':'PINセキュリティを削除してもよろしいですか？')}
                  </p>
                  
                  {pinSetup.step === 'create' && (
                    <div className="mb-6">
                       <input 
                         type="password" 
                         maxLength="4"
                         placeholder="••••"
                         value={pinSetup.input}
                         onChange={(e) => {
                            const val = e.target.value.replace(/\D/g, '');
                            setPinSetup({...pinSetup, input: val, error: ''});
                         }}
                         className="w-full text-center tracking-[1em] text-2xl bg-gray-50 border-none rounded-2xl p-4 text-[#4A4A4A] focus:ring-2 focus:ring-[#8B9D83] outline-none"
                       />
                       {pinSetup.error && <p className="text-red-400 text-xs font-semibold mt-2">{pinSetup.error}</p>}
                    </div>
                  )}

                  <div className="flex gap-3">
                    <button onClick={() => setPinSetup({isOpen: false, step: 'create', input: '', error: ''})} className="flex-1 bg-gray-100 text-[#4A4A4A] p-3 rounded-2xl font-bold">
                      {pinSetup.step === 'create' ? t.cancel : (lang === 'id' ? 'Tidak' : 'いいえ')}
                    </button>
                    <button onClick={() => {
                       if (pinSetup.step === 'create') {
                         if (pinSetup.input.length === 4) {
                            setPin(pinSetup.input);
                            setPinSetup({isOpen: false, step: 'create', input: '', error: ''});
                            setMessageDialog({ isOpen: true, title: lang === 'id' ? 'Sukses' : '成功', message: lang==='id'?'PIN berhasil dipasang!':'PINが正常に設定されました！' });
                         } else {
                            setPinSetup({...pinSetup, error: lang==='id'?'Harus 4 digit angka!':'4桁の数字である必要があります！'});
                         }
                       } else {
                         setPin('');
                         setPinSetup({isOpen: false, step: 'create', input: '', error: ''});
                         setMessageDialog({ isOpen: true, title: lang === 'id' ? 'Berhasil' : '成功', message: lang==='id'?'PIN berhasil dihapus!':'PINが削除されました！' });
                       }
                    }} className={`flex-1 text-white p-3 rounded-2xl font-bold ${pinSetup.step === 'create' ? 'bg-[#8B9D83]' : 'bg-red-400 hover:bg-red-500'}`}>
                      {pinSetup.step === 'create' ? t.save : (lang === 'id' ? 'Ya, Hapus' : 'はい、削除します')}
                    </button>
                  </div>
                </div>
              </div>
            )}

            {messageDialog.isOpen && (
              <div className="fixed inset-0 z-[70] flex items-center justify-center bg-black/60 backdrop-blur-sm animate-fade-in p-4 max-w-md mx-auto">
                <div className="bg-white w-full max-w-[280px] rounded-[32px] p-6 text-center shadow-2xl">
                  <h3 className="font-bold text-lg text-[#4A4A4A] mb-2">{messageDialog.title}</h3>
                  <p className="text-sm text-gray-500 mb-6">{messageDialog.message}</p>
                  <button onClick={() => setMessageDialog({isOpen: false, title: '', message: ''})} className="w-full bg-[#8B9D83] text-white p-3 rounded-2xl font-bold">OK</button>
                </div>
              </div>
            )}

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
