    class ErrorBoundary extends Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) { return { hasError: true, error }; }
      componentDidCatch(error, errorInfo) { console.error("ErrorBoundary caught error:", error, errorInfo); }
      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen app-bg flex items-center justify-center p-6">
              <div className="bg-white p-8 rounded-3xl shadow-xl max-w-md w-full text-center">
                <div className="w-20 h-20 bg-red-50 text-red-400 rounded-full flex items-center justify-center mx-auto mb-6 text-3xl font-bold">!</div>
                <h2 className="text-2xl font-bold text-gray-800 mb-3">Terjadi Kendala Sistem</h2>
                <p className="text-sm text-gray-500 mb-8">{this.state.error?.message || 'Gagal memuat komponen aplikasi.'}</p>
                <button onClick={() => window.location.reload()} className="w-full bg-[#007AFF] text-white py-4 rounded-xl font-bold active:scale-95 transition-all">Muat Ulang Aplikasi</button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    const idb = {
      db: null,
      init: async () => {
        if (idb.db) return idb.db;
        return new Promise((resolve, reject) => {
          const req = indexedDB.open('mawuang_db', 24);
          req.onupgradeneeded = (e) => { 
              if(!e.target.result.objectStoreNames.contains('store')) {
                 e.target.result.createObjectStore('store'); 
              }
          };
          req.onsuccess = (e) => { idb.db = e.target.result; resolve(idb.db); };
          req.onerror = () => reject('IDB error');
        });
      },
      get: async (key) => {
        try {
          const db = await idb.init();
          return new Promise((resolve) => {
            const tx = db.transaction('store', 'readonly');
            const req = tx.objectStore('store').get(key);
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => resolve(null);
          });
        } catch(e) { return null; }
      },
      set: async (key, val) => {
        try {
          const db = await idb.init();
          return new Promise((resolve) => {
            const tx = db.transaction('store', 'readwrite');
            tx.objectStore('store').put(val, key);
            tx.oncomplete = () => resolve();
            tx.onerror = () => resolve();
          });
        } catch(e) {}
      },
      remove: async (key) => {
        try {
          const db = await idb.init();
          return new Promise((resolve) => {
            const tx = db.transaction('store', 'readwrite');
            tx.objectStore('store').delete(key);
            tx.oncomplete = () => resolve();
            tx.onerror = () => resolve();
          });
        } catch(e) {}
      }
    };

    const compressImage = (file, callback) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = event => {
        const img = new Image();
        img.src = event.target.result;
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const MAX_WIDTH = 600; 
          let scaleSize = 1;
          if (img.width > MAX_WIDTH) { scaleSize = MAX_WIDTH / img.width; }
          canvas.width = img.width * scaleSize;
          canvas.height = img.height * scaleSize;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          callback(canvas.toDataURL('image/jpeg', 0.7));
        }
      }
    };

            try {
              const result = await Tesseract.recognize(file, 'ind+eng+jpn');
              const text = result.data.text.toUpperCase();
              
              const isJapaneseReceipt = /(¥|円|合計|お買上額|お預り|お釣|消費税|SUICA|PASMO|PAYPAY)/.test(text);
              const detectedCurrency = isJapaneseReceipt ? 'JPY' : 'IDR';
              
              let detectedWallet = wallets[0]?.id || 'cash';
              const upperText = text;
              
              const findWalletByNameMatch = (keywords) => {
                  for (let kw of keywords) {
                      const matched = wallets.find(w => w.name.toUpperCase().includes(kw) || w.id.toUpperCase().includes(kw));
                      if (matched) return matched.id;
                  }
                  return null;
              };

              if (upperText.includes('GOPAY') || upperText.includes('GOJEK')) {
                  detectedWallet = findWalletByNameMatch(['GOPAY', 'GO-JEK']) || detectedWallet;
              } else if (upperText.includes('OVO')) {
                  detectedWallet = findWalletByNameMatch(['OVO']) || detectedWallet;
              } else if (upperText.includes('DANA')) {
                  detectedWallet = findWalletByNameMatch(['DANA']) || detectedWallet;
              } else if (upperText.includes('SHOPEEPAY') || upperText.includes('SPAY')) {
                  detectedWallet = findWalletByNameMatch(['SHOPEE', 'SPAY', 'PAY']) || detectedWallet;
              } else if (upperText.includes('BCA')) {
                  detectedWallet = findWalletByNameMatch(['BCA', 'BANK', 'REKENING']) || detectedWallet;
              } else if (upperText.includes('MANDIRI') || upperText.includes('LIVIN')) {
                  detectedWallet = findWalletByNameMatch(['MANDIRI', 'LIVIN', 'BANK']) || detectedWallet;
              } else if (upperText.includes('BNI')) {
                  detectedWallet = findWalletByNameMatch(['BNI', 'BANK']) || detectedWallet;
              } else if (upperText.includes('BRI') || upperText.includes('BRIMO')) {
                  detectedWallet = findWalletByNameMatch(['BRI', 'BRIMO', 'BANK']) || detectedWallet;
              } else if (upperText.includes('SUICA')) {
                  detectedWallet = findWalletByNameMatch(['SUICA', 'IC CARD']) || detectedWallet;
              } else if (upperText.includes('PASMO')) {
                  detectedWallet = findWalletByNameMatch(['PASMO', 'IC CARD']) || detectedWallet;
              } else {
                  const ewalletRegex = /(QRIS|PAYPAY|SUICA|PASMO|電子マネー|GOPAY|SHOPEEPAY|SPAY|OVO|DANA|LINKAJA|E-WALLET)/;
                  const bankRegex = /(CREDIT|KREDIT|DEBIT|KARTU|CARD|カード|クレジット|MANDIRI|BCA|BNI|BRI|BSI|CIMB|PERMATA|LIVIN|BRIMO|VISA|MASTER)/;
                  if (ewalletRegex.test(upperText)) {
                      detectedWallet = wallets.find(w => w.id === 'ewallet' || w.name.toUpperCase().includes('E-WALLET') || w.name.toUpperCase().includes('PAY'))?.id || detectedWallet;
                  } else if (bankRegex.test(upperText)) {
                      detectedWallet = wallets.find(w => w.id === 'bank' || w.name.toUpperCase().includes('BANK') || w.name.toUpperCase().includes('KARTU') || w.name.toUpperCase().includes('REKENING'))?.id || detectedWallet;
                  }
              }

              const flatText = text.replace(/\s+/g, ' ').replace(/T O T A L/g, 'TOTAL').replace(/合 計/g, '合計');
              let foundAmount = '';
              const getAmountFromProximity = (keywordsArray) => {
                  let maxVal = 0;
                  for (let kw of keywordsArray) {
                      let startIndex = 0, index;
                      while ((index = flatText.indexOf(kw, startIndex)) > -1) {
                          const scanRadius = flatText.substring(index, index + kw.length + 60);
                          const matches = scanRadius.match(/(?:RP|¥)?\s*(\d{1,3}([.,]\d{3})+|\d{3,8})/g);
                          if (matches) {
                              for(let m of matches) {
                                  const cleanVal = parseInt(m.replace(/[^\d]/g, ''), 10);
                                  if (cleanVal > 0 && cleanVal < 50000000 && cleanVal.toString().length < 9) {
                                      if(cleanVal > maxVal) maxVal = cleanVal;
                                  }
                              }
                          }
                          startIndex = index + kw.length;
                      }
                      if (maxVal > 0) return maxVal.toString(); 
                  }
                  return '';
              };

              const tier1 = ['TOTAL BELANJA', 'GRAND TOTAL', 'TOTAL TAGIHAN', 'HARGA JUAL', 'NOMINAL', 'JUMLAH', 'SEBESAR', 'TOTAL BAYAR', 'お買上額'];
              const tier2 = ['TOTAL', 'T0TAL', 'AMOUNT', '合計', '計', 'CREDIT', 'KREDIT', 'DEBIT', 'QRIS', 'PAYPAY', 'SUICA', 'PASMO', 'カード', 'クレジット', '電子マネー', 'GOPAY', 'SHOPEEPAY'];
              const tier3 = ['BAYAR', 'DIBAYAR', 'CASH', 'TUNAI', '預り', 'お預り'];

              foundAmount = getAmountFromProximity(tier1);
              if (!foundAmount) foundAmount = getAmountFromProximity(tier2);
              if (!foundAmount) foundAmount = getAmountFromProximity(tier3);
              
              if (!foundAmount) {
                  const fallbackRegex = /(?:RP\.?|IDR|¥|YEN|円)\s*(\d+([.,]\d{3})*)/g;
                  let match, maxFallback = 0;
                  while ((match = fallbackRegex.exec(flatText)) !== null) {
                      const val = parseInt(match[1].replace(/[^\d]/g, ''), 10);
                      if (val > maxFallback && val < 50000000) maxFallback = val;
                  }
                  if (maxFallback > 0) foundAmount = maxFallback.toString();
              }
              
              const isBankTransfer = /(BERHASIL|SUKSES|TRANSFER|BCA|MANDIRI|BNI|BRI|BSI|CIMB|PERMATA|LIVIN|BRIMO|OVO|GOPAY|DANA|SHOPEEPAY)/.test(text);
              if (!foundAmount && isBankTransfer) {
                  const numRegex = /\b(\d{1,3}([.,]\d{3})+)\b/g;
                  let match, maxFallback = 0;
                  while ((match = numRegex.exec(flatText)) !== null) {
                      const val = parseInt(match[1].replace(/[^\d]/g, ''), 10);
                      if (val > maxFallback && val < 500000000) maxFallback = val;
                  }
                  if (maxFallback > 0) foundAmount = maxFallback.toString();
              }

              setIsScanning(false); setIsScannerOpen(false);
              const defaultCatForScan = categories.find(c => ['lain-lain', 'lainnya', 'belanja'].includes(c.name.toLowerCase()))?.id || categories[0]?.id;

              if (foundAmount) {
                 handleOpenTxModal('expense', foundAmount, detectedCurrency, lang === 'id' ? 'Dari Pindai Struk/Screenshot' : 'レシート/スクリーンショットから', compressedDataUrl, detectedWallet, null, defaultCatForScan);
              } else {
                 setTempScanPhoto(compressedDataUrl); setScanError(true); setIsScannerOpen(true);
              }

              setIsScanning(false); setTempScanPhoto(compressedDataUrl); setScanError(true);
            }

        }

                    <div className="py-6 text-center text-xs text-gray-400 flex items-center justify-center gap-2"><div className="w-4 h-4 border-2 border-gray-300 border-t-blue-500 rounded-full animate-spin"></div>{t.loadingNews}</div>
                  ) : newsList.length === 0 ? (

        const now = new Date();
        const isThisWeek = (date) => {
          const d = new Date(date);
          const start = new Date(now); start.setDate(now.getDate() - now.getDay()); start.setHours(0,0,0,0);
          const end = new Date(now); end.setDate(now.getDate() - now.getDay() + 6); end.setHours(23,59,59,999);
          return d >= start && d <= end;
        };
        const filteredTx = transactions.filter(tx => {
          const d = new Date(tx.date);
          if (reportPeriod === 'week') return isThisWeek(d);
          if (reportPeriod === 'month') return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
          if (reportPeriod === 'year') return d.getFullYear() === now.getFullYear();
          if (reportPeriod === 'custom') {
            const dt = d.getTime();
            const start = customStartDate ? new Date(customStartDate).setHours(0,0,0,0) : 0;
            const end = customEndDate ? new Date(customEndDate).setHours(23,59,59,999) : Infinity;
            return dt >= start && dt <= end;
          }
          return true;
        });
        const rIncome = filteredTx.filter(t => t.type === 'income').reduce((acc, curr) => acc + getConvertedAmount(curr.amount, curr.currency || 'IDR', displayCurrency), 0);
        const rExpense = filteredTx.filter(t => t.type === 'expense').reduce((acc, curr) => acc + getConvertedAmount(curr.amount, curr.currency || 'IDR', displayCurrency), 0);
        
        const balanceRatio = totalIncome > 0 ? (balance / totalIncome) : 0;
        const isBalanceDepleted = balance <= 0 && transactions.length > 0;
        const isBalanceLow = balance > 0 && balanceRatio <= 0.15;

        const groupedChart = {};
        filteredTx.filter(t => t.type === 'expense').forEach(tx => { groupedChart[tx.categoryId] = (groupedChart[tx.categoryId] || 0) + getConvertedAmount(tx.amount, tx.currency || 'IDR', displayCurrency); });
        const chartTotal = Object.values(groupedChart).reduce((a,b)=>a+b, 0);
        const c1 = customTheme.primary;
        const c2 = customTheme.expense;
        const c3 = customTheme.income;
        const c4 = '#007AFF';
        const chartColors = [c1, c2, c3, c4, '#5856D6', '#FF9500'];
        let cumulativePercent = 0;
        const chartSlices = Object.entries(groupedChart).sort((a,b)=>b[1]-a[1]).map(([catId, amount], idx) => {
           const percent = amount / chartTotal;
           const slice = { catId, amount, percent, color: chartColors[idx % chartColors.length], start: cumulativePercent };
           cumulativePercent += percent;
           return slice;
        });
        const gradientString = chartTotal > 0 ? chartSlices.map(s => `${s.color} ${s.start * 100}% ${(s.start + s.percent) * 100}%`).join(', ') : '#E5E5EA 0% 100%';

        const currentBalanceBg = widgetConfig.balanceBg;
        const balanceOverlay = currentBalanceBg ? 'bg-black/30' : '';

        return (
          <div className="p-4 md:p-8 pb-32 animate-fade-in relative z-10 max-w-2xl mx-auto">

                 <RefreshCw size={12} className={isLoadingRate ? 'animate-spin' : ''} />
                 <span>{isLoadingRate ? (lang === 'id' ? 'Memuat...' : 'Loading...') : 'Live Rates'}</span>
              </button>
            </div>

            <div className={`rounded-[20px] p-6 shadow-sm relative overflow-hidden mb-6 transition-all duration-500 ${!currentBalanceBg ? 'bg-theme text-white' : 'text-white'}`}
                 style={currentBalanceBg ? { backgroundImage: `url(${currentBalanceBg})`, backgroundSize: 'cover', backgroundPosition: 'center' } : {}}>
              {currentBalanceBg && <div className={`absolute inset-0 backdrop-blur-[1px] transition-all duration-500 ${balanceOverlay}`}></div>}
              <div className="relative z-10">
                <div className="flex justify-between items-start mb-2">
                    <p className="text-white/90 text-sm font-medium">{t.totalBalance}</p>
                    <div className="flex items-center gap-2">
                        {isBalanceDepleted ? (
                            <span className="bg-red-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-sm animate-pulse">⚠️ {lang==='id'?'SALDO HABIS':'残高枯渇'}</span>
                        ) : isBalanceLow ? (
                            <span className="bg-orange-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-sm">⚠️ {lang==='id'?'SALDO MENIPIS':'残高減少'}</span>
                        ) : null}

                           {hideBalance ? <EyeOff size={16}/> : <Eye size={16}/>}

                           <Edit2 size={16} />
                        </button>
                    </div>
                </div>
                <h2 className="text-4xl font-bold mb-6 tracking-tight text-white">{formatCurrency(balance, displayCurrency)}</h2>
                <div className="flex bg-black/20 backdrop-blur-md p-4 rounded-xl items-center justify-between">
                  <div className="flex-1">
                    <p className="text-white/80 text-[10px] uppercase font-semibold mb-1">{t.income}</p>
                    <p className="font-semibold text-sm text-white">{formatCurrency(totalIncome, displayCurrency)}</p>
                  </div>
                  <div className="w-px bg-white/25 h-8 mx-4"></div>
                  <div className="flex-1 text-right">
                    <p className="text-white/80 text-[10px] uppercase font-semibold mb-1">{t.expense}</p>
                    <p className="font-semibold text-sm text-white">{formatCurrency(totalExpense, displayCurrency)}</p>
                  </div>
                </div>
              </div>
            </div>

            <div className="mb-6">
               <div className="flex justify-between items-center mb-3">
                  <h3 className="font-bold text-main ml-2 text-sm">{t.wallets} <span className="text-xs font-normal text-gray-400">({t.swipeHint})</span></h3>
               </div>

               <div 
                  className="relative w-full h-[210px] touch-pan-y"
                  onTouchStart={onTouchStart}
                  onTouchMove={onTouchMove}
                  onTouchEnd={onTouchEnd}
               >
                  {walletOrder.slice(0, 3).map((wId, stackIndex) => {
                     const w = wallets.find(item => item.id === wId);
                     if (!w) return null;
                     const wBal = transactions.filter(tx => tx.walletId === w.id).reduce((acc, curr) => acc + (curr.type === 'income' ? 1 : -1) * getConvertedAmount(curr.amount, curr.currency || 'IDR', displayCurrency), 0);
                     const walletName = lang === 'id' ? w.name : w.nameJp;
                     
                     const getWalletStyle = (name) => {
                         const lower = name.toLowerCase();
                         if (lower.includes('gopay')) return { bg: 'from-emerald-500 via-teal-600 to-emerald-900', brand: 'GoPay', logoColor: 'text-emerald-300' };
                         if (lower.includes('ovo')) return { bg: 'from-purple-600 via-indigo-700 to-purple-950', brand: 'OVO', logoColor: 'text-purple-300' };
                         if (lower.includes('dana')) return { bg: 'from-blue-500 via-blue-600 to-indigo-900', brand: 'DANA', logoColor: 'text-blue-200' };
                         if (lower.includes('shopee')) return { bg: 'from-orange-500 via-amber-600 to-red-800', brand: 'ShopeePay', logoColor: 'text-orange-200' };
                         if (lower.includes('suica')) return { bg: 'from-emerald-600 via-green-700 to-teal-950', brand: 'Suica JR', logoColor: 'text-emerald-200' };
                         if (lower.includes('pasmo')) return { bg: 'from-pink-500 via-rose-600 to-red-900', brand: 'PASMO', logoColor: 'text-pink-200' };
                         if (lower.includes('ic card')) return { bg: 'from-teal-600 via-cyan-800 to-slate-950', brand: 'IC CARD', logoColor: 'text-cyan-200' };
                         if (lower.includes('bank') || lower.includes('bca') || lower.includes('mandiri') || lower.includes('bni') || lower.includes('bri')) return { bg: 'from-blue-700 via-sky-800 to-slate-950', brand: 'BANK CARD', logoColor: 'text-sky-300' };
                         if (lower.includes('tunai') || lower.includes('cash')) return { bg: 'from-slate-700 via-zinc-800 to-stone-950', brand: 'CASH WALLET', logoColor: 'text-amber-300' };
                         return { bg: 'from-zinc-700 via-zinc-800 to-zinc-950', brand: 'MAWUANG CARD', logoColor: 'text-zinc-300' };
                     };
                     
                     const styleInfo = getWalletStyle(walletName);
                     
                     const topOffsets = [0, 28, 56];
                     const scales = [1, 0.96, 0.92];
                     const opacities = [1, 0.85, 0.7];

                     return (
                       <div 
                          key={w.id} 
                          onClick={() => bringToFront(w.id)}
                          className={`absolute left-0 right-0 h-[175px] rounded-2xl bg-gradient-to-br ${styleInfo.bg} shadow-2xl p-5 flex flex-col justify-between text-white transition-all duration-300 ease-out cursor-pointer select-none border border-white/20`}
                          style={{ 
                              top: `${topOffsets[stackIndex]}px`, 
                              zIndex: 3 - stackIndex,
                              transform: `scale(${scales[stackIndex]})`,
                              transformOrigin: 'top center',
                              opacity: opacities[stackIndex]
                          }}
                       >
                          <div className="absolute -top-12 -right-12 w-36 h-36 bg-white/10 rounded-full blur-2xl pointer-events-none"></div>
                          
                          <div className="flex justify-between items-start relative z-10">
                             <div>
                                <span className={`text-[10px] font-extrabold uppercase tracking-widest ${styleInfo.logoColor}`}>{styleInfo.brand}</span>
                                <h4 className="font-bold text-base tracking-tight truncate max-w-[160px]">{walletName}</h4>
                             </div>
                             <div className="w-10 h-8 rounded-md bg-gradient-to-tr from-amber-200 via-yellow-300 to-amber-100 flex items-center justify-center shadow-inner opacity-90">
                                <div className="w-7 h-5 border border-amber-500/40 rounded-sm grid grid-cols-2 grid-rows-2 gap-0.5 p-0.5">
                                   <div className="border-b border-r border-amber-600/40"></div>
                                   <div className="border-b border-l border-amber-600/40"></div>
                                   <div className="border-t border-r border-amber-600/40"></div>
                                   <div className="border-t border-l border-amber-600/40"></div>
                                </div>
                             </div>
                          </div>

                          <div className="relative z-10">
                             <div className="flex justify-between items-end mb-1">
                                <div>
                                   <p className="text-[10px] text-white/70 uppercase font-medium">{t.availableBalance}</p>
                                   <p className="font-extrabold text-xl tracking-tight">{formatCurrency(wBal, displayCurrency)}</p>
                                </div>
                                <div className="flex items-center space-x-1 opacity-75">
                                   <div className="w-2 h-2 rounded-full bg-white/60"></div>
                                   <div className="w-2 h-2 rounded-full bg-white/40"></div>
                                   <div className="w-2 h-2 rounded-full bg-white/20"></div>
                                </div>
                             </div>
                             <div className="flex justify-between items-center text-[10px] text-white/60 tracking-widest font-mono">
                               <span>•••• ••••</span>
                               <span className="font-bold text-white/90">mawuang</span>
                             </div>
                          </div>
                       </div>
                     );
                  })}
               </div>
            </div>

            <div className="card-bg p-5 rounded-[20px] shadow-sm border border-gray-100 mb-6">

                     <h3 className="font-semibold text-main text-sm">{t.danaTalang}</h3>
                  </div>
                  <button onClick={() => setIsDanaTalangModalOpen(true)} className="text-xs font-semibold text-theme bg-theme/10 px-3 py-1.5 rounded-full active:opacity-70">{danaTalang.total > 0 ? t.edit : t.setupLoan}</button>
               </div>
               {danaTalang.total > 0 ? (
                  <div>
                     <div className="flex justify-between text-[11px] text-gray-500 mb-2 font-medium">

                        <span>{t.totalLoan}: {formatCurrency(danaTalang.total, danaTalang.currency)}</span>
                     </div>
                     <div className="w-full bg-gray-100 rounded-full h-2.5 mb-3 overflow-hidden">
                        <div className="bg-theme h-full rounded-full transition-all duration-500" style={{width: `${Math.min(danaTalang.total > 0 ? (danaTalang.paid / danaTalang.total) * 100 : 0, 100)}%`}}></div>
                     </div>
                     <div className="flex justify-between items-center pt-2 border-t border-gray-100">
                        <span className="text-xs font-medium text-gray-500">{t.remainingLoan}</span>
                        <span className="text-lg font-bold text-orange-500">{formatCurrency(Math.max(danaTalang.total - danaTalang.paid, 0), danaTalang.currency)}</span>
                     </div>
                  </div>
               ) : (
                  <p className="text-xs text-gray-500">{lang === 'id' ? 'Catat dan pantau sisa hutang dana talang LPK Anda di sini.' : 'ここで立替金の残高を記録・追跡します。'}</p>
               )}
            </div>

            <div className="flex bg-gray-200/60 rounded-[10px] p-1 mb-4">
              {['week', 'month', 'year', 'custom'].map(period => (
                <button key={period} onClick={() => setReportPeriod(period)} className={`flex-1 py-1.5 text-[11px] font-semibold rounded-[8px] transition-all truncate px-1 ${reportPeriod === period ? 'bg-white text-main shadow-sm' : 'text-gray-500'}`}>
                  {period === 'week' ? t.weekly : period === 'month' ? t.monthly : period === 'year' ? t.yearly : t.custom}
                </button>
              ))}
            </div>
            {reportPeriod === 'custom' && (
              <div className="flex gap-3 mb-4">
                <div className="flex-1 bg-gray-50 rounded-[10px] p-2 border border-gray-100">
                  <label className="block text-[9px] text-gray-500 uppercase font-semibold mb-1">{t.startDate}</label>
                  <input type="date" value={customStartDate} onChange={e => setCustomStartDate(e.target.value)} className="w-full text-xs text-main bg-transparent outline-none"/>
                </div>
                <div className="flex-1 bg-gray-50 rounded-[10px] p-2 border border-gray-100">
                  <label className="block text-[9px] text-gray-500 uppercase font-semibold mb-1">{t.endDate}</label>
                  <input type="date" value={customEndDate} onChange={e => setCustomEndDate(e.target.value)} className="w-full text-xs text-main bg-transparent outline-none"/>
                </div>
              </div>
            )}

            <div className="grid grid-cols-2 gap-3 mb-6">
              <div className="card-bg p-4 rounded-[16px] shadow-sm border border-gray-100">
                <p className="text-[11px] font-semibold text-gray-500 mb-1">{t.income}</p>
                <p className="font-bold text-green-600 truncate text-base">{formatCurrency(rIncome, displayCurrency)}</p>
              </div>
              <div className="card-bg p-4 rounded-[16px] shadow-sm border border-gray-100">
                <p className="text-[11px] font-semibold text-gray-500 mb-1">{t.expense}</p>
                <p className="font-bold text-red-500 truncate text-base">{formatCurrency(rExpense, displayCurrency)}</p>
              </div>
            </div>

            <div className="card-bg p-5 rounded-[20px] shadow-sm border border-gray-100 mb-6">
              <h3 className="font-bold text-main mb-5 text-sm">{t.chart}</h3>
              {chartTotal > 0 ? (
                <div className="flex flex-col md:flex-row items-center gap-6">
                  <div className="w-32 h-32 rounded-full flex-shrink-0" style={{ background: `conic-gradient(${gradientString})` }}></div>
                  <div className="flex-1 w-full space-y-2.5">
                    {chartSlices.slice(0, 5).map(s => (
                      <div key={s.catId} className="flex items-center justify-between text-xs">
                        <div className="flex items-center gap-2 overflow-hidden pr-2">
                          <div className="w-2.5 h-2.5 rounded-full flex-shrink-0" style={{backgroundColor: s.color}}></div>
                          <span className="truncate font-medium text-main">{getCatName(categories.find(c=>c.id===s.catId))}</span>
                        </div>
                        <span className="font-semibold text-gray-500">{Math.round(s.percent * 100)}%</span>
                      </div>
                    ))}
                  </div>
                </div>
              ) : ( <p className="text-xs text-gray-500 text-center py-4">{t.noTransactions}</p> )}
            </div>

            <h3 className="font-bold text-main mb-3 ml-2 text-sm">{t.transactionDetails}</h3>
            {filteredTx.length === 0 ? (
              <div className="text-center py-8 card-bg rounded-[20px] border border-gray-100 border-dashed shadow-sm">
                <p className="text-gray-500 text-xs">{t.noTransactions}</p>

                  )}

                  <div className="flex gap-3">
                    <button onClick={() => { const txToEdit = selectedTx; setSelectedTx(null); handleOpenTxModal(txToEdit.type, txToEdit.amount, txToEdit.currency || 'IDR', txToEdit.note || '', txToEdit.photo || '', txToEdit.walletId, txToEdit.id, txToEdit.categoryId); }} className="flex-1 bg-theme text-white py-3.5 rounded-xl font-bold flex items-center justify-center gap-2"><Edit2 size={16} /> {t.edit}</button>
                    <button onClick={() => { const id = selectedTx.id; setSelectedTx(null); handleDeleteTx(id); }} className="flex-1 bg-red-50 text-red-500 py-3.5 rounded-xl font-bold flex items-center justify-center gap-2"><Trash2 size={16} /> {t.delete}</button>
                  </div>
                </div>
              </div>
            )}

            {previewImage && (
              <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/90 backdrop-blur-xl p-4 animate-fade-in" onClick={() => setPreviewImage(null)}>
                <button className="absolute top-6 right-6 p-3 bg-white/20 rounded-full text-white"><X size={24} /></button>
                <img src={previewImage} onClick={e => e.stopPropagation()} className="max-w-full max-h-[85vh] object-contain rounded-2xl animate-slide-up" alt="Preview" />
              </div>
            )}
            
            {isSupportModalOpen && (
              <div className="fixed inset-0 z-[120] flex items-end md:items-center justify-center bg-black/40 backdrop-blur-sm animate-fade-in p-0 md:p-4">
                 <div className="bg-white w-full max-w-md rounded-t-[32px] md:rounded-[32px] p-5 pb-safe animate-slide-up shadow-2xl relative h-[85vh] md:h-[600px] flex flex-col mx-auto">
                    <button onClick={() => setIsSupportModalOpen(false)} className="absolute top-5 right-5 p-2 bg-gray-100 rounded-full text-gray-500 hover:text-gray-700 z-10"><X size={18}/></button>
                    
                    <div className="flex items-center gap-3 mb-4 mt-2">
                       <div className="p-3 bg-teal-100 text-teal-600 rounded-2xl"><Bot size={24}/></div>
                       <div>
                         <h3 className="font-bold text-lg text-main">Customer Support</h3>
                         <p className="text-xs text-teal-600 font-medium">{t.aiAgent}</p>
                       </div>
                    </div>
                    
                    <div className="flex-1 bg-gray-100 rounded-[24px] p-4 overflow-y-auto hide-scrollbar space-y-4 mb-4 flex flex-col">
                       <div className="flex items-end gap-2 max-w-[85%]">
                          <div className="w-8 h-8 rounded-full bg-teal-100 text-teal-600 flex items-center justify-center flex-shrink-0"><Bot size={16}/></div>
                          <div className="bg-white p-3 rounded-2xl rounded-bl-sm shadow-sm text-sm text-main">{t.supportWelcome}</div>
                       </div>
                       
                       {supportChat.map((chat, idx) => (
                          <div key={idx} className={`flex items-end gap-2 max-w-[85%] ${chat.isUser ? 'self-end flex-row-reverse' : ''}`}>
                             {!chat.isUser && <div className="w-8 h-8 rounded-full bg-teal-100 text-teal-600 flex items-center justify-center flex-shrink-0"><Bot size={16}/></div>}
                             <div className={`p-3 rounded-2xl shadow-sm text-sm ${chat.isUser ? 'bg-theme text-white rounded-br-sm' : 'bg-white text-main rounded-bl-sm'}`}>
                                {chat.text}
                             </div>
                          </div>
                       ))}
                       
                       {isAiTyping && (
                          <div className="flex items-end gap-2 max-w-[85%]">
                            <div className="w-8 h-8 rounded-full bg-teal-100 text-teal-600 flex items-center justify-center flex-shrink-0"><Bot size={16}/></div>
                            <div className="bg-white p-4 rounded-2xl rounded-bl-sm shadow-sm flex items-center gap-1.5">
                               <div className="w-2 h-2 bg-gray-300 rounded-full animate-bounce"></div>
                               <div className="w-2 h-2 bg-gray-300 rounded-full animate-bounce" style={{animationDelay: '0.1s'}}></div>
                               <div className="w-2 h-2 bg-gray-300 rounded-full animate-bounce" style={{animationDelay: '0.2s'}}></div>
                            </div>
                          </div>
                       )}
                       
                       {supportChat.some(c => c.isUser) && !isAiTyping && (
                         <div className="flex justify-center mt-6 mb-2 animate-fade-in">
                            <a href={`mailto:ricky30chandra@gmail.com?subject=${encodeURIComponent(t.emailSubject)}`} className="bg-white border border-gray-200 shadow-sm text-main px-4 py-2.5 rounded-full text-xs font-bold flex items-center gap-2 active:scale-95 transition-transform"><MessageCircle size={16} className="text-teal-600"/> {t.sendEmail}</a>
                         </div>
                       )}
                    </div>

                    <div className="flex gap-2 relative z-10 bg-white pt-2 mb-2">
                       <input type="text" value={supportInput} onChange={e => setSupportInput(e.target.value)} onKeyDown={e => e.key === 'Enter' && handleSendSupport()} placeholder={t.typeMessage} className="flex-1 bg-gray-100 border-none rounded-2xl px-4 py-3 text-sm text-main outline-none focus:ring-2 focus:ring-teal-500 transition-all"/>
                       <button onClick={handleSendSupport} disabled={!supportInput.trim() || isAiTyping} className="bg-teal-500 text-white p-3 rounded-2xl active:scale-95 transition-transform disabled:opacity-50 flex items-center justify-center"><Send size={18}/></button>
                    </div>
                 </div>
              </div>
            )}
            
            {toastMsg && (
              <div className="fixed top-10 left-1/2 transform -translate-x-1/2 z-[110] bg-gray-800 text-white px-5 py-3 rounded-full shadow-lg flex items-center gap-2 animate-slide-up"><Check size={16} /><span className="font-medium text-sm">{toastMsg}</span></div>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <ErrorBoundary>
           <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
