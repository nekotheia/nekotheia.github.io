    const getCurrentDateTimeLocal = () => {
      const now = new Date();
      now.setMinutes(now.getMinutes() - now.getTimezoneOffset());

    };

    const compressImage = (file, callback) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = event => {
        const img = new Image();
        img.src = event.target.result;
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const MAX_WIDTH = 600; 
          let scaleSize = 1;
          if (img.width > MAX_WIDTH) { scaleSize = MAX_WIDTH / img.width; }
          canvas.width = img.width * scaleSize;
          canvas.height = img.height * scaleSize;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          callback(canvas.toDataURL('image/jpeg', 0.7));
        }
      }
    };

        setIsLoadingRate(true);
        try {
          const response = await fetch('https://api.exchangerate-api.com/v4/latest/JPY');
          const data = await response.json();
          if (data && data.rates && data.rates.IDR) setExchangeRate(data.rates.IDR);
        } catch (error) { console.error("Gagal mengambil data kurs:", error); } 
        finally { setIsLoadingRate(false); }

      const formatCurrency = (amount, currencyCode) => {
        if (currencyCode === 'JPY') return new Intl.NumberFormat('ja-JP', { style: 'currency', currency: 'JPY' }).format(amount);
        return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(amount);
      };

      const getConvertedAmount = (amount, fromCurrency, toCurrency) => {
        if (fromCurrency === toCurrency) return amount;
        if (fromCurrency === 'JPY' && toCurrency === 'IDR') return amount * exchangeRate;
        if (fromCurrency === 'IDR' && toCurrency === 'JPY') return amount / exchangeRate;
        return amount;
      };

      const handleDeleteWallet = (id) => {
        if(wallets.length <= 1) return setMessageDialog({isOpen: true, title: 'Error', message: lang === 'id' ? 'Minimal harus ada 1 dompet!' : '少なくとも1つのウォレットが必要です！'});
        setWallets(wallets.filter(w => w.id !== id));
      };

      const handlePhotoUpload = (e) => {
        const file = e.target.files[0];
        if (file) compressImage(file, (dataUrl) => setTxFormData({ ...txFormData, photo: dataUrl }));
      };

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          setIsScanning(true);
          setScanError(false);
          
          compressImage(file, async (compressedDataUrl) => {
            try {
              const result = await Tesseract.recognize(file, 'ind+eng+jpn');
              const text = result.data.text.toUpperCase();
              
              let foundAmount = '';
              const flatText = text.replace(/\s+/g, ' ').replace(/T O T A L/g, 'TOTAL').replace(/合 計/g, '合計');

              // Strict Japanese Receipt Detection
              const isJapaneseReceipt = /(¥|円|合計|お買上額|お預り|お釣|消費税|SUICA|PASMO|PAYPAY)/.test(flatText);
              const detectedCurrency = isJapaneseReceipt ? 'JPY' : 'IDR';

              let detectedWallet = wallets[0]?.id || 'cash';
              const ewalletRegex = /(QRIS|PAYPAY|SUICA|PASMO|電子マネー|GOPAY|SHOPEEPAY|SPAY|OVO|DANA|LINKAJA|E-WALLET)/;
              const bankRegex = /(CREDIT|KREDIT|DEBIT|KARTU|CARD|カード|クレジット|MANDIRI|BCA|BNI|BRI|VISA|MASTER)/;
              
              if (ewalletRegex.test(flatText)) detectedWallet = wallets.find(w => w.id === 'ewallet' || w.name.toUpperCase().includes('E-WALLET') || w.name.toUpperCase().includes('PAY'))?.id || detectedWallet;
              else if (bankRegex.test(flatText)) detectedWallet = wallets.find(w => w.id === 'bank' || w.name.toUpperCase().includes('BANK') || w.name.toUpperCase().includes('KARTU'))?.id || detectedWallet;

              const getAmountFromProximity = (keywordsArray) => {
                  let maxVal = 0;
                  for (let kw of keywordsArray) {
                      let startIndex = 0, index;
                      while ((index = flatText.indexOf(kw, startIndex)) > -1) {
                          const scanRadius = flatText.substring(index, index + kw.length + 80);
                          const matches = scanRadius.match(/(?:RP|¥)?\s*(\d{1,3}([.,]\d{3})+|\d{3,8})/g);
                          if (matches) {
                              for(let m of matches) {
                                  const cleanVal = parseInt(m.replace(/[^\d]/g, ''), 10);
                                  if (cleanVal > 0 && cleanVal < 50000000 && cleanVal.toString().length < 9) {
                                      if(cleanVal > maxVal) maxVal = cleanVal;
                                  }
                              }
                          }
                          startIndex = index + kw.length;
                      }
                      if (maxVal > 0) return maxVal.toString(); 
                  }
                  return '';
              };

              const tier1 = ['TOTAL BELANJA', 'GRAND TOTAL', 'TOTAL TAGIHAN', 'HARGA JUAL', 'お買上額'];
              const tier2 = ['TOTAL', 'T0TAL', 'AMOUNT', '合計', '計', 'CREDIT', 'KREDIT', 'DEBIT', 'QRIS', 'PAYPAY', 'SUICA', 'PASMO', 'カード', 'クレジット', '電子マネー', 'GOPAY', 'SHOPEEPAY'];
              const tier3 = ['BAYAR', 'DIBAYAR', 'CASH', 'TUNAI', '預り', 'お預り'];

              foundAmount = getAmountFromProximity(tier1);
              if (!foundAmount) foundAmount = getAmountFromProximity(tier2);
              if (!foundAmount) foundAmount = getAmountFromProximity(tier3);
              
              if (!foundAmount) {
                  const fallbackRegex = /(?:RP|¥|YEN|円)\s*(\d+([.,]\d{3})*)/g;
                  let match, maxFallback = 0;
                  while ((match = fallbackRegex.exec(flatText)) !== null) {
                      const val = parseInt(match[1].replace(/[^\d]/g, ''), 10);
                      if (val > maxFallback && val < 50000000) maxFallback = val;
                  }
                  if (maxFallback > 0) foundAmount = maxFallback.toString();
              }

              setIsScanning(false);
              setIsScannerOpen(false);
              
              if (foundAmount) {
                 handleOpenTxModal('expense', foundAmount, detectedCurrency, lang === 'id' ? 'Dari Pindai Struk' : 'レシートスキャンから', compressedDataUrl, detectedWallet);
              } else {
                 setTempScanPhoto(compressedDataUrl);
                 setScanError(true);
                 setIsScannerOpen(true);
              }
              
            } catch (err) {
              console.error("Gagal membaca struk:", err);
              setIsScanning(false);
              setTempScanPhoto(compressedDataUrl);
              setScanError(true);
            }
          });
        }
      };

      const handleExportCSV = () => {
        let finalFileName = exportFileName.trim() || `mawuang_report_${new Date().toISOString().slice(0, 10)}`;
        if (!finalFileName.endsWith('.csv')) finalFileName += '.csv';

        const headers = ['Transaction ID', 'Date', 'Time', 'Type', 'Category', 'Wallet', 'Note', 'Currency', 'Amount', `Converted Amount (${displayCurrency})`];
        const rows = transactions.map(tx => {
          const cat = categories.find(c => c.id === tx.categoryId);
          const txDate = new Date(tx.date);
          const convertedAmount = getConvertedAmount(tx.amount, tx.currency || 'IDR', displayCurrency);
          const safeNote = `"${(tx.note || '').replace(/"/g, '""')}"`;
          const safeCat = `"${(getCatName(cat) || 'Unknown').replace(/"/g, '""')}"`;
          
          const rawWallet = getWalletName(tx.walletId) || 'Cash';
          const safeWallet = `"${String(rawWallet).replace(/"/g, '""')}"`;

          return [ tx.id, txDate.toLocaleDateString(), txDate.toLocaleTimeString(), tx.type === 'income' ? 'Income' : 'Expense', safeCat, safeWallet, safeNote, tx.currency || 'IDR', tx.amount, convertedAmount.toFixed(2) ].join(';');
        });
        
        const csvContent = "\uFEFF" + [headers.join(';'), ...rows].join('\n');
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;

        setIsExportModalOpen(false);
        setExportFileName('');

      const handleRestoreJSON = (e) => {
        const file = e.target.files[0];

        const reader = new FileReader();

          } catch (err) {

          }
        };
        reader.readAsText(file);

            <div className="flex gap-3 overflow-x-auto hide-scrollbar pb-2">
              {wallets.map(w => {

                 const wOut = transactions.filter(tx => tx.type === 'expense' && tx.walletId === w.id).reduce((acc, curr) => acc + getConvertedAmount(curr.amount, curr.currency || 'IDR', displayCurrency), 0);
                 const wBal = wIn - wOut;

                 );

          const d = new Date(date);
          const startOfWeek = new Date(now); startOfWeek.setDate(now.getDate() - now.getDay()); startOfWeek.setHours(0, 0, 0, 0);
          const endOfWeek = new Date(now); endOfWeek.setDate(now.getDate() - now.getDay() + 6); endOfWeek.setHours(23, 59, 59, 999);
          return d >= startOfWeek && d <= endOfWeek;
        };

        const filteredTx = transactions.filter(tx => {
          const d = new Date(tx.date);
          if (reportPeriod === 'week') return isThisWeek(d);

          if (reportPeriod === 'year') return d.getFullYear() === currentYear;

            const dt = d.getTime();

          return true;

        const chartTotal = Object.values(groupedChart).reduce((a,b)=>a+b, 0);
        const chartColors = ['#8B9D83', '#D4A373', '#6D7D62', '#C29363', '#A3B19B', '#4A4A4A'];
        let cumulativePercent = 0;
        
        const chartSlices = Object.entries(groupedChart).sort((a,b)=>b[1]-a[1]).map(([catId, amount], idx) => {
           const percent = amount / chartTotal;
           const slice = { catId, amount, percent, color: chartColors[idx % chartColors.length], start: cumulativePercent };
           cumulativePercent += percent;
           return slice;
        });
        const gradientString = chartTotal > 0 ? chartSlices.map(s => `${s.color} ${s.start * 100}% ${(s.start + s.percent) * 100}%`).join(', ') : '#f3f4f6 0% 100%';

        return (
          <div className="p-6 md:p-10 pb-24 md:pb-10 animate-fade-in relative z-10 md:grid md:grid-cols-12 md:gap-8 lg:gap-12 md:items-start">

                  </button>
                ))}
              </div>

              {reportPeriod === 'custom' && (
                <div className="flex gap-3 animate-fade-in">
                  <div className="flex-1 min-w-0">
                    <label className="block text-[10px] font-semibold text-gray-400 mb-1">{t.startDate}</label>
                    <input type="date" value={customStartDate} onChange={e => setCustomStartDate(e.target.value)} className="w-full box-border bg-white border-none rounded-xl px-2 py-2.5 text-[10px] sm:text-xs font-semibold text-[#4A4A4A] focus:ring-2 focus:ring-[#8B9D83] outline-none shadow-[0_4px_20px_-4px_rgba(0,0,0,0.05)] appearance-none"/>
                  </div>

                    <label className="block text-[10px] font-semibold text-gray-400 mb-1">{t.endDate}</label>
                    <input type="date" value={customEndDate} onChange={e => setCustomEndDate(e.target.value)} className="w-full box-border bg-white border-none rounded-xl px-2 py-2.5 text-[10px] sm:text-xs font-semibold text-[#4A4A4A] focus:ring-2 focus:ring-[#8B9D83] outline-none shadow-[0_4px_20px_-4px_rgba(0,0,0,0.05)] appearance-none"/>

                      )}
                    </div>
                    <button onClick={handleSaveTx} className={`w-full py-4 rounded-2xl font-bold text-white mt-6 shadow-lg transition-transform active:scale-95 ${txFormType === 'income' ? 'bg-[#8B9D83] hover:bg-[#778B6F]' : 'bg-[#D4A373] hover:bg-[#C29363]'}`}>{t.save}</button>
                  </div>
                </div>
              </div>
            )}

            {isScannerOpen && (
              <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-md animate-fade-in p-4">
                <div className="bg-white w-full max-w-sm rounded-[32px] p-6 text-center relative overflow-hidden mx-auto shadow-2xl">
                  <button onClick={() => { if(!isScanning) { setIsScannerOpen(false); setScanError(false); setTempScanPhoto(null); } }} className="absolute top-4 right-4 p-2 bg-gray-50 rounded-full text-gray-400 hover:text-gray-700"><X size={20} /></button>
                  <div className="my-8">
                    {isScanning ? (
                      <div className="flex flex-col items-center">
                        <div className="w-16 h-16 border-4 border-[#8B9D83] border-t-transparent rounded-full animate-spin mb-4"></div>
                        <p className="font-semibold text-[#6D7D62]">{t.scanning}</p>
                      </div>
                    ) : scanError ? (
                      <div className="flex flex-col items-center animate-fade-in">
                        <div className="bg-red-50 p-6 rounded-full mb-6"><AlertCircle size={40} className="text-red-400" /></div>
                        <h3 className="font-bold text-lg mb-2 text-[#4A4A4A] text-center leading-snug">{t.scanFailed}</h3>
                        <div className="flex gap-3 mt-4 w-full">
                           <button onClick={() => { setIsScannerOpen(false); handleOpenTxModal('expense', '', 'IDR', lang === 'id' ? 'Ketik nominal manual' : '手動で入力', tempScanPhoto); setTempScanPhoto(null); }} className="flex-1 bg-gray-100 text-[#4A4A4A] px-4 py-4 rounded-2xl font-semibold shadow-sm transition-all active:scale-95">Manual</button>
                           <label className="flex-1 bg-[#4A4A4A] text-white px-4 py-4 rounded-2xl font-semibold cursor-pointer shadow-lg transition-all active:scale-95">
                             Ulangi <input type="file" accept="image/*" className="hidden" onChange={handleFileUpload} />
                           </label>
                        </div>
                      </div>
                    ) : (
                      <div className="flex flex-col items-center">
                        <div className="bg-[#E8EAE6] p-6 rounded-full mb-6"><Camera size={40} className="text-[#8B9D83]" /></div>
                        <h3 className="font-bold text-lg mb-2 text-[#4A4A4A]">{t.scanInstruction}</h3>
                        <label className="mt-4 bg-[#8B9D83] text-white px-8 py-4 rounded-2xl font-semibold cursor-pointer shadow-lg transition-all active:scale-95">
                          {t.scan} <input type="file" accept="image/*" className="hidden" onChange={handleFileUpload} />
                        </label>
                      </div>
                    )}
                  </div>
                </div>
              </div>
            )}

            {isExportModalOpen && (
              <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-md animate-fade-in p-4">
                <div className="bg-white w-full max-w-sm rounded-[32px] p-6 relative overflow-hidden animate-slide-up shadow-2xl mx-auto">
                  <button onClick={() => setIsExportModalOpen(false)} className="absolute top-4 right-4 p-2 bg-gray-50 rounded-full text-gray-400 hover:text-gray-700"><X size={20} /></button>
                  <h3 className="font-bold text-lg mb-4 text-[#4A4A4A] text-center">{t.exportFileName}</h3>
                  <input type="text" value={exportFileName} onChange={(e) => setExportFileName(e.target.value)} placeholder="mawuang_report..." className="w-full box-border min-w-0 bg-gray-50 border-none rounded-2xl p-4 text-[#4A4A4A] focus:ring-2 focus:ring-[#8B9D83] outline-none transition-shadow mb-6 text-center font-medium"/>
                  <button onClick={handleExportCSV} className="w-full bg-[#8B9D83] text-white p-4 rounded-2xl font-bold transition-all active:scale-95 shadow-lg flex justify-center items-center gap-2">
                    <Download size={18} /> {t.exportConfirm}
                  </button>
                </div>
              </div>
            )}

            {pinSetup.isOpen && (
              <div className="fixed inset-0 z-[60] flex items-center justify-center bg-black/60 backdrop-blur-sm animate-fade-in p-4">
                <div className="bg-white w-full max-w-sm rounded-[32px] p-6 relative shadow-2xl text-center mx-auto">
                  <div className="mx-auto w-12 h-12 bg-[#F6EBE1] text-[#D4A373] rounded-full flex items-center justify-center mb-4">
                     {pinSetup.step === 'create' ? <Lock size={24}/> : <Unlock size={24}/>}
                  </div>
                  <h3 className="text-lg font-bold text-[#4A4A4A] mb-2">{pinSetup.step === 'create' ? (lang==='id'?'Atur PIN Baru':'新しいPINを設定') : (lang==='id'?'Hapus PIN':'PINを削除')}</h3>
                  <p className="text-xs text-gray-400 mb-6">{pinSetup.step === 'create' ? (lang==='id'?'Masukkan 4 digit angka keamanan':'4桁のセキュリティ番号を入力してください') : (lang==='id'?'Apakah Anda yakin ingin menghapus keamanan PIN?':'PINセキュリティを削除してもよろしいですか？')}</p>
                  
                  {pinSetup.step === 'create' && (
                    <div className="mb-6">
                       <input type="password" maxLength="4" placeholder="••••" value={pinSetup.input} onChange={(e) => { const val = e.target.value.replace(/\D/g, ''); setPinSetup({...pinSetup, input: val, error: ''}); }} className="w-full text-center tracking-[1em] text-2xl bg-gray-50 border-none rounded-2xl p-4 text-[#4A4A4A] focus:ring-2 focus:ring-[#8B9D83] outline-none" />
                       {pinSetup.error && <p className="text-red-400 text-xs font-semibold mt-2">{pinSetup.error}</p>}
                    </div>
                  )}

                  <div className="flex gap-3">
                    <button onClick={() => setPinSetup({isOpen: false, step: 'create', input: '', error: ''})} className="flex-1 bg-gray-100 text-[#4A4A4A] p-3 rounded-2xl font-bold">{pinSetup.step === 'create' ? t.cancel : (lang === 'id' ? 'Tidak' : 'いいえ')}</button>
                    <button onClick={() => {
                       if (pinSetup.step === 'create') {
                         if (pinSetup.input.length === 4) { setPin(pinSetup.input); setPinSetup({isOpen: false, step: 'create', input: '', error: ''}); setMessageDialog({ isOpen: true, title: lang === 'id' ? 'Sukses' : '成功', message: lang==='id'?'PIN berhasil dipasang!':'PINが正常に設定されました！' }); }
                         else setPinSetup({...pinSetup, error: lang==='id'?'Harus 4 digit angka!':'4桁の数字である必要があります！'});
                       } else {
                         setPin(''); setPinSetup({isOpen: false, step: 'create', input: '', error: ''}); setMessageDialog({ isOpen: true, title: lang === 'id' ? 'Berhasil' : '成功', message: lang==='id'?'PIN berhasil dihapus!':'PINが削除されました！' });
                       }
                    }} className={`flex-1 text-white p-3 rounded-2xl font-bold ${pinSetup.step === 'create' ? 'bg-[#8B9D83]' : 'bg-red-400 hover:bg-red-500'}`}>{pinSetup.step === 'create' ? t.save : (lang === 'id' ? 'Ya, Hapus' : 'はい、削除します')}</button>
                  </div>
                </div>
              </div>
            )}

            {messageDialog.isOpen && (
              <div className="fixed inset-0 z-[70] flex items-center justify-center bg-black/60 backdrop-blur-sm animate-fade-in p-4">
                <div className="bg-white w-full max-w-[280px] rounded-[32px] p-6 text-center shadow-2xl mx-auto">
                  <h3 className="font-bold text-lg text-[#4A4A4A] mb-2">{messageDialog.title}</h3>
                  <p className="text-sm text-gray-500 mb-6">{messageDialog.message}</p>
                  <button onClick={() => setMessageDialog({isOpen: false, title: '', message: ''})} className="w-full bg-[#8B9D83] text-white p-3 rounded-2xl font-bold">OK</button>
                </div>
              </div>
            )}

            {selectedTx && (
              <div className="fixed inset-0 z-[80] flex items-end md:items-center justify-center bg-black/40 backdrop-blur-sm animate-fade-in p-0 md:p-4" onClick={() => setSelectedTx(null)}>
                <div className="bg-white w-full max-w-md rounded-t-[40px] md:rounded-[40px] p-6 pb-12 md:pb-8 animate-slide-up shadow-2xl relative max-h-[90vh] overflow-y-auto hide-scrollbar mx-auto" onClick={e => e.stopPropagation()}>
                  <button onClick={() => setSelectedTx(null)} className="absolute top-6 right-6 p-2 bg-gray-50 rounded-full text-gray-400 hover:text-gray-700"><X size={20} /></button>
                  <div className="flex items-center gap-3 mb-6">
                    <div className={`p-4 rounded-[20px] ${selectedTx.type === 'income' ? 'bg-[#E8EAE6] text-[#8B9D83]' : 'bg-[#F6EBE1] text-[#D4A373]'}`}>
                       {selectedTx.type === 'income' ? <Plus size={24} /> : <Minus size={24} />}
                    </div>
                    <div>
                      <h2 className="text-xl font-bold text-[#4A4A4A]">{t.transactionDetails}</h2>
                      <p className="text-xs text-gray-400 font-medium">{new Date(selectedTx.date).toLocaleDateString(lang === 'id' ? 'id-ID' : 'ja-JP', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })}</p>
                    </div>
                  </div>
                  
                  <div className="bg-gray-50 p-5 rounded-[24px] space-y-4 mb-6">
                     <div className="flex justify-between items-center border-b border-gray-100 pb-3">
                        <span className="text-xs text-gray-400 font-semibold uppercase">{t.amount}</span>
                        <span className={`text-lg font-bold ${selectedTx.type === 'income' ? 'text-[#8B9D83]' : 'text-[#4A4A4A]'}`}>{formatCurrency(selectedTx.amount, selectedTx.currency || 'IDR')}</span>
                     </div>
                     <div className="flex justify-between items-center border-b border-gray-100 pb-3">
                        <span className="text-xs text-gray-400 font-semibold uppercase">{t.categories}</span>
                        <span className="text-sm font-bold text-[#4A4A4A]">{getCatName(categories.find(c => c.id === selectedTx.categoryId)) || '-'}</span>
                     </div>
                     <div className="flex justify-between items-center border-b border-gray-100 pb-3">
                        <span className="text-xs text-gray-400 font-semibold uppercase">{t.wallets}</span>
                        <span className="text-sm font-bold text-[#4A4A4A]">{getWalletName(selectedTx.walletId)}</span>
                     </div>
                     <div className="flex justify-between items-center border-b border-gray-100 pb-3">
                        <span className="text-xs text-gray-400 font-semibold uppercase">{t.dateTime}</span>
                        <span className="text-sm font-bold text-[#4A4A4A]">{new Date(selectedTx.date).toLocaleTimeString(lang === 'id' ? 'id-ID' : 'ja-JP', { hour: '2-digit', minute: '2-digit' })}</span>
                     </div>
                     <div className="flex flex-col gap-1">
                        <span className="text-xs text-gray-400 font-semibold uppercase">{t.note}</span>
                        <span className="text-sm font-medium text-gray-600 italic">"{selectedTx.note || '-'}"</span>
                     </div>
                  </div>

                  {selectedTx.photo && (
                    <div>
                      <span className="text-xs text-gray-400 font-semibold uppercase mb-2 block">Foto / Struk</span>
                      <img src={selectedTx.photo} onClick={() => setPreviewImage(selectedTx.photo)} className="w-full h-40 md:h-48 object-cover rounded-[24px] shadow-sm cursor-pointer hover:opacity-90 transition-opacity" alt="Attachment" />
                    </div>
                  )}
                </div>
              </div>
            )}

            {previewImage && (
              <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/90 backdrop-blur-md p-4 animate-fade-in" onClick={() => setPreviewImage(null)}>
                <button className="absolute top-6 right-6 p-3 bg-white/10 rounded-full text-white hover:bg-white/20 transition-colors backdrop-blur-lg"><X size={24} /></button>
                <img src={previewImage} onClick={e => e.stopPropagation()} className="max-w-full max-h-[85vh] object-contain rounded-2xl shadow-2xl animate-slide-up" alt="Preview" />
              </div>
            )}

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
